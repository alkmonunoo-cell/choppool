function makeSupabaseApi() {
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const must = r => { if (r.error) throw new Error(r.error.message); return r.data; };
  const rpc = async (fn, args) => must(await sb.rpc(fn, args || {}));
  const stamp = { accepted: "accepted_at", ready: "ready_at", picked_up: "picked_up_at", arriving: "arriving_at", delivered: "delivered_at" };
  return {
    demo: false,
    async load() {
      const soft = q => q.then(r => r.error ? null : r.data, () => null);   // optional tables: the app still works before the database update
      const [payMethods, popRows, scoreRows, scRows] = await Promise.all([soft(sb.from("payment_methods").select("*").eq("active", true).order("sort")), soft(sb.from("dish_popularity").select("*")), soft(sb.from("kitchen_scores").select("*")), soft(sb.from("site_kitchen_counts").select("*"))]);
      const pop = {}, scores = {}, siteCounts = {}; (popRows || []).forEach(r => { pop[r.item_id] = r.n; }); (scoreRows || []).forEach(r => { scores[r.kitchen_id] = r; }); (scRows || []).forEach(r => { (siteCounts[r.site_id] = siteCounts[r.site_id] || {})[r.kitchen_id] = r.n; });
      const [settings, sites, menus, items] = await Promise.all([
        sb.from("settings").select("*").eq("id", 1).single().then(must),
        sb.from("public_sites").select("*").order("name").then(must),
        sb.from("public_menus").select("*").order("public_name").then(must),
        sb.from("menu_items").select("*").eq("active", true).order("price").then(must)
      ]);
      return { settings, sites, menus, items, payMethods: payMethods || [], pop, scores, siteCounts };
    },
    async board(date) {
      // One call for the whole board (update 14); falls back to separate reads before the database update
      if (S.boardRpc !== false) { const r = await sb.rpc("board_data", { p_date: date }); if (!r.error) { S.boardRpc = true; return r.data; } if (/board_data|function|schema cache/i.test(r.error.message)) S.boardRpc = false; else throw new Error(r.error.message); }
      await sb.rpc("housekeeping");
      const [pools, load, activity, days] = await Promise.all([
        sb.from("public_pools").select("*").eq("order_date", date).then(must),
        sb.from("kitchen_load").select("*").eq("order_date", date).then(must),
        sb.from("recent_activity").select("*").order("created_at", { ascending: false }).limit(50).then(must),
        sb.from("kitchen_days").select("kitchen_id").eq("order_date", date).then(must)
      ]);
      const l = {}; load.forEach(r => { l[r.kitchen_id] = r.meals; });
      return { pools, load: l, activity, open: days.map(x => x.kitchen_id) };
    },
    placeOrder: r => rpc("place_order", { p_site: r.site, p_item: r.item, p_qty: r.qty, p_name: r.name, p_phone: r.phone, p_ref: r.ref || null,
      p_addons: r.addons || [], p_note: r.note || null, p_special: r.special || null, p_use_wallet: !!r.useWallet, ...(r.join ? { p_join: r.join } : {}) }),
    payQuote: (id, ref, useWallet) => rpc("pay_quote", { p_order: id, p_ref: ref || null, p_use_wallet: !!useWallet }),
    myOrders: ids => rpc("my_orders", { p_ids: ids }),
    addVendor: r => rpc("add_vendor", { p_site: r.site, p_name: r.name, p_whatsapp: r.whatsapp, p_items: r.items, p_lat: r.lat ?? null, p_lng: r.lng ?? null }),
    async user() { const { data } = await sb.auth.getUser(); const u = data && data.user; return u ? { id: u.id, email: u.email, name: (u.user_metadata && (u.user_metadata.name || u.user_metadata.full_name)) || null } : null; },
    async signUp(email, password, name) { const d = must(await sb.auth.signUp({ email, password, options: { data: { name: name || null } } })); if (!d.session) throw new Error("Check your email to confirm your account, then sign in."); return { id: d.user.id, email, name: name || null }; },
    async signIn(email, password) { const d = must(await sb.auth.signInWithPassword({ email, password })); return { id: d.user.id, email, name: (d.user.user_metadata && d.user.user_metadata.name) || null }; },
    async signInGoogle() { must(await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: baseUrl() } })); },
    async signOut() { await sb.auth.signOut(); },
    async updateName(name) { const d = must(await sb.auth.updateUser({ data: { name } })); try { await this.saveProfile({ name }); } catch (e) {} return { id: d.user.id, email: d.user.email, name }; },
    async accountStats() { const r = await sb.rpc("admin_account_stats"); if (r.error && /function|schema cache/i.test(r.error.message)) throw new Error("Run update-7.sql in the Supabase SQL Editor once."); return must(r); },
    async savePayMethod(p) {
      const { id, ...f } = p, miss = e => e && /payment_methods|schema cache|relation/i.test(e.message) ? new Error("Run the latest choppool-update.sql in Supabase once, then try again.") : null;
      if (f.is_main) { const r0 = await sb.from("payment_methods").update({ is_main: false }).neq("id", id || "00000000-0000-0000-0000-000000000000"); if (miss(r0.error)) throw miss(r0.error); }
      const r = id ? await sb.from("payment_methods").update(f).eq("id", id).select("id") : await sb.from("payment_methods").insert(f).select("id");
      if (miss(r.error)) throw miss(r.error); if (!must(r).length) throw new Error("Not saved. Only the owner can change payment options.");
    },
    async removePayMethod(id) { must(await sb.from("payment_methods").delete().eq("id", id)); return "deleted"; },
    async updateSettings(patch) { const r = await sb.from("settings").update(patch).eq("id", 1).select("id");
      if (r.error && /momo_network/i.test(r.error.message)) throw new Error("Run update-10.sql in the Supabase SQL Editor once, then try again.");
      if (r.error && /cap_km/i.test(r.error.message)) throw new Error("Run the latest ChopPool update in the Supabase SQL Editor once, then try again.");
      if (r.error && /base_fare|per_km|column|schema cache/i.test(r.error.message)) throw new Error("Run update-7.sql in the Supabase SQL Editor once, then try again.");
      if (!must(r).length) throw new Error("Not saved. Your account may not have permission to change settings."); },
    async saveProfile(p) { const u = await this.user(); if (u) must(await sb.from("profiles").upsert({ user_id: u.id, email: u.email, ...p })); },
    claimOrders: ids => rpc("claim_orders", { p_ids: ids }),
    wallet: () => rpc("my_wallet"),
    kitchenView: (t, d) => rpc("kitchen_view", { p_token: t, p_date: d }),
    kitchenOpenDay: (t, d) => rpc("kitchen_open_day", { p_token: t, p_date: d }),
    kitchenUpdate: (t, p, s) => rpc("kitchen_update", { p_token: t, p_pool: p, p_status: s }),
    kitchenQuote: (t, o, price) => rpc("kitchen_quote", { p_token: t, p_order: o, p_price: Number(price) }),
    async kitchenDecline(t, o, reason) { const r = await sb.rpc("kitchen_decline", { p_token: t, p_order: o, p_reason: reason || null });
      if (r.error && /function|schema cache/i.test(r.error.message)) throw new Error("ChopPool needs a quick update before you can decline. Please tell ChopPool."); return must(r); },
    async cancelOrder(id, reason, refund) { const r = await sb.rpc("cancel_order", { p_order: id, p_reason: reason || null, p_refund: refund || "wallet" });
      if (r.error && /function|schema cache/i.test(r.error.message)) throw new Error("Cancelling isn't switched on yet. Please contact ChopPool."); return must(r); },
    async waitingPools(date) { const ps = must(await sb.from("public_pools").select("*").eq("order_date", date).eq("status", "waiting")); return ps.filter(p => p.meals > 0); },
    vendorSetMenu: (t, items) => rpc("vendor_set_menu", { p_token: t, p_items: items }),
    riderView: (t, d) => rpc("rider_view", { p_token: t, p_date: d }),
    async riderApply(r) { const x = await sb.rpc("rider_apply", { p_name: r.name, p_phone: r.phone, p_bike: r.bike, p_area: r.area, p_momo: r.momo });
      if (x.error && /function|schema cache/i.test(x.error.message)) throw new Error("Rider sign-up isn't switched on yet. Please contact ChopPool."); return must(x); },
    async vendorRequestListing(t, listing) { const x = await sb.rpc("vendor_request_listing", { p_token: t, p_listing: listing });
      if (x.error && /function|schema cache/i.test(x.error.message)) throw new Error("Listing isn't switched on yet. Please contact ChopPool."); return must(x); },
    savePushSub: async p => { const base = { p_endpoint: p.endpoint, p_p256dh: p.p256dh, p_auth: p.auth, p_order_ids: p.order_ids || [], p_kitchen_token: p.kitchen_token || null, p_rider_token: p.rider_token || null };
      if (p.mute) { try { return await rpc("save_push_sub", { ...base, p_mute: p.mute }); } catch (e) { /* database not on update 17 yet */ } }
      return rpc("save_push_sub", base); },
    notify: body => sb.functions.invoke("notify", { body }),
    riderUpdate: (t, p, s) => rpc("rider_update", { p_token: t, p_pool: p, p_status: s }),
    hostView: (t, d) => rpc("host_view", { p_token: t, p_date: d }),
    collectCode: (t, c, d, pool) => rpc("collect_code", { p_token: t, p_code: c, p_date: d, ...(pool ? { p_pool: pool } : {}) }),
    kitchenSetAuto: (t, days) => rpc("kitchen_set_auto", { p_token: t, p_days: days }),
    kitchenPause: (t, d, on) => rpc("kitchen_pause", { p_token: t, p_date: d, p_paused: !!on }),
    vendorSetPhoto: (t, item, url) => rpc("vendor_set_photo", { p_token: t, p_item: item, p_url: url }),
    submitReview: (id, phone, rating, comment, photo) => rpc("submit_review", { p_order: id, p_phone: phone || "", p_rating: rating, p_comment: comment || null, p_photo: photo || null }),
    async kitchenReviews(kid) { const r = await sb.from("public_reviews").select("*").eq("kitchen_id", kid).order("created_at", { ascending: false }).limit(20); return r.error ? [] : r.data; },
    async adminReviews() { const r = await sb.from("reviews").select("*, orders(customer_name, item_name)").order("created_at", { ascending: false }).limit(150);
      if (r.error) throw new Error(/reviews|schema cache|relation/i.test(r.error.message) ? "Run the latest ChopPool update in Supabase once to see reviews." : r.error.message);
      return r.data.map(x => ({ ...x, name: ((x.orders || {}).customer_name || "").split(" ")[0], item_name: (x.orders || {}).item_name })); },
    async hideReview(id, hidden) { must(await sb.from("reviews").update({ hidden }).eq("id", id)); },
    async uploadReviewPhoto(orderId, blob) {
      const path = "reviews/" + orderId + "/" + Date.now().toString(36) + (blob.type === "image/webp" ? ".webp" : ".jpg");
      const r = await sb.storage.from("dish-photos").upload(path, blob, { contentType: blob.type, cacheControl: "31536000", upsert: false });
      if (r.error) throw new Error(r.error.message);
      return sb.storage.from("dish-photos").getPublicUrl(path).data.publicUrl;
    },
    weeklyReport: wk => rpc("admin_weekly_report", { p_week_start: wk }),
    // Dish photos go to the public "dish-photos" bucket; vendors write only to their own folder
    async uploadPhoto(folder, blob) {
      const path = folder + "/" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + (blob.type === "image/webp" ? ".webp" : ".jpg");
      const r = await sb.storage.from("dish-photos").upload(path, blob, { contentType: blob.type, cacheControl: "31536000", upsert: false });
      if (r.error) throw new Error(/bucket|not found/i.test(r.error.message) ? "Run the latest ChopPool update in Supabase once, then try again." : r.error.message);
      return sb.storage.from("dish-photos").getPublicUrl(path).data.publicUrl;
    },
    isAdmin: () => rpc("is_admin"),
    async adminData(date) {
      await sb.rpc("housekeeping");
      const [orders, pools, riders, sites, kitchens, wallets, items, team, payment_methods] = await Promise.all([
        sb.from("orders").select("*").eq("order_date", date).order("created_at").then(must),
        sb.from("pools").select("*").eq("order_date", date).order("seq").then(must),
        sb.from("riders").select("*").order("name").then(must),
        sb.from("sites").select("*").order("name").then(must),
        sb.from("kitchens").select("*").order("created_at").order("id").then(must),
        rpc("admin_wallets"),
        sb.from("menu_items").select("*").order("name").then(must),
        sb.from("admins").select("*").order("role", { ascending: false }).then(must),
        sb.from("payment_methods").select("*").order("sort").then(r => r.error ? [] : r.data, () => [])
      ]);
      const m = {}; orders.forEach(o => { if (o.status !== "cancelled") m[o.pool_id] = (m[o.pool_id] || 0) + o.qty; });
      return { orders, pools: pools.map(p => ({ ...p, meals: m[p.id] || 0 })), riders, sites, kitchens, wallets, items, team, payment_methods };
    },
    async updateOrder(id, patch) { must(await sb.from("orders").update(patch).eq("id", id)); },
    async updatePool(id, patch) { if (patch.status && stamp[patch.status]) patch[stamp[patch.status]] = new Date().toISOString(); must(await sb.from("pools").update(patch).eq("id", id)); },
    async updateKitchen(id, patch) { const r = await sb.from("kitchens").update(patch).eq("id", id).select("id");
      if (r.error && /lat|lng|column|schema cache/i.test(r.error.message)) throw new Error("Run update-6.sql in the Supabase SQL Editor once, then try again.");
      if (!must(r).length) throw new Error("Not saved. Your account may not have permission to edit kitchens."); },
    async creditWallet(user_id, amount, reason) { must(await sb.from("wallet_entries").insert({ user_id, amount: Number(amount), reason, created_by: "coordinator" })); },
    myRole: () => rpc("my_role"),
    claimOwner: () => rpc("claim_owner"),
    requestSite: r => rpc("request_site", { p_name: r.name, p_drop_point: r.drop_point, p_lat: r.lat, p_lng: r.lng, p_note: r.note || null }),
    async addKitchen(k) { return must(await sb.from("kitchens").insert(k).select().single()); },
    async saveItem(it) { if (it.id) { const { id, ...p } = it; must(await sb.from("menu_items").update(p).eq("id", id)); } else must(await sb.from("menu_items").insert(it)); },
    async addRider(r) { must(await sb.from("riders").insert(r)); },
    async updateRider(id, p) { must(await sb.from("riders").update(p).eq("id", id)); },
    async addSite(si) { must(await sb.from("sites").insert(si)); },
    async updateSite(id, p) { must(await sb.from("sites").update(p).eq("id", id)); },
    async addTeam(email, role) { const u = await this.user(); must(await sb.from("admins").insert({ email, role, added_by: u ? u.email : null })); },
    async removeTeam(email) { must(await sb.from("admins").delete().eq("email", email)); },
    async removeKitchen(id) { try { return await rpc("admin_remove_kitchen", { p_id: id }); } catch (e) { throw /function|schema cache/i.test(e.message) ? new Error("Run update-6.sql in the Supabase SQL Editor once, then try again.") : e; } },
    async removeSite(id) { try { return await rpc("admin_remove_site", { p_id: id }); } catch (e) { throw /function|schema cache/i.test(e.message) ? new Error("Run update-6.sql in the Supabase SQL Editor once, then try again.") : e; } },
    async updateTeam(email, role) { must(await sb.from("admins").update({ role }).eq("email", email)); }
  };

async function refreshUser() {
  try { S.user = await api.user(); } catch (e) { S.user = null; }
  S.balance = 0;
  S.walletEntries = null;
  if (S.user) { try { const w = await api.wallet(); S.balance = Number(w.balance) || 0; S.walletEntries = w.entries || []; } catch (e) {} }
  renderHero(); updateBellDot();
  if (S.tab === "wallet") renderWallet();
}

// Wallet activity: latest 3, the rest grouped by day behind "See all activity"
function activityHtml(entries) {
  if (!entries.length) return `<div class="ledger"><div><span class="muted">No activity yet. Order from a pool to start earning cashback.</span></div></div>`;
  const row = e => `<div><span>${esc(e.reason)}</span><strong class="num" style="color:${e.amount < 0 ? "var(--muted)" : "var(--ok)"}">${e.amount < 0 ? "−" : "+"}${money(Math.abs(e.amount))}</strong></div>`;
  const dayOf = e => { const d = String(e.at || "").slice(0, 10), t = today(), y = new Date(Date.now() - 864e5).toISOString().slice(0, 10); return d === t ? "Today" : d === y ? "Yesterday" : d ? fmtDate(d) : ""; };
  const first = entries.slice(0, 3), rest = entries.slice(3), open = !!local.get("cp_act_open");
  let groups = "", last = null;
  rest.forEach(e => { const g = dayOf(e); if (g !== last) { groups += `<p class="ledger-day">${esc(g)}</p>`; last = g; } groups += row(e); });
  return `<div class="ledger">${first.map(row).join("")}</div>${rest.length ? `<div class="collapse${open ? " open" : ""}" id="actMore" data-n="${entries.length}"><div><div class="ledger">${groups}</div></div></div>
    <button class="linkbtn" id="actToggle" style="justify-self:center">${open ? "Show less" : "See all activity (" + entries.length + ")"}</button>` : ""}`;
}

function openAccount(reason, startMode) {
  // Phones that have signed in before open on Sign in; "I already have an account" always does
  let mode = startMode || (local.get("cp_had_account") ? "signin" : "signup");
  const draw = () => openSheet(`
    ${sheetHead(mode === "signup" ? "Create your account" : "Welcome back", mode === "signup" ? "Keep your delivery cashback and order from any phone." : "Sign in to see your wallet and orders.")}
    ${reason ? `<p class="note">${esc(reason)}</p>` : ""}
    ${CONFIG.GOOGLE_SIGN_IN || DEMO ? `<button class="ghost wide" id="google">Continue with Google</button><p class="small muted center">or use your email</p>` : ""}
    <form id="authForm" class="stack" novalidate>
      ${mode === "signup" ? `<div><label for="aName">Your name</label><input id="aName" autocomplete="name" placeholder="Your name"></div>` : ""}
      <div><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" placeholder="Email address"></div>
      <div><label for="aPw">Password</label><input id="aPw" type="password" autocomplete="${mode === "signup" ? "new-password" : "current-password"}" placeholder="At least 6 characters"></div>
      <p class="err" id="aErr"></p>
      <button class="btn wide" type="submit">${mode === "signup" ? "Create account" : "Sign in"}</button>
    </form>
    <p class="small center">${mode === "signup" ? "Already have an account?" : "New to ChopPool?"} <button class="linkbtn" id="swap">${mode === "signup" ? "Sign in" : "Create an account"}</button></p>`);
  const wire = () => {
    $("#swap").addEventListener("click", () => { mode = mode === "signup" ? "signin" : "signup"; draw(); wire(); });
    $("#google")?.addEventListener("click", async () => { try { await api.signInGoogle(); } catch (e) { $("#aErr").textContent = cleanErr(e); } });
    $("#authForm").addEventListener("submit", async ev => {
      ev.preventDefault();
      const email = $("#aEmail").value.trim(), pw = $("#aPw").value;
      if (!/^\S+@\S+\.\S+$/.test(email)) return ($("#aErr").textContent = "Enter a valid email address.");
      if (pw.length < 6) return ($("#aErr").textContent = "Use at least 6 characters for the password.");
      const nm = mode === "signup" ? $("#aName").value.trim() : "";
      if (mode === "signup" && nm.length < 2) return ($("#aErr").textContent = "Add your name.");
      try {
        mode === "signup" ? await api.signUp(email, pw, nm) : await api.signIn(email, pw); local.set("cp_had_account", true);
        await afterSignIn();
        closeSheet(); toast("You're signed in. Cashback from your orders now goes to your wallet.");
      } catch (e) { $("#aErr").textContent = cleanErr(e); }
    });
  };
  draw(); wire();
}
async function afterSignIn() {
  const me = local.get("cp_me") || {};

  try { await api.saveProfile({ name: (S.user && S.user.name) || me.name || null, phone: me.phone || null }); } catch (e) {}
  try { await api.claimOrders((local.get("cp_orders") || []).map(o => o.id)); } catch (e) {}
  await refreshUser(); refreshMine();
}

function currentPool(siteId, kid) {
  const ps = S.board.pools.filter(p => p.site_id === siteId && p.kitchen_id === kid && ["collecting", "waiting"].includes(p.status)).sort((a, b) => a.seq - b.seq);
  const open = ps.find(p => p.status === "waiting" || p.meals < S.settings.max_meals);
  return open || { seq: (ps.at(-1)?.seq || 0) + 1, meals: 0, status: "new" };
}

/* ---------- Share a pool: the phone's own share sheet, or copy the link ---------- */
const joinLink = (siteId, kid) => baseUrl() + "/#join=" + siteId + "," + kid;
function poolInvite(p, k, site) {
  const s = S.settings, trip = tripTo(k, site), fee = feeFor(Math.max(p.meals, 1), s, trip), drop = nextDrop(p.meals, s, trip);
  if (p.status === "waiting") return "ChopPool · " + TAGLINE + "\nI've started a lunch pool at " + site.name + " from " + k.public_name + " (" + p.meals + " " + (p.meals === 1 ? "meal" : "meals") + " so far). Join now: every seat makes delivery cheaper, and if " + k.public_name + " doesn't confirm you get your money back. Order before " + fmtTime(s.cutoff) + (dayLabel(S.date) === "today" ? "" : " " + dayLabel(S.date)) + ":";
  return "ChopPool · " + TAGLINE + "\nLunch pool at " + site.name + " from " + k.public_name + ": " + p.meals + " of " + s.max_meals + " seats taken, delivery now " + money(fee) + " a meal." +
    (drop ? " " + drop.more + " more and it drops to " + money(drop.fee) + "." : "") + " Order before " + fmtTime(s.cutoff) + (dayLabel(S.date) === "today" ? "" : " " + dayLabel(S.date)) + ":";
}
async function sharePool(siteId, kid) {
  const k = menuOf(kid), site = siteOf(siteId), p = currentPool(siteId, kid);
  if (!p || !["collecting", "waiting"].includes(p.status)) return toast("This pool can't take more orders right now.");
  const text = poolInvite(p, k, site), url = joinLink(siteId, kid);
  if (navigator.share) { try { await navigator.share({ title: "ChopPool lunch pool", text, url }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  copy(text + " " + url, "Link copied. Paste it anywhere to invite people.");
}
// Can this order's pool still be shared? Only once the seller has confirmed, before the cut-off, while seats are left.
function shareablePool(o) {
  if (["cancelled", "quote_requested", "quoted"].includes(o.status) || !["collecting", "waiting"].includes(o.pool_status) || o.order_date !== S.date) return null;
  const p = S.board.pools.find(x => x.site_id === o.site_id && x.kitchen_id === o.kitchen_id && x.seq === o.pool_seq && ["collecting", "waiting"].includes(x.status));
  return p && p.meals < Number(S.settings.max_meals) && new Date() < at(o.order_date, S.settings.cutoff) ? p : null;
}

const pickedDays = root => [...root.querySelectorAll("[data-adow][aria-pressed=true]")].map(b => +b.dataset.adow).sort();

function codeBox(id) {
  return `<form class="codebox" data-codeform><input id="${id}" maxlength="6" placeholder="K-27" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Customer code"><button class="btn">Hand over</button></form>`;

function wireCodes(token, d, redraw) {
  $("#view").addEventListener("submit", async e => {
    const f = e.target.closest("[data-codeform]"); if (!f) return;
    e.preventDefault();
    const input = f.querySelector("input"), code = normCode(input.value);
    if (!/^[A-Z]-\d{2,3}$|^\d{4}$/.test(code)) return toast("Enter the customer's code, like K-27.");
    const pool = (input.id.match(/^r?c-(.+)$/) || [])[1] || null;
    try {
      const r = await api.collectCode(token, code, typeof d === "function" ? d() : d, pool);
      toast("Give " + (r.items || r.qty + " × " + r.item_name) + " to " + r.name + "." + (r.was_paid ? "" : " Note: payment was not yet confirmed."));
      input.value = ""; redraw();

  });
}
// Orders grouped by code (a code can hold added plates), sorted A→Z

/* ---------- Installable app and push alerts ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
const isStandalone = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; } };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const pushReady = () => !DEMO && !!CONFIG.VAPID_PUBLIC_KEY && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
// Install: Android shows the system prompt; iPhone gets the Share › Add to Home Screen steps. The icon then opens this page.
async function installApp(home) {
  if (home) local.set("cp_home", home);
  if (isStandalone()) return toast("ChopPool is already installed on this phone.");
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; return; }
  openSheet(`${sheetHead("Install ChopPool", isIOS() ? "On iPhone, it takes three taps:" : "Add ChopPool to your home screen:")}
    ${isIOS() ? `<ol class="stack small" style="padding-left:20px;margin:0"><li>Open this page in <strong>Safari</strong>.</li><li>Tap the <strong>Share</strong> button (the square with an arrow).</li><li>Scroll down and tap <strong>Add to Home Screen</strong>, then <strong>Add</strong>.</li></ol><p class="small muted">Alerts on iPhone work once ChopPool is on your home screen (iOS 16.4 or later).</p>`
      : `<ol class="stack small" style="padding-left:20px;margin:0"><li>Open your browser menu (⋮).</li><li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li></ol>`}
    <button class="ghost wide" data-close>Done</button>`);
}
const b64u8 = s => { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); };
// Switch on push alerts for this phone. extra says what to hear about: order ids, a seller link or a rider link.
async function pushSubscribe(extra, quiet) {
  if (!pushReady()) { if (!quiet && isIOS() && !isStandalone()) installApp(); return false; }
  try {
    if (Notification.permission !== "granted") { if (quiet) return false; if (await Notification.requestPermission() !== "granted") { toast("Alerts are blocked. Allow notifications for this site in your phone settings."); return false; } }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u8(CONFIG.VAPID_PUBLIC_KEY) });

/* ---------- Ratings from real orders (no typed reviews) ---------- */
function scoreLine(k) {
  const sc = (S.scores || {})[k.id];
  if (!sc || (sc.orders || 0) < 20) return `<span class="chip">New on ChopPool</span>`;
  const parts = [sc.on_time != null ? sc.on_time + "% on time" : "", sc.orders + " orders", sc.come_back != null ? sc.come_back + "% come back" : ""].filter(Boolean);
  return `<span class="small score">${sc.ratings >= 3 ? `<span class="rstar">${STAR(true, 13)} ${Number(sc.rating).toFixed(1)}</span> · ` : ""}${esc(parts.join(" · "))}</span>`;
}
const rank = k => { const sc = (S.scores || {})[k.id] || {}; return (sc.orders >= 20 ? 1 : 0) * 1000 + (sc.come_back || 0) * 3 + (sc.on_time || 0) * 2 + (sc.reliable || 0) + Math.min(sc.orders || 0, 200) / 10; };

/* ---------- Launch animation and app motion ---------- */
function splash() {
  // Installed app: every time it opens. Website: the first visit only, so shared links open fast.
  const app = isStandalone(), key = app ? "cp_splash_s" : "cp_splash_v";
  try { if (app ? sessionStorage.getItem(key) : localStorage.getItem(key)) return; (app ? sessionStorage : localStorage).setItem(key, "1"); } catch (e) {}
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pk = (cls, x, y, c) => `<i class="sp-p ${cls}" style="left:${x}%;top:${y}%;background:${c}"></i>`;
  const el = document.createElement("div"); el.className = "splash wait" + (still ? " still" : ""); el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<div class="sp-in"><div class="sp-logo">${pk("sp-p1", 20, 61, "#FFF7EE")}${pk("sp-p3", 21, 27, "#FFF7EE")}${pk("sp-p2", 25, 44, "#F5B04A")}</div>
    <div class="sp-word">chop<span>pool</span></div><p class="sp-tag"><span>Split delivery.</span><span>One order.</span><span>One building.</span></p></div>`;
  document.body.appendChild(el); S.splashing = true;
  // Start the animation once the heading font is ready (at most 450 ms), so nothing swaps mid-animation
  const go = () => { if (el.classList.contains("wait")) { el.classList.remove("wait"); startMin(); } };
  try { document.fonts.load('800 40px "Bricolage Grotesque"').then(go, go); } catch (e) { go(); }
  setTimeout(go, 450);
  let gone = false, minDone = false; const done = () => { if (gone) return; gone = true; el.classList.add("out"); setTimeout(() => { el.remove(); S.splashing = false; revealScan(); }, 380); };
  const tryDone = () => { if (minDone && S.appReady) done(); };
  el.addEventListener("click", () => { if (S.appReady) done(); });
  function startMin() { setTimeout(() => { minDone = true; tryDone(); }, still ? 600 : 1900); }
  S.onReady = tryDone;
  setTimeout(done, 15000);   // never stay stuck
}
// Cards fade up the first time they come into view (installed app only); things already seen never re-animate
const seenCards = new Set();
let revealObs = null;
function revealScan() {
  if (!document.body.classList.contains("is-app") || !("IntersectionObserver" in window) || S.splashing) return;
  revealObs = revealObs || new IntersectionObserver(es => { let n = 0; es.forEach(e => { if (!e.isIntersecting) return; const t = e.target; t.style.transitionDelay = Math.min(n++, 5) * 70 + "ms"; t.classList.add("in"); revealObs.unobserve(t); }); }, { rootMargin: "0px 0px -6% 0px" });
  document.querySelectorAll("#view article, #view .dtile, #view details.item, #view .kcard, #view .order-card, #view section.card").forEach(el => {
    if (el.dataset.rv) return; el.dataset.rv = "1";
    const sig = el.className + "|" + (el.dataset.key || el.dataset.kitchen || el.dataset.pool || el.dataset.site || (el.textContent || "").trim().slice(0, 48));
    if (seenCards.has(sig)) return; seenCards.add(sig);
    el.classList.add("rv"); revealObs.observe(el);
  });
}
// Fixed top area: glass edge once scrolled; on Home the dashboard shrinks to one slim row (with hysteresis)
let topTick = false;
window.addEventListener("scroll", () => {
  if (topTick || document.body.classList.contains("locked")) return; topTick = true;
  requestAnimationFrame(() => {
    topTick = false; const y = window.scrollY;
    document.querySelectorAll(".topzone").forEach(z => z.classList.toggle("scrolled", y > 4));

  });
}, { passive: true });
function initMotion() {
  if (!(isStandalone() || /[?&]motion=1/.test(location.search))) return;
  document.body.classList.add("is-app");
  let t; new MutationObserver(() => { clearTimeout(t); t = setTimeout(revealScan, 30); }).observe(document.getElementById("app"), { childList: true, subtree: true });
}
async function route() {
  clearTimers(); closeSheet();
  if ($("#demoBar")) $("#demoBar").open = false;
  const old = $("#view"), fresh = old.cloneNode(false); old.replaceWith(fresh);   // drops old listeners
  const h = location.hash.slice(1);
  if (h.startsWith("join=")) {
    // A shared pool link: switch to that building and open the kitchen's menu
    const [siteId, kid] = h.slice(5).split(",");
    if (S.sites.some(x => x.id === siteId)) { S.siteId = siteId; S.noSite = false; local.set("cp_site", siteId); }
    S.pendingJoin = kid; S.tab = "home";
    history.replaceState(null, "", "#order");
  }
  document.body.classList.remove("is-admin");
  // The browser tab says which page this is
  document.title = h === "rider-signup" ? "Rider sign-up · ChopPool" : h.startsWith("kitchen-") ? "Vendor · ChopPool" : h.startsWith("rider-") ? "Rider · ChopPool"
    : h.startsWith("host-") ? "Drop point · ChopPool" : h === "admin" ? "Admin · ChopPool" : "ChopPool · " + TAGLINE;
  if (h === "rider-signup") return viewRiderSignup();
  const view = h.startsWith("kitchen-") ? "kitchen" : h.startsWith("rider-") ? "rider" : h.startsWith("host-") ? "host" : h === "admin" ? "admin" : "order";
  document.querySelectorAll("#demoBar a").forEach(a => { if (a.getAttribute("href") === "#" + h || (view === "order" && a.dataset.view === "order")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (view === "kitchen") return viewKitchen(h.slice(8));
  if (view === "rider") return viewRider(h.slice(6));
  if (view === "host") return viewHost(h.slice(5));
  if (view === "admin") return viewAdmin();
  return viewOrder();
}
/* Phone numbers: "Choose from contacts" where the phone allows it (Android Chrome). iPhone Safari doesn't let websites read contacts. */
const canPickContacts = () => "contacts" in navigator && "ContactsManager" in window && typeof navigator.contacts.select === "function";
const ghNumber = t => { let d = String(t || "").replace(/[^\d+]/g, ""); if (d.startsWith("+233")) d = "0" + d.slice(4); else if (d.startsWith("233") && d.length === 12) d = "0" + d.slice(3); d = d.replace(/\D/g, "");
  return /^0\d{9}$/.test(d) ? d.slice(0, 3) + " " + d.slice(3, 6) + " " + d.slice(6) : d; };
function enhanceContacts() {
  if (!canPickContacts()) return;
  document.querySelectorAll('input[inputmode="tel"]:not([data-cpk])').forEach(inp => {
    inp.dataset.cpk = "1";
    const b = document.createElement("button"); b.type = "button"; b.className = "linkbtn small contactpick"; b.innerHTML = ICON.user.replace(/width="\d+" height="\d+"/, 'width="14" height="14"') + " Choose from contacts";
    b.addEventListener("click", async () => { try { const [c] = await navigator.contacts.select(["tel"], { multiple: false }); const tel = c && c.tel && c.tel[0]; if (tel) { inp.value = ghNumber(tel); inp.dispatchEvent(new Event("input", { bubbles: true })); inp.dispatchEvent(new Event("change", { bubbles: true })); } } catch (e) {} });
    inp.insertAdjacentElement("afterend", b);
  });
}
// Installed on iPhone, the first time the keyboard opens the app's screen area shrinks by about the status bar's height
// and doesn't grow back (an iOS bug): the tab bar floats and a black band appears at the bottom.
// When the keyboard closes, briefly re-lay out the page so iOS measures the full screen again.
function healViewport() {
  if (!(isStandalone() && isIOS())) return;
  let t = null;
  const heal = () => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (document.activeElement && document.activeElement.matches("input, textarea, select")) return;   // keyboard still up
      const y = window.scrollY, b = document.body, sheetOpen = b.classList.contains("locked");
      b.style.display = "none"; void b.offsetHeight; b.style.display = "";
      if (!sheetOpen) window.scrollTo(0, y);
    }, 350);
  };
  document.addEventListener("focusout", e => { if (e.target.matches && e.target.matches("input, textarea, select")) heal(); });
  if (window.visualViewport) { let last = visualViewport.height; visualViewport.addEventListener("resize", () => { if (visualViewport.height > last + 80) heal(); last = visualViewport.height; }); }
  window.addEventListener("pageshow", heal); document.addEventListener("visibilitychange", () => { if (!document.hidden) heal(); });
}
async function start() {
  splash();   // first frame: the animation covers the connection time (no "Loading" text anywhere)
  if (DEMO) $("#demoBar").classList.remove("hidden");
  if (!DEMO) {
    for (let i = 0; i < 80 && !window.supabase; i++) await new Promise(r => setTimeout(r, 100));
    if (!window.supabase) { $("#view").innerHTML = `<p class="card err">ChopPool couldn't connect. Check your internet connection and refresh.</p>`; S.appReady = true; S.onReady && S.onReady(); return; }
    api = makeSupabaseApi();
  }
  // Instant start: last-seen menus and board from this phone, refreshed quietly in the background
  const boot = !DEMO && local.get("cp_boot");
  if (boot && boot.v === 2 && boot.load && boot.load.settings) {
    Object.assign(S, boot.load); if (boot.board && boot.date === orderDate(boot.load.settings)) S.board = boot.board;
    api.load().then(fresh => { Object.assign(S, fresh); saveBoot(); if ($("#tabHome")) { renderWhen(); renderPools(); if (S.tab === "kitchens") renderKitchens(); } }).catch(() => {});
  } else {
    try { Object.assign(S, await api.load()); saveBoot(); }
    catch (e) { $("#view").innerHTML = `<p class="err">We couldn't load the menu: ${esc(cleanErr(e))}. Refresh to try again.</p>`; S.appReady = true; S.onReady && S.onReady(); return; }
  }
  S.date = orderDate(S.settings);
  const saved = local.get("cp_site");
  // No building chosen yet: the app opens on Home with a welcome card (no forced location sheet)
  S.siteId = S.sites.some(x => x.id === saved) ? saved : null; S.noSite = !S.siteId;
  if (S.siteId && !(local.get("cp_recent_sites") || []).length) local.set("cp_recent_sites", [S.siteId]);
  $("#sheetBg").addEventListener("click", e => { if (e.target === $("#sheetBg")) closeSheet(); });
  initSheetDrag();
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  document.addEventListener("click", e => { const c = e.target.closest("[data-copy]"); if (c) return copy(c.dataset.copy, "Link copied"); const b = e.target.closest("[data-copynum]"); if (b) copy(b.dataset.copynum.replace(/\s/g, ""), "MoMo number copied"); });
  window.addEventListener("hashchange", route);
  // Background refresh pauses while the app is hidden; catch up at once when it's opened again
  document.addEventListener("visibilitychange", () => { if (document.hidden || !$("#tabHome")) return; refreshBoard(); refreshMine(); tickCountdown(); });
  if (isStandalone()) document.documentElement.classList.add("standalone");
  healViewport();
  initMotion();
  if (canPickContacts()) new MutationObserver(() => enhanceContacts()).observe(document.body, { childList: true, subtree: true });
  // New version published: the app picks it up and reloads once, so phones never stay on an old copy
  if (!DEMO && "serviceWorker" in navigator && location.protocol === "https:") {
    const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadSW && !reloaded && !document.body.classList.contains("locked")) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => { r.update().catch(() => {}); document.addEventListener("visibilitychange", () => { if (!document.hidden) r.update().catch(() => {}); }); }).catch(() => {});
  }
  // Opened from the home-screen icon: go to the page this phone installed (seller, rider or team), else the customer app
  if (/[?&]app=1/.test(location.search) && (!location.hash || location.hash === "#") && local.get("cp_home")) history.replaceState(null, "", location.pathname + location.search + local.get("cp_home"));
  document.addEventListener("click", async e => {
    const ins = e.target.closest("[data-install]"); if (ins) return installApp(ins.dataset.install);
    if (e.target.closest("[data-theme-cycle]")) return cycleTheme();
    const al = e.target.closest("[data-alerts]"); if (al) { if (await pushSubscribe(JSON.parse(al.dataset.alerts || "{}"))) { toast("Alerts are on for this phone."); al.textContent = "Alerts are on"; } }
  });
  if (!DEMO) { try { window.supabase && (await api.user()) && afterSignIn(); } catch (e) {} }
  await route();
  S.appReady = true; if (S.onReady) S.onReady();
}
start();
