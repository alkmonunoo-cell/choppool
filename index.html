<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F4EF">
<title>ChopPool Lunch Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: phone-width app shell. App bar on top, scrolling content, tab bar fixed at the bottom.
     Light and dark both use the Jollof palette: tomato-orange accent, saffron hints, warm neutrals. Cards float on soft shadows, not borders. */
  --bg: #F8F4EF;
  --surface: #FFFFFF;
  --surface-2: #FBF8F4;
  --ink: #23160F;
  --muted: #7C685C;
  --line: #EEE3D8;
  --accent: #D9480F;
  --accent-2: #B83A08;
  --on-accent: #FFFFFF;
  --accent-soft: #FDEADF;
  --hint: #A3620B;
  --hint-soft: #FCF1DC;
  --ok: #2B7A4B;
  --ok-soft: #E2F3E8;
  --danger: #B42318;
  --danger-soft: #FDE8E6;
  --tint-1: #FDE6D8; --tint-2: #E3F1E6; --tint-3: #FCEFD2; --tint-4: #E8E6F7;
  --shadow: 0 1px 2px rgba(60, 30, 10, .06), 0 8px 24px rgba(60, 30, 10, .07);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18120F; --surface: #231A16; --surface-2: #2C211C; --ink: #FAEFE8; --muted: #C2A898; --line: #3B2D26;
    --accent: #F2652A; --accent-2: #FF7A45; --on-accent: #FFFFFF; --accent-soft: #3D2318; --hint: #F5B04A; --hint-soft: #3A2B16;
    --ok: #62D394; --ok-soft: #1E3829; --danger: #FF8A80; --danger-soft: #44231F;
    --tint-1: #3B241A; --tint-2: #22301F; --tint-3: #3A2C17; --tint-4: #33231F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18120F; --surface: #231A16; --surface-2: #2C211C; --ink: #FAEFE8; --muted: #C2A898; --line: #3B2D26;
  --accent: #F2652A; --accent-2: #FF7A45; --on-accent: #FFFFFF; --accent-soft: #3D2318; --hint: #F5B04A; --hint-soft: #3A2B16;
  --ok: #62D394; --ok-soft: #1E3829; --danger: #FF8A80; --danger-soft: #44231F;
  --tint-1: #3B241A; --tint-2: #22301F; --tint-3: #3A2C17; --tint-4: #33231F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding: 12px 16px 112px; display: grid; gap: 18px; }
.stack { display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 28px; font-weight: 800; line-height: 1.1; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--accent); letter-spacing: -0.02em; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }

/* Demo switcher: small and out of the way */
.demo { font-size: 13px; }
.demo summary { list-style: none; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--hint); font-weight: 700; background: var(--hint-soft); border-radius: 999px; padding: 5px 12px; }
.demo summary::-webkit-details-marker { display: none; }
.demo[open] summary { margin-bottom: 8px; }
.demo p { color: var(--muted); margin-bottom: 8px; }
.demo nav { display: flex; gap: 6px; flex-wrap: wrap; }
.demo a { color: var(--ink); font-weight: 600; text-decoration: none; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 12px; }
.demo a[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* App bar */
.appbar { display: flex; align-items: center; gap: 10px; }
.place { display: grid; gap: 0; background: none; border: none; padding: 0; text-align: left; color: var(--ink); min-width: 0; flex: 1; cursor: pointer; }
.place .eyebrow { display: flex; gap: 4px; align-items: center; }
.place strong { font-family: var(--font-display); font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 2px; min-width: 0; }
.place strong #placeName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.place strong svg { flex: none; }
.iconbtn { background: var(--surface); border: none; box-shadow: var(--shadow); color: var(--ink); width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; padding: 0; flex: none; position: relative; }
.iconbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-weight: 800; font-size: 17px; border: none; padding: 0; display: grid; place-items: center; flex: none; }
.avatar.guest { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Hero */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px; background: var(--accent); color: var(--on-accent); display: grid; gap: 14px; }
.hero::after { content: ""; position: absolute; right: -40px; top: -50px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.12); }
.hero::before { content: ""; position: absolute; right: 40px; bottom: -70px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.08); }
.hero h1 { color: inherit; position: relative; z-index: 1; }
.hero p { opacity: .92; position: relative; z-index: 1; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; position: relative; z-index: 1; }
.hero-stat { background: rgba(255,255,255,.16); border-radius: 14px; padding: 10px 12px; display: grid; align-content: start; }
.hero-stat b { font-family: var(--font-display); font-size: 18px; font-weight: 800; line-height: 1.15; white-space: nowrap; }
.hero-stat span { font-size: 11.5px; opacity: .9; line-height: 1.3; }
:root[data-theme="dark"] .hero-stat { background: rgba(0,0,0,.12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero-stat { background: rgba(0,0,0,.12); } }

/* Pool cards */
.pool { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; display: grid; }
.pool-art { position: relative; height: 116px; display: grid; place-items: center start; padding-left: 18px; }
.pool-art svg { width: 96px; height: 96px; }
.pool-art .tags { position: absolute; right: 14px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
.pool-art .fee-tag { position: absolute; right: 14px; bottom: 12px; background: var(--surface); border-radius: 14px; padding: 6px 10px; text-align: right; box-shadow: var(--shadow); }
.fee-tag b { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--accent); line-height: 1.1; }
.fee-tag s { color: var(--muted); font-size: 12px; margin-right: 4px; }
.fee-tag span { font-size: 11.5px; color: var(--muted); }
.pool-body { padding: 16px 18px 18px; display: grid; gap: 12px; }
.seats { display: flex; gap: 5px; flex-wrap: wrap; }
.seats i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); display: block; transition: background .3s; }
.seats i.on { background: var(--accent); }
.seats i.next { box-shadow: inset 0 0 0 2px var(--accent); background: transparent; }
.dishline { display: flex; gap: 6px; flex-wrap: wrap; }
.dishline span { font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.hint { color: var(--hint); font-weight: 600; }
.invite-card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 18px; display: flex; gap: 14px; align-items: center; }
.invite-card .blob { width: 52px; height: 52px; border-radius: 16px; background: var(--tint-3); display: grid; place-items: center; flex: none; color: var(--hint); }

/* Chips and buttons */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--hint-soft); color: var(--hint); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chip.dim { background: var(--surface); color: var(--muted); box-shadow: var(--shadow); }
:root[data-theme="dark"] .chip:not(.ok):not(.warn):not(.bad):not(.dim) { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip:not(.ok):not(.warn):not(.bad):not(.dim) { color: var(--accent); } }
button { font: inherit; cursor: pointer; border-radius: 14px; border: 1px solid transparent; padding: 10px 16px; font-weight: 700; }
.btn { background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn:hover { background: var(--accent-2); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; box-shadow: none; }
.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.wide { width: 100%; padding: 15px; font-size: 16px; }
.linkbtn { background: none; border: none; padding: 0; color: var(--accent); font-weight: 700; }
.wa { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: #1F8F4E; color: #fff; font-weight: 700; padding: 14px; border-radius: 14px; }
.wa.quiet { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

/* Forms */
label { font-size: 13.5px; font-weight: 600; display: block; margin-bottom: 6px; color: var(--muted); }
select, input, textarea { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(20, 10, 5, .45); display: none; align-items: flex-end; justify-content: center; z-index: 30; }
.sheet-bg.open { display: flex; }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 10px 20px 0; display: grid; gap: 16px; align-content: start; }
.sheet::before { content: ""; width: 40px; height: 5px; border-radius: 99px; background: var(--line); justify-self: center; }
.sheet > :last-child { margin-bottom: 20px; }
.sheet-foot { position: sticky; bottom: 0; background: var(--surface); padding: 12px 0 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; margin-bottom: 0 !important; }
.sheet-foot .tot { display: grid; line-height: 1.2; }
.sheet-foot .tot b { font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.sheet-foot .tot span { font-size: 12px; color: var(--muted); }
.sheet-foot .btn { flex: 1; padding: 15px; font-size: 16px; }
.closex { width: 36px; height: 36px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: var(--surface-2); border: none; color: var(--ink); flex: none; }
.group { display: grid; gap: 10px; }
.group-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.dishes { display: grid; gap: 10px; }
.dish { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; border-radius: 18px; padding: 10px; background: var(--surface-2); border: 2px solid transparent; cursor: pointer; margin: 0; color: var(--ink); font-size: 15px; font-weight: 600; }
.dish input { position: absolute; opacity: 0; pointer-events: none; }
.dish:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.dish:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.dish .tile { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; }
.dish .tile svg { width: 40px; height: 40px; }
.dish .price { font-family: var(--font-display); font-weight: 700; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.tog { border-radius: 999px; padding: 8px 14px; background: var(--surface-2); border: 1.5px solid var(--line); color: var(--ink); font-weight: 600; font-size: 14px; }
.tog[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.qty { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.qty button { width: 38px; height: 38px; padding: 0; border-radius: 10px; background: var(--surface); border: none; box-shadow: var(--shadow); color: var(--ink); font-size: 20px; line-height: 1; }
.qty output { font-weight: 800; font-size: 17px; min-width: 30px; text-align: center; font-family: var(--font-display); }
.me-row { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-radius: 16px; padding: 12px 14px; }
.me-row .avatar { width: 36px; height: 36px; font-size: 15px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); border-radius: 16px; padding: 12px 14px; margin: 0; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
.switch input { appearance: none; width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; padding: 0; border: none; flex: none; cursor: pointer; transition: background .2s; }
.switch input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .2s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 21px; }
.sum { display: grid; gap: 6px; font-size: 14.5px; color: var(--muted); }
.sum div { display: flex; justify-content: space-between; gap: 10px; }
.sum div span:last-child { color: var(--ink); font-weight: 600; }
.pay { background: var(--surface-2); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.momo { display: flex; align-items: center; gap: 12px; }
.momo .logo { width: 42px; height: 42px; border-radius: 12px; background: #FFCC00; color: #1E1B24; display: grid; place-items: center; font-weight: 800; font-size: 12px; flex: none; }
.note { background: var(--hint-soft); color: var(--ink); border-radius: 16px; padding: 12px 14px; font-size: 14px; }
.err { color: var(--danger); font-size: 14px; min-height: 1em; }

/* Confirmation */
.success { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; justify-self: center; }
.codetiles { display: flex; gap: 8px; justify-content: center; }
.codetiles span { width: 54px; height: 64px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-2); font-family: var(--font-display); font-size: 34px; font-weight: 800; display: grid; place-items: center; }
:root[data-theme="dark"] .codetiles span { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .codetiles span { color: var(--accent); } }
.center { text-align: center; }

/* Orders tab */
.order-card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 14px; }
.order-card .head { display: flex; gap: 12px; align-items: center; }
.order-card .tile { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.order-card .tile svg { width: 34px; height: 34px; }
.order-card .c { margin-left: auto; text-align: right; }
.order-card .c b { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: .08em; display: block; line-height: 1; }
.order-card .c span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.track i { height: 6px; border-radius: 99px; background: var(--line); display: block; }
.track i.on { background: var(--accent); }
.status-text { font-size: 14.5px; }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* Wallet tab */
.balance { border-radius: 24px; padding: 22px; background: var(--ink); color: var(--bg); display: grid; gap: 6px; position: relative; overflow: hidden; }
.balance::after { content: ""; position: absolute; right: -30px; bottom: -60px; width: 160px; height: 160px; border-radius: 50%; background: var(--accent); opacity: .35; }
.balance b { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1.1; position: relative; z-index: 1; }
.balance span, .balance p { position: relative; z-index: 1; }
.ledger { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 6px 16px; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.ledger div:first-child { border-top: none; }

/* Tab bar */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; width: min(460px, calc(100% - 24px)); background: var(--surface); box-shadow: 0 10px 30px rgba(30,15,5,.18); border-radius: 22px; padding: 6px; display: grid; grid-template-columns: repeat(4, 1fr); z-index: 20; }
.kcard { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; }
.kcard .head { display: flex; gap: 12px; align-items: center; }
.kcard .tile { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.kcard .tile svg { width: 46px; height: 46px; }
.tabbar button { background: none; border: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 8px 4px; font-size: 12px; font-weight: 700; border-radius: 16px; position: relative; }
.tabbar button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 11px; display: grid; place-items: center; padding: 0 5px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); width: min(480px, calc(100% - 24px)); background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px; font-size: 14.5px; z-index: 40; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.toast.show { display: block; }

/* Staff views (coordinator, kitchen, rider, host) */
.card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; }
.fee { text-align: right; flex: none; }
.fee b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--accent); line-height: 1.05; }
.fee span { font-size: 12.5px; color: var(--muted); }
.code { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: .12em; color: var(--accent); line-height: 1; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; }
.tile b { display: block; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12.5px; color: var(--muted); }
.flags { border-left: 4px solid var(--danger); background: var(--danger-soft); border-radius: 0 16px 16px 0; padding: 12px 14px; display: grid; gap: 4px; font-size: 14.5px; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps span { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.steps span.done { background: var(--ok-soft); color: var(--ok); }
.steps span.now { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.inline { display: grid; grid-template-columns: 1.2fr 1fr .8fr auto; gap: 8px; align-items: end; }
.table-wrap { overflow-x: auto; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
td select { padding: 6px 8px; width: auto; }
.labels { display: grid; gap: 8px; }
.labels > div { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.labels .lc { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .06em; }
.tick { color: var(--ok); font-weight: 700; }

.codebox input { font-family: var(--font-display); font-size: 24px; letter-spacing: .2em; text-align: center; }
.quote { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; background: var(--hint-soft); border-radius: 16px; padding: 12px; }
.quote p { grid-column: 1 / -1; }
.menurow { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; align-items: center; }
.choice { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
.choice input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.map { height: 240px; border-radius: 18px; overflow: hidden; position: relative; z-index: 0; background: var(--surface-2); }
.mpin { display: block; width: 24px; height: 24px; border-radius: 50% 50% 50% 0; background: var(--muted); transform: rotate(-45deg); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.mpin.on { background: var(--accent); }
.mpin.me { background: #2563EB; border-radius: 50%; transform: none; }
.leaflet-container { font-family: var(--font-body); }
.leaflet-popup-content { font-size: 14px; }
.admintabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.admintabs button { white-space: nowrap; background: var(--surface); box-shadow: var(--shadow); border: none; color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 14px; }
.admintabs button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.menuedit { display: grid; grid-template-columns: 1.4fr .6fr 1.6fr auto auto; gap: 8px; align-items: center; }
@media (max-width: 560px) { .menuedit { grid-template-columns: 1fr 90px; } .menuedit [data-f="addons"] { grid-column: 1 / -1; } }
.hidden { display: none !important; }
@media (max-width: 560px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .inline { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 25px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const ROAD_FACTOR = 1.3;   // road distance is roughly 1.3 x the straight line

function tripFor(k, site, s) {
  if (!hasPin(k) || !hasPin(site) || s.per_km == null || s.base_fare == null) return Number(s.trip_cost);
  return Math.round(Number(s.base_fare) + Number(s.per_km) * distM(k, site) / 1000 * ROAD_FACTOR);
}
const roadKm = (k, site) => distM(k, site) / 1000 * ROAD_FACTOR;

function nextDrop(meals, s, trip) {
  const cur = feeFor(Math.max(meals, 1), s, trip);
  for (let m = meals + 1; m <= s.max_meals; m++) { const f = feeFor(m, s, trip); if (f < cur) return { more: m - meals, fee: f }; }
  return null;
}

/* ---------- Dates (Accra = UTC+0) ---------- */
const hm = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + m; };

  while (d.getUTCDay() === 0 || d.getUTCDay() === 6) d.setUTCDate(d.getUTCDate() + 1);
  return d.toISOString().slice(0, 10);

const today = () => new Date().toISOString().slice(0, 10);

const fmtDate = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });

const addonText = list => (list || []).map(a => a.name).join(", ");

/* =====================================================================================

    return Math.round((led + cb) * 100) / 100;
  }
  function settle(o, ref, useWallet) {
    const total = dueOf(o); let use = 0;
    if (useWallet && me && o.user_id === me.id) { use = Math.max(0, Math.min(balance(me.id), total)); if (use > 0) ledger.push({ user_id: me.id, amount: -use, reason: "Paid for order " + o.code, order_id: o.id, created_at: nowIso() }); }
    if (use < total && (!ref || ref.trim().length < 4)) throw new Error("Enter the MoMo transaction ID for the remaining " + (total - use).toFixed(2) + ".");
    o.wallet_used += use; if (use < total) o.momo_ref = ref.trim(); o.status = use >= total ? "paid" : "pending";
    return { total, wallet_used: use, momo_due: total - use };
  }

      p.status = "cancelled";

    orders.filter(o => ["quote_requested", "quoted"].includes(o.status) && pastCutoff(o.order_date)).forEach(o => { o.status = "cancelled"; o.cancel_reason = "Special request not paid before cut-off"; });
  }
  function place(r, sim) {
    housekeeping();
    const m = items.find(i => i.id === r.item), k = kitchens.find(x => x.id === m.kitchen_id), si = sites.find(x => x.id === r.site);

    const o = { id: "o" + uid(), created_at: nowIso(), order_date: d, pool_id: pl.id, site_id: si.id, kitchen_id: k.id, item_id: m.id, user_id: sim ? null : (me ? me.id : null),
      item_name: m.name, unit_price: m.price, qty: r.qty, addons: add, addons_total: addT, note: (r.note || "").trim() || null, special_request: special, quote_price: null,
      customer_name: r.name, phone: r.phone, momo_ref: null, wallet_used: 0, code, max_fee: feeFor(meals(pl.id) + r.qty, settings, tripOf(pl.id)), service_fee: settings.service_fee,

        activity: orders.filter(o => !["cancelled", "quote_requested", "quoted"].includes(o.status) && minsAgo(o.created_at) < 360).map(o => ({ id: o.id, site_id: o.site_id, kitchen_id: o.kitchen_id, pool_id: o.pool_id, item_name: o.item_name, qty: o.qty, created_at: o.created_at })) };
    },
    async placeOrder(r) { return place(r, false); },
    async payQuote(id, ref, useWallet) { housekeeping(); const o = orders.find(x => x.id === id); if (!o || o.status !== "quoted") throw new Error("This request is not waiting for payment."); return settle(o, ref, useWallet); },
    async myOrders(ids) {
      return orders.filter(o => ids.includes(o.id) || (me && o.user_id === me.id)).filter(o => o.order_date >= today()).sort((a, b) => a.created_at < b.created_at ? 1 : -1).map(o => {
        const p = pools.find(x => x.id === o.pool_id);
        return { id: o.id, order_date: o.order_date, code: o.code, status: o.status, qty: o.qty, item_name: o.item_name, site_id: o.site_id, kitchen_id: o.kitchen_id, pool_seq: p.seq, pool_status: p.status,
          special_request: o.special_request, quote_price: o.quote_price, amount_due: dueOf(o) - o.wallet_used, cancel_reason: o.cancel_reason,
          unit_price: o.unit_price, addons: o.addons, addons_total: o.addons_total, max_fee: o.max_fee, service_fee: o.service_fee, wallet_used: o.wallet_used };
      });
    },
    async addVendor(r) {
      const wa_ = String(r.whatsapp || "").replace(/\D/g, "");
      if ((r.name || "").trim().length < 2) throw new Error("Add the seller's name.");
      if (!/^0\d{9}$/.test(wa_)) throw new Error("Enter the seller's 10-digit WhatsApp number, like 024 123 4567.");
      const good = (r.items || []).filter(i => (i.name || "").trim().length >= 2 && Number(i.price) > 0);
      if (!good.length) throw new Error("Add at least one dish with its price.");
      const si0 = sites.find(x => x.id === r.site) || {};
      const k = { id: "v" + uid(), name: r.name.trim(), public_name: r.name.trim(), tagline: "Added by a customer", address: "", lat: si0.lat, lng: si0.lng, whatsapp: wa_, capacity: 30, delivery_mode: "rider", site_id: r.site, added_by_customer: true, token: "demo" + uid(), active: true };
      kitchens.push(k); good.forEach(i => items.push({ id: "i" + uid(), kitchen_id: k.id, name: i.name.trim(), price: Number(i.price), addons: [] }));
      return { id: k.id, token: k.token, whatsapp: wa_, name: k.public_name };
    },
    async user() { return me; },
    async signUp(email, pw, name) { if (users.some(u => u.email === email)) throw new Error("That email already has an account. Sign in instead."); if (String(pw).length < 6) throw new Error("Use at least 6 characters for the password."); me = { id: "u" + uid(), email, name: name || null }; users.push({ ...me, pw }); return me; },
    async signIn(email, pw) { const u = users.find(x => x.email === email && x.pw === pw); if (!u) throw new Error("Wrong email or password."); me = { id: u.id, email, name: u.name }; return me; },
    async signInGoogle() { throw new Error("Google sign-in works once the app is live. In the demo, use email and password."); },
    async signOut() { me = null; },
    async updateName(name) { if (!me) throw new Error("Sign in first."); me.name = name; const u = users.find(x => x.id === me.id); if (u) u.name = name; return me; },
    async accountStats() { const since = Date.now() - 30 * 864e5; return { accounts: users.length, active: new Set(orders.filter(o => o.user_id && new Date(o.created_at).getTime() >= since).map(o => o.user_id)).size }; },
    async updateSettings(patch) { Object.assign(settings, patch); },
    async saveProfile(p) { const ex = profiles.find(x => x.user_id === me.id); if (ex) Object.assign(ex, p); else profiles.push({ user_id: me.id, email: me.email, ...p }); },
    async claimOrders(ids) { let n = 0; orders.forEach(o => { if (me && ids.includes(o.id) && !o.user_id) { o.user_id = me.id; n++; } }); return n; },
    async wallet() {
      if (!me) throw new Error("Sign in to see your wallet.");
      const cb = orders.filter(o => o.user_id === me.id && ["paid", "collected"].includes(o.status) && pastCutoff(o.order_date) && o.max_fee > feeFor(meals(o.pool_id), settings, tripOf(o.pool_id)))
        .map(o => ({ at: at(o.order_date, settings.cutoff).toISOString(), amount: Math.round((o.max_fee - feeFor(meals(o.pool_id), settings, tripOf(o.pool_id))) * o.qty * 100) / 100, reason: "Delivery cashback, code " + o.code }));
      return { balance: balance(me.id), entries: ledger.filter(e => e.user_id === me.id).map(e => ({ at: e.created_at, amount: e.amount, reason: e.reason })).concat(cb).sort((a, b) => a.at < b.at ? 1 : -1) };
    },
    async kitchenView(token, date) {
      housekeeping();
      const k = byToken(kitchens, "token", token);
      return { kitchen: { name: k.name, public_name: k.public_name, capacity: k.capacity, delivery_mode: k.delivery_mode, added_by_customer: k.added_by_customer, open: isOpen(k.id, date) },
        menu: items.filter(i => i.kitchen_id === k.id && i.active !== false).map(i => ({ id: i.id, name: i.name, price: i.price })),
        pools: pools.filter(p => p.kitchen_id === k.id && p.order_date === date && p.status !== "cancelled" && meals(p.id) > 0).map(p => {
          const si = sites.find(s => s.id === p.site_id);
          return { id: p.id, seq: p.seq, status: p.status, site: si.name, drop_point: si.drop_point, handoff: si.handoff, host_label: si.host_label,
            orders: orders.filter(o => o.pool_id === p.id && o.status !== "cancelled").map(o => ({ id: o.id, code: o.code, qty: o.qty, item_name: o.item_name, unit_price: o.unit_price, addons_total: o.addons_total, addons: o.addons, note: o.note, special_request: o.special_request, quote_price: o.quote_price, status: o.status, paid: ["paid", "collected"].includes(o.status), collected: o.status === "collected" })) };
        }) };
    },
    async kitchenOpenDay(token, date) { const k = byToken(kitchens, "token", token); if (!isOpen(k.id, date)) days.push({ kitchen_id: k.id, order_date: date }); pools.filter(p => p.kitchen_id === k.id && p.order_date === date && p.status === "waiting").forEach(p => { p.status = "collecting"; }); },
    async kitchenUpdate(token, pid, status) {
      const k = byToken(kitchens, "token", token); const p = pools.find(x => x.id === pid && x.kitchen_id === k.id);
      if (["picked_up", "arriving", "delivered"].includes(status) && k.delivery_mode !== "runner") throw new Error("A ChopPool rider delivers this pool.");
      p.status = status; p[stamp[status]] = nowIso();
    },
    async kitchenQuote(token, oid, price) {
      const k = byToken(kitchens, "token", token); const o = orders.find(x => x.id === oid && x.kitchen_id === k.id);
      if (!(Number(price) > 0)) throw new Error("Enter a price per meal in cedis.");
      if (!o || !["quote_requested", "quoted"].includes(o.status)) throw new Error("That request can no longer be priced.");
      o.quote_price = Number(price); o.status = "quoted";
    },
    async kitchenDecline(token, oid, reason) {
      const k = byToken(kitchens, "token", token); const o = orders.find(x => x.id === oid && x.kitchen_id === k.id);
      if (!o || !["quote_requested", "quoted"].includes(o.status)) throw new Error("That request has already been paid or closed.");
      o.status = "cancelled"; o.cancel_reason = "The seller can't do this request" + (String(reason || "").trim() ? ": " + String(reason).trim() : "");
    },
    async waitingPools(date) { return pools.filter(p => p.order_date === date && p.status === "waiting" && meals(p.id) > 0); },
    async vendorSetMenu(token, list) {
      const k = byToken(kitchens, "token", token);
      if (!k.added_by_customer) throw new Error("ChopPool manages this menu. Contact the coordinator to change it.");
      list.forEach(it => {
        if (it.id) { const i = items.find(x => x.id === it.id && x.kitchen_id === k.id); if (i) { if (it.name) i.name = it.name; if (Number(it.price) > 0) i.price = Number(it.price); i.active = it.active !== false; } }
        else if ((it.name || "").trim().length >= 2 && Number(it.price) > 0) items.push({ id: "i" + uid(), kitchen_id: k.id, name: it.name.trim(), price: Number(it.price), addons: [] });
      });
    },
    async riderView(token, date) {
      const r = byToken(riders, "token", token);
      return { rider: { name: r.name }, pools: pools.filter(p => p.rider_id === r.id && p.order_date === date && !["cancelled", "waiting"].includes(p.status)).map(p => {
        const si = sites.find(s => s.id === p.site_id), k = kitchens.find(x => x.id === p.kitchen_id);
        return { id: p.id, seq: p.seq, status: p.status, meals: meals(p.id), kitchen: k.name, kitchen_address: k.address, kitchen_phone: k.whatsapp, site: si.name, drop_point: si.drop_point, handoff: si.handoff, host_label: si.host_label, orders: handOrders(p.id) };
      }) };
    },
    async riderUpdate(token, pid, status) { const r = byToken(riders, "token", token); const p = pools.find(x => x.id === pid && x.rider_id === r.id); if (!p) throw new Error("That pool is not assigned to you."); p.status = status; p[stamp[status]] = nowIso(); },
    async hostView(token, date) {
      const si = byToken(sites, "host_token", token);
      return { site: { name: si.name, drop_point: si.drop_point }, pools: pools.filter(p => p.site_id === si.id && p.order_date === date && !["cancelled", "waiting"].includes(p.status) && meals(p.id) > 0)
        .map(p => ({ id: p.id, seq: p.seq, status: p.status, menu: kitchens.find(k => k.id === p.kitchen_id).public_name, meals: meals(p.id), orders: handOrders(p.id) })) };
    },
    async collectCode(token, code, date) {
      const rid = (riders.find(r => r.token === token) || {}).id, kit = kitchens.find(k => k.token === token && k.delivery_mode === "runner");
      const o = orders.find(x => x.order_date === date && x.code === code.trim() && ["pending", "paid", "collected"].includes(x.status) &&
        (sites.find(s => s.id === x.site_id).host_token === token || (rid && pools.find(p => p.id === x.pool_id).rider_id === rid) || (kit && x.kitchen_id === kit.id)));
      if (!o) throw new Error("No order with code " + code + " for you today.");
      if (o.status === "collected") throw new Error("Code " + code + " was already collected.");
      const wasPaid = o.status === "paid"; o.status = "collected"; o.collected_at = nowIso();
      return { name: o.customer_name, item_name: o.item_name, qty: o.qty, was_paid: wasPaid };
    },
    async isAdmin() { return true; },
    async adminData(date) {
      housekeeping();
      return { orders: orders.filter(o => o.order_date === date), pools: pools.filter(p => p.order_date === date).map(p => ({ ...p, meals: meals(p.id) })), riders, sites, kitchens,
        wallets: profiles.map(p => ({ ...p, balance: balance(p.user_id) })), items, team };
    },
    async updateOrder(id, patch) { Object.assign(orders.find(o => o.id === id), patch); },
    async updatePool(id, patch) { const p = pools.find(x => x.id === id); Object.assign(p, patch); if (patch.status && stamp[patch.status]) p[stamp[patch.status]] = nowIso(); },
    async updateKitchen(id, patch) { Object.assign(kitchens.find(k => k.id === id), patch); },
    async creditWallet(user_id, amount, reason) { ledger.push({ user_id, amount: Number(amount), reason, created_at: nowIso(), created_by: "coordinator" }); },
    async myRole() { return "super"; },
    async claimOwner() { return "super"; },
    async requestSite(r) {
      if (!r.name || r.name.trim().length < 3) throw new Error("Add the building's name.");
      if (!r.drop_point || r.drop_point.trim().length < 3) throw new Error('Say where the food should be dropped, like "Main gate".');
      if (r.lat == null) throw new Error("Drop a pin on the map first.");
      const si = { id: "s" + uid(), name: r.name.trim(), drop_point: r.drop_point.trim(), handoff: "meet_rider", host_label: null, host_token: "demo" + uid(), lat: r.lat, lng: r.lng, status: "pending", request_note: (r.note || "").trim() || null, created_at: nowIso(), active: true };
      sites.push(si); return { id: si.id, name: si.name, status: "pending" };
    },
    async addKitchen(k) { const x = { id: "k" + uid(), token: "demo" + uid(), active: true, added_by_customer: false, site_id: null, ...k }; kitchens.push(x); return x; },
    async saveItem(it) { if (it.id) Object.assign(items.find(i => i.id === it.id), it); else items.push({ id: "i" + uid(), addons: [], active: true, ...it }); },
    async addRider(r) { riders.push({ id: "r" + uid(), token: "demo" + uid(), active: true, ...r }); },
    async updateRider(id, p) { Object.assign(riders.find(r => r.id === id), p); },
    async addSite(si) { sites.push({ id: "s" + uid(), host_token: "demo" + uid(), status: "active", active: true, created_at: nowIso(), ...si }); },
    async updateSite(id, p) { Object.assign(sites.find(x => x.id === id), p); },
    async addTeam(email, role) { if (team.some(t => t.email === email)) throw new Error("That email is already on the team."); team.push({ email, role }); },
    async removeTeam(email) { team.splice(team.findIndex(t => t.email === email), 1); },
    async removeKitchen(id) { const k = kitchens.find(x => x.id === id); if (orders.some(o => o.kitchen_id === id)) { k.archived = true; k.active = false; return "archived"; } kitchens.splice(kitchens.indexOf(k), 1); return "deleted"; },
    async removeSite(id) { const x = sites.find(y => y.id === id); kitchens.filter(k => k.site_id === id).forEach(k => { k.archived = true; k.active = false; }); if (orders.some(o => o.site_id === id)) { x.archived = true; x.active = false; return "archived"; } sites.splice(sites.indexOf(x), 1); return "deleted"; },
    async updateTeam(email, role) { team.find(t => t.email === email).role = role; }
  };
}

/* =====================================================================================
   LIVE DATA LAYER: Supabase
   ===================================================================================== */
function makeSupabaseApi() {
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const must = r => { if (r.error) throw new Error(r.error.message); return r.data; };
  const rpc = async (fn, args) => must(await sb.rpc(fn, args || {}));
  const stamp = { accepted: "accepted_at", ready: "ready_at", picked_up: "picked_up_at", arriving: "arriving_at", delivered: "delivered_at" };
  return {
    demo: false,
    async load() {
      const [settings, sites, menus, items] = await Promise.all([
        sb.from("settings").select("*").eq("id", 1).single().then(must),
        sb.from("public_sites").select("*").order("name").then(must),
        sb.from("public_menus").select("*").order("public_name").then(must),
        sb.from("menu_items").select("*").eq("active", true).order("price").then(must)
      ]);
      return { settings, sites, menus, items };
    },
    async board(date) {
      await sb.rpc("housekeeping");
      const [pools, load, activity, days] = await Promise.all([
        sb.from("public_pools").select("*").eq("order_date", date).then(must),
        sb.from("kitchen_load").select("*").eq("order_date", date).then(must),
        sb.from("recent_activity").select("*").order("created_at", { ascending: false }).limit(50).then(must),
        sb.from("kitchen_days").select("kitchen_id").eq("order_date", date).then(must)
      ]);
      const l = {}; load.forEach(r => { l[r.kitchen_id] = r.meals; });
      return { pools, load: l, activity, open: days.map(x => x.kitchen_id) };
    },
    placeOrder: r => rpc("place_order", { p_site: r.site, p_item: r.item, p_qty: r.qty, p_name: r.name, p_phone: r.phone, p_ref: r.ref || null,
      p_addons: r.addons || [], p_note: r.note || null, p_special: r.special || null, p_use_wallet: !!r.useWallet }),
    payQuote: (id, ref, useWallet) => rpc("pay_quote", { p_order: id, p_ref: ref || null, p_use_wallet: !!useWallet }),
    myOrders: ids => rpc("my_orders", { p_ids: ids }),
    addVendor: r => rpc("add_vendor", { p_site: r.site, p_name: r.name, p_whatsapp: r.whatsapp, p_items: r.items }),
    async user() { const { data } = await sb.auth.getUser(); const u = data && data.user; return u ? { id: u.id, email: u.email, name: (u.user_metadata && (u.user_metadata.name || u.user_metadata.full_name)) || null } : null; },
    async signUp(email, password, name) { const d = must(await sb.auth.signUp({ email, password, options: { data: { name: name || null } } })); if (!d.session) throw new Error("Check your email to confirm your account, then sign in."); return { id: d.user.id, email, name: name || null }; },
    async signIn(email, password) { const d = must(await sb.auth.signInWithPassword({ email, password })); return { id: d.user.id, email, name: (d.user.user_metadata && d.user.user_metadata.name) || null }; },
    async signInGoogle() { must(await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: baseUrl() } })); },
    async signOut() { await sb.auth.signOut(); },
    async updateName(name) { const d = must(await sb.auth.updateUser({ data: { name } })); try { await this.saveProfile({ name }); } catch (e) {} return { id: d.user.id, email: d.user.email, name }; },
    async accountStats() { const r = await sb.rpc("admin_account_stats"); if (r.error && /function|schema cache/i.test(r.error.message)) throw new Error("Run update-7.sql in the Supabase SQL Editor once."); return must(r); },
    async updateSettings(patch) { const r = await sb.from("settings").update(patch).eq("id", 1).select("id");
      if (r.error && /base_fare|per_km|column|schema cache/i.test(r.error.message)) throw new Error("Run update-7.sql in the Supabase SQL Editor once, then try again.");
      if (!must(r).length) throw new Error("Not saved. Your account may not have permission to change settings."); },
    async saveProfile(p) { const u = await this.user(); if (u) must(await sb.from("profiles").upsert({ user_id: u.id, email: u.email, ...p })); },
    claimOrders: ids => rpc("claim_orders", { p_ids: ids }),
    wallet: () => rpc("my_wallet"),
    kitchenView: (t, d) => rpc("kitchen_view", { p_token: t, p_date: d }),
    kitchenOpenDay: (t, d) => rpc("kitchen_open_day", { p_token: t, p_date: d }),
    kitchenUpdate: (t, p, s) => rpc("kitchen_update", { p_token: t, p_pool: p, p_status: s }),
    kitchenQuote: (t, o, price) => rpc("kitchen_quote", { p_token: t, p_order: o, p_price: Number(price) }),
    async kitchenDecline(t, o, reason) { const r = await sb.rpc("kitchen_decline", { p_token: t, p_order: o, p_reason: reason || null });
      if (r.error && /function|schema cache/i.test(r.error.message)) throw new Error("ChopPool needs a quick update before you can decline. Please tell ChopPool."); return must(r); },
    async waitingPools(date) { const ps = must(await sb.from("public_pools").select("*").eq("order_date", date).eq("status", "waiting")); return ps.filter(p => p.meals > 0); },
    vendorSetMenu: (t, items) => rpc("vendor_set_menu", { p_token: t, p_items: items }),
    riderView: (t, d) => rpc("rider_view", { p_token: t, p_date: d }),
    riderUpdate: (t, p, s) => rpc("rider_update", { p_token: t, p_pool: p, p_status: s }),
    hostView: (t, d) => rpc("host_view", { p_token: t, p_date: d }),
    collectCode: (t, c, d) => rpc("collect_code", { p_token: t, p_code: c, p_date: d }),
    isAdmin: () => rpc("is_admin"),
    async adminData(date) {
      await sb.rpc("housekeeping");
      const [orders, pools, riders, sites, kitchens, wallets, items, team] = await Promise.all([
        sb.from("orders").select("*").eq("order_date", date).order("created_at").then(must),
        sb.from("pools").select("*").eq("order_date", date).order("seq").then(must),
        sb.from("riders").select("*").order("name").then(must),
        sb.from("sites").select("*").order("name").then(must),
        sb.from("kitchens").select("*").order("created_at").order("id").then(must),
        rpc("admin_wallets"),
        sb.from("menu_items").select("*").order("name").then(must),
        sb.from("admins").select("*").order("role", { ascending: false }).then(must)
      ]);
      const m = {}; orders.forEach(o => { if (o.status !== "cancelled") m[o.pool_id] = (m[o.pool_id] || 0) + o.qty; });
      return { orders, pools: pools.map(p => ({ ...p, meals: m[p.id] || 0 })), riders, sites, kitchens, wallets, items, team };
    },
    async updateOrder(id, patch) { must(await sb.from("orders").update(patch).eq("id", id)); },
    async updatePool(id, patch) { if (patch.status && stamp[patch.status]) patch[stamp[patch.status]] = new Date().toISOString(); must(await sb.from("pools").update(patch).eq("id", id)); },
    async updateKitchen(id, patch) { const r = await sb.from("kitchens").update(patch).eq("id", id).select("id");
      if (r.error && /lat|lng|column|schema cache/i.test(r.error.message)) throw new Error("Run update-6.sql in the Supabase SQL Editor once, then try again.");
      if (!must(r).length) throw new Error("Not saved. Your account may not have permission to edit kitchens."); },
    async creditWallet(user_id, amount, reason) { must(await sb.from("wallet_entries").insert({ user_id, amount: Number(amount), reason, created_by: "coordinator" })); },
    myRole: () => rpc("my_role"),
    claimOwner: () => rpc("claim_owner"),
    requestSite: r => rpc("request_site", { p_name: r.name, p_drop_point: r.drop_point, p_lat: r.lat, p_lng: r.lng, p_note: r.note || null }),
    async addKitchen(k) { return must(await sb.from("kitchens").insert(k).select().single()); },
    async saveItem(it) { if (it.id) { const { id, ...p } = it; must(await sb.from("menu_items").update(p).eq("id", id)); } else must(await sb.from("menu_items").insert(it)); },
    async addRider(r) { must(await sb.from("riders").insert(r)); },
    async updateRider(id, p) { must(await sb.from("riders").update(p).eq("id", id)); },
    async addSite(si) { must(await sb.from("sites").insert(si)); },
    async updateSite(id, p) { must(await sb.from("sites").update(p).eq("id", id)); },
    async addTeam(email, role) { const u = await this.user(); must(await sb.from("admins").insert({ email, role, added_by: u ? u.email : null })); },
    async removeTeam(email) { must(await sb.from("admins").delete().eq("email", email)); },
    async removeKitchen(id) { try { return await rpc("admin_remove_kitchen", { p_id: id }); } catch (e) { throw /function|schema cache/i.test(e.message) ? new Error("Run update-6.sql in the Supabase SQL Editor once, then try again.") : e; } },
    async removeSite(id) { try { return await rpc("admin_remove_site", { p_id: id }); } catch (e) { throw /function|schema cache/i.test(e.message) ? new Error("Run update-6.sql in the Supabase SQL Editor once, then try again.") : e; } },
    async updateTeam(email, role) { must(await sb.from("admins").update({ role }).eq("email", email)); }
  };

function loadLeaflet() {

    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload = () => res(window.L); s.onerror = () => { leafletP = null; rej(new Error("The map couldn't load. Check your connection and try again.")); };
    document.head.appendChild(s);

}

async function refreshMine() {
  if (!$("#tabOrders")) return;
  const saved = (local.get("cp_orders") || []).filter(o => o.order_date >= today());
  let rows = [];
  if (saved.length || S.user) { try { rows = await api.myOrders(saved.map(o => o.id)); } catch (e) { return; } }
  S.mine = rows;
  const prev = S.mineStatus || {}; S.mineStatus = {};
  rows.forEach(o => {
    const key = o.status + "|" + o.pool_status; S.mineStatus[o.id] = key;
    const changed = prev[o.id] && prev[o.id] !== key;
    if (changed && (["arriving", "delivered"].includes(o.pool_status) || ["quoted", "cancelled"].includes(o.status) || (o.pool_status === "collecting" && prev[o.id].endsWith("|waiting"))) && o.status !== "collected") {
      const msg = statusLine(o); toast(msg); sysNotify("Your ChopPool lunch", msg);
    }
  });
  const active = rows.filter(o => !["collected", "cancelled"].includes(o.status)).length;
  $("#ordBadge").textContent = active; $("#ordBadge").classList.toggle("hidden", !active);
  if (S.tab === "orders") renderOrders();
}
// Full bill for a priced special request, so the customer sees exactly what they pay for
function quoteBreakdown(o) {
  const q = Number(o.qty) || 1, rows = [[q + " × " + o.item_name + " with your request (seller's price " + money(o.quote_price) + ")", Number(o.quote_price) * q]];
  if (Number(o.addons_total)) rows.push(["Add-ons: " + addonText(o.addons), Number(o.addons_total) * q]);
  if (o.max_fee != null) rows.push(["Delivery (the most it can be)", Number(o.max_fee) * q]);
  if (o.service_fee != null) rows.push(["Service fee", Number(o.service_fee)]);
  if (Number(o.wallet_used)) rows.push(["Wallet credit used", -Number(o.wallet_used)]);
  return `<div class="ledger" style="margin:4px 0 8px">${rows.map(([l, v]) => `<div><span>${esc(l)}</span><strong class="num">${v < 0 ? "−" : ""}${money(Math.abs(v))}</strong></div>`).join("")}
    <div><span><strong>Total to pay</strong></span><strong class="num">${money(o.amount_due)}</strong></div></div>
    <p class="small muted">Delivery drops as more people join the pool. The difference comes back to your wallet as cashback after ${fmtTime(S.settings.cutoff)}.</p>`;
}
function renderOrders() {
  const el = $("#tabOrders"), rows = S.mine || [];
  el.innerHTML = `<div class="section-title"><h1>Your orders</h1></div>` + (rows.map(o => {
    const step = progressOf(o), k = menuOf(o.kitchen_id);
    return `<article class="order-card"><div class="head"><span class="tile" style="background:${tint(menuIndex(o.kitchen_id))}">${art(dishKind(o.item_name))}</span>
      <div><strong>${o.qty} × ${esc(o.item_name)}</strong><p class="small muted">${esc(k.public_name || "")} · ${fmtDate(o.order_date)}</p></div>
      <div class="c"><span>Code</span><b class="num">${esc(o.code)}</b></div></div>
      ${o.status === "cancelled" ? "" : `<div class="track" aria-label="Progress ${step} of 5">${[1, 2, 3, 4, 5].map(n => `<i class="${n <= step ? "on" : ""}"></i>`).join("")}</div>`}
      <p class="status-text">${esc(statusLine(o))}</p>
      ${o.status === "quoted" ? quoteBreakdown(o) + `<button class="btn wide" data-pay="${esc(o.id)}">Pay ${money(o.amount_due)}</button>` : ""}
      ${o.status === "cancelled" && /^The seller can't/.test(o.cancel_reason || "") && S.menus.some(m => m.id === o.kitchen_id) ? `<button class="ghost wide" data-reorder="${esc(o.kitchen_id)}">Order the standard meal instead</button>` : ""}</article>`;
  }).join("") || `<div class="empty">${ICON.receipt}<p>No orders yet today.</p><button class="btn" data-gohome>See today's pools</button></div>`);
}

function showConfirmation(r, k, site, special) {

    (drop ? " " + drop.more + " more and it drops to " + money(drop.fee) + "." : "") + " Order before " + fmtTime(s.cutoff) + ": " + baseUrl();

  const body = special ? `${esc(k.public_name)} will price your request before ${fmtTime(s.special_cutoff)}. You'll see the price under Orders, then pay to confirm.`

    <span class="success">${ICON.check}</span>
    <div class="center" style="display:grid;gap:6px"><h2 id="sheetTitle">${esc(head)}</h2><p class="muted">${body}</p></div>
    <div class="center" style="display:grid;gap:8px"><p class="eyebrow">Your collection code</p><div class="codetiles">${String(r.code).split("").map(c => `<span>${esc(c)}</span>`).join("")}</div></div>
    ${!special && r.pool_status !== "waiting" && drop ? `<p class="note center">${drop.more} more ${drop.more === 1 ? "person" : "people"} and everyone's delivery drops to ${money(drop.fee)}.</p>` : ""}
    ${!special && r.pool_status !== "waiting" ? `<a class="wa" href="https://wa.me/?text=${encodeURIComponent(invite)}" target="_blank" rel="noopener">${ICON.wa} Invite colleagues on WhatsApp</a>` : ""}

}

      ${K.pools.map(p => {
        const tally = {}; p.orders.filter(o => !o.special_request || o.status !== "quote_requested").forEach(o => { const key = o.item_name + (o.addons?.length ? " (" + addonText(o.addons) + ")" : "") + (o.special_request ? " · Special: " + o.special_request : ""); tally[key] = (tally[key] || 0) + o.qty; });
        const n = p.orders.reduce((a, o) => a + o.qty, 0), quotes = p.orders.filter(o => ["quote_requested", "quoted"].includes(o.status));
        const btns = p.status === "waiting" ? "" : p.status === "collecting" ? (afterCut ? `<button class="btn wide" data-k="accepted" data-pool="${esc(p.id)}">Confirm final batch</button>` : `<p class="small muted">Orders close at ${fmtTime(S.settings.cutoff)}. Then confirm the final batch.</p>`)
          : p.status === "accepted" ? `<button class="btn wide" data-k="ready" data-pool="${esc(p.id)}">Mark packed</button>`
          : k.delivery_mode === "runner" && p.status === "ready" ? `<button class="btn wide" data-k="picked_up" data-pool="${esc(p.id)}">Runner has picked up</button>`
          : k.delivery_mode === "runner" && p.status === "picked_up" ? `<button class="btn wide" data-k="arriving" data-pool="${esc(p.id)}">5 minutes away</button>`
          : k.delivery_mode === "runner" && p.status === "arriving" ? `<button class="btn wide" data-k="delivered" data-pool="${esc(p.id)}">Arrived</button>`
          : `<p><span class="chip ok">${STEP_LABEL[p.status]}</span></p>`;
        const runnerHand = k.delivery_mode === "runner" && ["arriving", "delivered"].includes(p.status)
          ? (p.handoff === "host" ? `<p>Hand the bag to <strong>${esc(p.host_label || p.drop_point)}</strong>.</p>` : `<p>At <strong>${esc(p.drop_point)}</strong>, hand each meal over against its code.</p>${codeBox("rc-" + p.id)}`) : "";
        return `<article class="card"><div class="top"><h2>${esc(p.site)} · Pool ${p.seq}</h2><span class="chip">${n} meals</span></div>${stepsHtml(p.status)}
          <p class="small muted">One sealed bag for ${esc(p.drop_point)}</p>
          ${Object.keys(tally).length ? `<ul style="margin:0;padding-left:20px">${Object.entries(tally).map(([nm, q]) => `<li class="num"><strong>${q} ×</strong> ${esc(nm)}</li>`).join("")}</ul>` : ""}
          ${quotes.map(o => `<form class="quote" data-quote="${esc(o.id)}"><p><strong>Special request, code ${esc(o.code)}</strong>${o.status === "quoted" ? ` <span class="chip warn">Priced ${money(o.quote_price)}, waiting for payment</span>` : ""}</p>
            <div class="stack small" style="gap:2px"><span><strong>${o.qty} × ${esc(o.item_name)}</strong>${o.unit_price != null ? ` <span class="muted">(menu price ${money(o.unit_price)})</span>` : ""}</span>
              ${o.addons?.length ? `<span>Add-ons: ${esc(addonText(o.addons))}${Number(o.addons_total) ? ` <span class="muted">(${money(o.addons_total)} a meal, charged separately)</span>` : ""}</span>` : ""}
              <span>Request: <strong>${esc(o.special_request)}</strong></span>${o.note ? `<span class="muted">Note: ${esc(o.note)}</span>` : ""}</div>
            <div><label for="qp-${o.id}">Full price per meal, including the extra (GHS)</label><input id="qp-${o.id}" inputmode="decimal" value="${esc(o.quote_price ?? o.unit_price ?? "")}">
              <p class="small muted" style="margin-top:4px">Start from the menu price and add what the extra costs.${o.addons?.length ? " Don't include add-ons; they're added on top." : ""}</p></div>
            <div class="row" style="justify-content:flex-start;gap:8px"><button class="btn">${o.status === "quoted" ? "Update price" : "Send price"}</button><button class="ghost" type="button" data-decline="${esc(o.id)}">Can't do this</button></div></form>`).join("")}
          <p class="small muted">Label each pack with its code:</p>
          <div class="labels">${p.orders.filter(o => !["quote_requested", "quoted"].includes(o.status)).map(o => `<div><span class="lc num">${esc(o.code)}</span><span>${o.qty} × ${esc(o.item_name)}${o.addons?.length ? " · " + esc(addonText(o.addons)) : ""}${o.special_request ? `<br><strong>Special: ${esc(o.special_request)}</strong>` : ""}${o.note ? `<br><span class="small muted">Note: ${esc(o.note)}</span>` : ""}</span>${o.collected ? `<span class="tick">Collected</span>` : o.paid ? "" : `<span class="chip warn">Payment pending</span>`}</div>`).join("") || `<p class="small muted">No paid orders yet.</p>`}</div>
          ${runnerHand}${btns}</article>`;
      }).join("") || `<p class="card muted">No orders yet for ${fmtDate(d)}. Orders close at ${fmtTime(S.settings.cutoff)}.</p>`}
      ${k.added_by_customer ? `<section class="card"><h2>Your menu</h2><p class="small muted">Check the dishes and prices the customer added for you. Clear a price box to stop selling a dish.</p>
        <div id="menuRows" class="stack">${K.menu.map(i => `<div class="menurow" data-id="${esc(i.id)}"><input aria-label="Dish" value="${esc(i.name)}"><input aria-label="Price" inputmode="decimal" value="${esc(i.price)}"><span class="small muted">GHS</span></div>`).join("")}
        <div class="menurow"><input aria-label="New dish" placeholder="New dish"><input aria-label="Price" inputmode="decimal" placeholder="Price"><span class="small muted">GHS</span></div></div>
        <button class="ghost" id="saveMenu">Save menu</button></section>` : ""}`;
    $("#openDay")?.addEventListener("click", async () => { try { await api.kitchenOpenDay(token, d); toast("Thank you. Customers can now order from you for " + dayLabel(d) + "."); draw(); } catch (e) { toast(cleanErr(e)); } });
    $("#saveMenu")?.addEventListener("click", async () => {
      const list = [...document.querySelectorAll("#menuRows .menurow")].map(r => ({ id: r.dataset.id || null, name: r.children[0].value.trim(), price: r.children[1].value.trim(), active: r.dataset.id ? !!r.children[1].value.trim() : true }));
      try { await api.vendorSetMenu(token, list); toast("Menu saved"); draw(); } catch (e) { toast(cleanErr(e)); }
    });
  };
  $("#view").addEventListener("click", async e => {
    const day = e.target.closest("[data-kday]"); if (day) { d = day.dataset.kday; return draw(); }
    const dec = e.target.closest("[data-decline]");
    if (dec) {
      openSheet(`${sheetHead("Can't do this request?", "The customer is told and can order the standard meal instead. Nothing is charged.")}
        <div><label for="decWhy">Reason (optional)</label><input id="decWhy" maxlength="120" placeholder="No tilapia today"></div>
        <div class="row" style="justify-content:flex-start;gap:8px"><button class="btn" id="decYes">Decline request</button><button class="ghost" data-close>Keep it</button></div>`);
      $("#decYes").addEventListener("click", async () => { try { await api.kitchenDecline(token, dec.dataset.decline, $("#decWhy").value.trim()); closeSheet(); toast("Request declined. The customer has been told."); draw(); } catch (err) { toast(cleanErr(err)); } });
      return;
    }
    const b = e.target.closest("button[data-k]"); if (!b) return;
    b.disabled = true;
    try { await api.kitchenUpdate(token, b.dataset.pool, b.dataset.k); toast({ accepted: "Batch confirmed. Thank you.", ready: "Marked packed.", picked_up: "On the way.", arriving: "Customers have been told you're 5 minutes away.", delivered: "Arrived. Hand over meals against codes." }[b.dataset.k]); draw(); }
    catch (err) { b.disabled = false; toast(cleanErr(err)); }
  });
  $("#view").addEventListener("submit", async e => {
    const f = e.target.closest("[data-quote]"); if (!f) return;
    e.preventDefault();
    try { await api.kitchenQuote(token, f.dataset.quote, f.querySelector("input").value); toast("Price sent. The customer will pay to confirm."); draw(); } catch (err) { toast(cleanErr(err)); }
  });
  wireCodes(token, () => d, draw);
  await draw(); every(() => { if (!document.activeElement?.matches("#view input")) draw(); }, 30000);
}

/* =====================================================================================
   RIDER VIEW (#rider-TOKEN) and HOST VIEW (#host-TOKEN)
   ===================================================================================== */
function codeBox(id) {
  return `<form class="codebox" data-codeform><input id="${id}" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="Customer code"><button class="btn">Hand over</button></form>`;
}
function wireCodes(token, d, redraw) {
  $("#view").addEventListener("submit", async e => {
    const f = e.target.closest("[data-codeform]"); if (!f) return;
    e.preventDefault();
    const input = f.querySelector("input"), code = input.value.trim();
    if (!/^\d{4}$/.test(code)) return toast("Enter the customer's 4-digit code.");
    try {
      const r = await api.collectCode(token, code, typeof d === "function" ? d() : d);
      toast("Give " + r.qty + " × " + r.item_name + " to " + r.name + "." + (r.was_paid ? "" : " Note: payment was not yet confirmed."));
      input.value = ""; redraw();
    } catch (err) { toast(cleanErr(err)); }
  });
}
const handList = os => `<div class="labels">${os.map(o => `<div><span class="lc num">${esc(o.code)}</span><span>${esc(o.name)} · ${o.qty} × ${esc(o.item_name)}</span>${o.collected ? `<span class="tick">Collected</span>` : `<span class="muted small">Waiting</span>`}</div>`).join("")}</div>`;
async function viewRider(token) {
  const d = opsDate();
  const NEXT = { ready: ["picked_up", "Picked up"], picked_up: ["arriving", "5 minutes away"], arriving: ["delivered", "Arrived"] };
  const draw = async () => {
    let R; try { R = await api.riderView(token, d); } catch (e) { $("#view").innerHTML = `<p class="card err">${esc(cleanErr(e))}</p>`; return; }
    $("#view").innerHTML = `<header><p class="brand" style="font-size:18px">ChopPool rider</p><h1>${esc(R.rider.name)}</h1><p class="muted">${fmtDate(d)} · deliver by ${fmtTime(S.settings.delivery_time)}</p></header>` +
      (R.pools.map((p, i) => {
        const nx = NEXT[p.status];
        const btn = nx ? `<button class="btn wide" data-r="${nx[0]}" data-pool="${esc(p.id)}">${nx[1]}</button>` : p.status === "delivered" ? "" : `<p class="chip warn">Wait for the kitchen to pack</p>`;
        const hand = p.handoff === "host"
          ? `<p>Hand the sealed bag to <strong>${esc(p.host_label || p.drop_point)}</strong>, then tap Arrived.</p>`
          : `<p>Wait at <strong>${esc(p.drop_point)}</strong> for ${S.settings.arrival_window_min} minutes. Hand each meal over against its code.</p>${["arriving", "delivered"].includes(p.status) ? codeBox("c-" + p.id) : ""}${handList(p.orders)}`;
        return `<article class="card"><div class="top"><h2>Stop ${i + 1}: ${esc(p.site)}</h2><span class="chip">${p.meals} meals</span></div>${stepsHtml(p.status)}
          <p class="small"><strong>Pick up:</strong> ${esc(p.kitchen)}${p.kitchen_address ? ", " + esc(p.kitchen_address) : ""}${p.kitchen_phone ? " · " + esc(p.kitchen_phone) : ""}</p>
          <p class="small"><strong>Drop:</strong> ${esc(p.drop_point)} (Pool ${p.seq}, 1 bag)</p>${hand}${btn}</article>`;
      }).join("") || `<p class="card muted">No deliveries assigned to you today yet.</p>`);
  };
  $("#view").addEventListener("click", async e => {
    const b = e.target.closest("button[data-r]"); if (!b) return;
    b.disabled = true;
    try { await api.riderUpdate(token, b.dataset.pool, b.dataset.r); draw(); } catch (err) { b.disabled = false; toast(cleanErr(err)); }
  });
  wireCodes(token, d, draw);
  await draw(); every(() => { if (!document.activeElement?.matches("[data-codeform] input")) draw(); }, 30000);
}
async function viewHost(token) {
  const d = opsDate();
  const draw = async () => {
    let H; try { H = await api.hostView(token, d); } catch (e) { $("#view").innerHTML = `<p class="card err">${esc(cleanErr(e))}</p>`; return; }
    const left = H.pools.flatMap(p => p.orders).filter(o => !o.collected).length;
    $("#view").innerHTML = `<header><p class="brand" style="font-size:18px">ChopPool drop point</p><h1>${esc(H.site.name)}</h1><p class="muted">${fmtDate(d)} · ${esc(H.site.drop_point)} · ${left} meals waiting</p></header>
      <section class="card"><h2>Hand over a meal</h2><p class="small muted">Ask for the customer's 4-digit code.</p>${codeBox("hostcode")}</section>` +
      (H.pools.map(p => `<article class="card"><div class="top"><h3>${esc(p.menu)} · Pool ${p.seq}</h3><span class="chip ${p.status === "delivered" ? "ok" : "dim"}">${p.status === "delivered" ? "Bag arrived" : STEP_LABEL[p.status]}</span></div>${handList(p.orders)}</article>`).join("")
        || `<p class="card muted">No deliveries for today yet.</p>`);
  };
  wireCodes(token, d, draw);
  await draw(); every(() => { if (!document.activeElement?.matches("[data-codeform] input")) draw(); }, 30000);
}

/* =====================================================================================
   Routing and start-up
   ===================================================================================== */
async function route() {
  clearTimers(); closeSheet();
  if ($("#demoBar")) $("#demoBar").open = false;
  const old = $("#view"), fresh = old.cloneNode(false); old.replaceWith(fresh);   // drops old listeners
  const h = location.hash.slice(1);
  const view = h.startsWith("kitchen-") ? "kitchen" : h.startsWith("rider-") ? "rider" : h.startsWith("host-") ? "host" : h === "admin" ? "admin" : "order";
  document.querySelectorAll("#demoBar a").forEach(a => { if (a.getAttribute("href") === "#" + h || (view === "order" && a.dataset.view === "order")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (view === "kitchen") return viewKitchen(h.slice(8));
  if (view === "rider") return viewRider(h.slice(6));
  if (view === "host") return viewHost(h.slice(5));
  if (view === "admin") return viewAdmin();
  return viewOrder();
}
async function start() {
  if (DEMO) $("#demoBar").classList.remove("hidden");
  if (!DEMO) {
    for (let i = 0; i < 80 && !window.supabase; i++) await new Promise(r => setTimeout(r, 100));
    if (!window.supabase) { $("#view").innerHTML = `<p class="card err">ChopPool couldn't connect. Check your internet connection and refresh.</p>`; return; }
    api = makeSupabaseApi();
  }
  try { Object.assign(S, await api.load()); }
  catch (e) { $("#view").innerHTML = `<p class="err">We couldn't load the menu: ${esc(cleanErr(e))}. Refresh to try again.</p>`; return; }
  S.date = orderDate(S.settings);
  const saved = local.get("cp_site");
  S.siteId = S.sites.some(x => x.id === saved) ? saved : (S.sites[0] || {}).id;
  $("#sheetBg").addEventListener("click", e => { if (e.target === $("#sheetBg")) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  window.addEventListener("hashchange", route);
  if (!DEMO) { try { window.supabase && (await api.user()) && afterSignIn(); } catch (e) {} }
  route();
}
start();
</script>
