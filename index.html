<style>
:root {
  /* Layout: phone-width app shell. App bar on top, scrolling content, tab bar fixed at the bottom.
     Light and dark both use the Jollof palette: tomato-orange accent, saffron hints, warm neutrals. Cards float on soft shadows, not borders. */
  --bg: #F8F4EF;
  --surface: #FFFFFF;
  --surface-2: #FBF8F4;
  --ink: #23160F;
  --muted: #7C685C;
  --line: #EEE3D8;
  --accent: #C2410C;
  --accent-2: #9A3412;
  --on-accent: #FFFFFF;
  --accent-soft: #FDEADF;
  --hint: #A3620B;
  --hint-soft: #FCF1DC;
  --ok: #2B7A4B;
  --ok-soft: #E2F3E8;
  --danger: #B42318;
  --danger-soft: #FDE8E6;
  --tint-1: #FDE6D8; --tint-2: #E3F1E6; --tint-3: #FCEFD2; --tint-4: #E8E6F7;
  --shadow: 0 1px 2px rgba(60, 30, 10, .06), 0 8px 24px rgba(60, 30, 10, .07);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0E10; --surface: #17171A; --surface-2: #202024; --ink: #F4F4F5; --muted: #A1A1AA; --line: #2C2C31;
    --accent: #F2652A; --accent-2: #FF7A45; --on-accent: #1A0B04; --accent-soft: #2E1A12; --hint: #F5B04A; --hint-soft: #2B2314;
    --ok: #62D394; --ok-soft: #15291E; --danger: #FF8A80; --danger-soft: #34191A;
    --tint-1: #24201E; --tint-2: #1C2420; --tint-3: #26231C; --tint-4: #22201F;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0E10; --surface: #17171A; --surface-2: #202024; --ink: #F4F4F5; --muted: #A1A1AA; --line: #2C2C31;
  --accent: #F2652A; --accent-2: #FF7A45; --on-accent: #1A0B04; --accent-soft: #2E1A12; --hint: #F5B04A; --hint-soft: #2B2314;
  --ok: #62D394; --ok-soft: #15291E; --danger: #FF8A80; --danger-soft: #34191A;
  --tint-1: #24201E; --tint-2: #1C2420; --tint-3: #26231C; --tint-4: #22201F;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: grid; gap: 18px; align-content: start; }
.stack { display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 28px; font-weight: 800; line-height: 1.1; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--accent); letter-spacing: -0.02em; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }

/* Demo switcher: small and out of the way */
.demo { font-size: 13px; }
.demo summary { list-style: none; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--hint); font-weight: 700; background: var(--hint-soft); border-radius: 999px; padding: 5px 12px; }
.demo summary::-webkit-details-marker { display: none; }
.demo[open] summary { margin-bottom: 8px; }
.demo p { color: var(--muted); margin-bottom: 8px; }
.demo nav { display: flex; gap: 6px; flex-wrap: wrap; }
.demo a { color: var(--ink); font-weight: 600; text-decoration: none; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 12px; }
.demo a[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* App bar */
.appbar { display: flex; align-items: center; gap: 10px; }
.place { display: grid; gap: 0; background: none; border: none; padding: 0; text-align: left; color: var(--ink); min-width: 0; flex: 1; cursor: pointer; }
.place .eyebrow { display: flex; gap: 4px; align-items: center; }
.place strong { font-family: var(--font-display); font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 2px; min-width: 0; }
.place strong #placeName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.place strong svg { flex: none; }
.iconbtn { background: var(--surface); border: none; box-shadow: var(--shadow); color: var(--ink); width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; padding: 0; flex: none; position: relative; }
.iconbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-weight: 800; font-size: 17px; border: none; padding: 0; display: grid; place-items: center; flex: none; }
.avatar.guest { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Hero */
.hero { position: relative; overflow: hidden; border-radius: 28px; padding: 20px; background: radial-gradient(130% 120% at 85% 0%, #F7853C 0%, #E2561A 40%, #B93A0C 100%); color: #fff; display: grid; gap: 14px; box-shadow: 0 16px 36px rgba(185,58,12,.32); }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22120%22%20height%3D%22120%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M10%2030h34a17%2017%200%200%201-34%200z%22/%3E%3Cpath%20d%3D%22M18%2024c0-4%204-4%204-8M27%2024c0-4%204-4%204-8%22/%3E%3Cpath%20d%3D%22M78%2012l14%2030M86%2010v14a4%204%200%200%200%208%200V10M90%2024v22%22/%3E%3Cpath%20d%3D%22M70%2080c6-10%2020-10%2026%200-6%2010-20%2010-26%200z%22/%3E%3Cpath%20d%3D%22M70%2080h26%22/%3E%3Cpath%20d%3D%22M14%2084c8-6%2014%202%2022-4%204%2010-8%2022-22%2014z%22/%3E%3Cpath%20d%3D%22M14%2094c6-4%2012-6%2022-14%22/%3E%3Ccircle%20cx%3D%2256%22%20cy%3D%2256%22%20r%3D%223%22/%3E%3Ccircle%20cx%3D%22104%22%20cy%3D%22104%22%20r%3D%222%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%22108%22%20r%3D%222%22/%3E%3C/svg%3E") 0 0 / 120px repeat; opacity: .14; -webkit-mask-image: linear-gradient(100deg, transparent 25%, #000 80%); mask-image: linear-gradient(100deg, transparent 25%, #000 80%); }
.hero::before { content: none; }
.hero h1 { color: inherit; position: relative; z-index: 1; }
.hero p { opacity: .92; position: relative; z-index: 1; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; position: relative; z-index: 1; }
.hero-stat { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22); border-radius: 16px; padding: 10px 12px; display: grid; align-content: start; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.hero-stat.hurry { box-shadow: 0 0 0 2px #fff; animation: hurry 1.6s ease-in-out infinite; }
@keyframes hurry { 50% { box-shadow: 0 0 0 2px rgba(255,255,255,.35); } }
:root[data-theme="dark"] .hero-stat.hurry { box-shadow: 0 0 0 2px #FF6A2B; }
button.hero-stat { padding-right: 22px !important; font: inherit; color: inherit; text-align: left; cursor: pointer; position: relative; }
button.hero-stat::after { content: "›"; position: absolute; right: 9px; top: 6px; font-weight: 700; font-size: 17px; opacity: .85; }
.hero-stat b { font-family: var(--font-display); font-size: 18px; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hero-stat { min-width: 0; }
.hero-stat .of { display: block; opacity: .8; }
.mylunch { position: relative; z-index: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 12px; row-gap: 9px; width: 100%; min-height: 0; text-align: left; color: inherit; font: inherit; line-height: 1.25; background: rgba(0,0,0,.16); border: 1px solid rgba(255,255,255,.2); border-radius: 16px; padding: 11px 14px 12px; cursor: pointer; box-shadow: none; }
.mylunch .ml-code { display: grid; justify-items: end; line-height: 1.1; }
.mylunch .ml-code small { opacity: .75; font-size: 12px; }
.mylunch .ml-code b { font-size: 17px; letter-spacing: .02em; }
.mylunch .ml-t { display: grid; min-width: 0; }
.mylunch b { font-size: 15px; font-weight: 700; }
.mylunch small { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mylunch .code { font-weight: 700; letter-spacing: .02em; }
.ml-dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.22); }
.ml-dot.go { animation: mlPulse 1.6s ease-in-out infinite; }
@keyframes mlPulse { 50% { box-shadow: 0 0 0 7px rgba(255,255,255,0); } }
@media (prefers-reduced-motion: reduce) { .ml-dot.go { animation: none; } }
.mylunch.bad { background: #7F1D1D; border-color: rgba(255,255,255,.35); }
.mylunch.bad .ml-dot { background: #FCA5A5; }
.mlwrap { position: relative; z-index: 1; display: grid; gap: 8px; min-width: 0; }
.mlswipe { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.mlswipe::-webkit-scrollbar { display: none; }
.mlhost { position: relative; z-index: 1; min-width: 0; }
.mlhost:empty { display: none; }
.mlswipe > .mylunch { flex: 0 0 calc(100% - 26px); scroll-snap-align: start; scroll-snap-stop: always; }
.mldots { display: flex; justify-content: center; gap: 5px; }
.mldots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.35); transition: width .2s, background .2s; }
.mldots i.on { width: 16px; background: #fff; }
.ml-bar { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.ml-bar i { height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); }
.ml-bar i.on { background: #fff; }
.hero-stat b.long { font-size: 15px; line-height: 21px; }
.hero-stat b.tiny { font-size: 13px; }
.hero-stat b.xs { font-size: 12px; letter-spacing: -.01em; }
button.hero-stat { padding-right: 18px !important; }
button.hero-stat::after { right: 7px; }
.recv { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: var(--ok-soft); color: var(--ink); font-weight: 600; }
.solo .row .btn, .solo .row .ghost { padding: 9px 12px; }
.sumhint { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 1px; }
.hero-stat b .ampm { font-size: .6em; font-weight: 700; margin-left: 2px; letter-spacing: -.02em; }
.hero-stat span { font-size: 12px; opacity: .9; line-height: 1.3; }
:root[data-theme="dark"] .hero-stat { background: rgba(0,0,0,.12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero-stat { background: rgba(0,0,0,.12); } }

/* Pool cards */
.pool { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; display: grid; }
/* Pool and vendor cards: dish photo (or illustration on a warm gradient) with a dark fade, title over it */
.pool-art { position: relative; height: 176px; overflow: hidden; display: grid; place-items: center; color: #fff; }
.pool-art.small { height: 132px; }
.pool-art.g0 { background: linear-gradient(135deg, #7A3A12 0%, #C8641F 45%, #E9A23B 100%); }
.pool-art.g1 { background: linear-gradient(135deg, #3A1414 0%, #6E2F2B 50%, #B8682E 100%); }
.pool-art.g2 { background: linear-gradient(135deg, #1F3A26 0%, #3F6B3A 50%, #A99A38 100%); }
.pool-art.g3 { background: linear-gradient(135deg, #3B1F3F 0%, #7A3A52 50%, #D2783C 100%); }
.pool-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pool-art .illus { position: absolute; right: -14px; bottom: -42px; width: 172px; height: 172px; display: grid; place-items: center; }
.pool-art .illus::before { content: ""; position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.26), rgba(255,255,255,0) 62%); }
.pool-art.small .illus { width: 132px; height: 132px; right: -4px; bottom: -22px; }
.pool-art .illus svg { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 16px 22px rgba(0,0,0,.35)); }
.pool-art .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.62) 100%); }
.ptag { position: absolute; left: 14px; top: 14px; z-index: 1; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 5px 10px; background: rgba(255,255,255,.92); color: #1F7A4A; }
.ptag.warn { background: rgba(245,176,74,.95); color: #3A2008; }
.ptag.bad { background: rgba(255,255,255,.92); color: var(--danger); }
.ptag.dim { background: rgba(255,255,255,.85); color: #5A4A40; }
.pool-art .fee-tag { position: absolute; right: 14px; top: 14px; z-index: 1; background: rgba(30,14,6,.34); border: 1px solid rgba(255,255,255,.28); border-radius: 14px; padding: 6px 10px; text-align: right; color: #fff; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.fee-tag b { display: block; font-family: var(--font-display); font-size: 18px; font-weight: 800; line-height: 1.1; }
.fee-tag s { opacity: .85; font-size: 12px; }
.fee-tag span { font-size: 12px; opacity: .9; }
.ptitle { position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 1; display: grid; gap: 1px; text-align: left; }
.ptitle h3, .ptitle strong { color: #fff; font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -.3px; line-height: 1.15; }
.pool-art.small .ptitle strong { font-size: 19px; }
.ptitle span { font-size: 12.5px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Home: the slim stats strip sticks under the top bar once the big dashboard has scrolled away */
.homemini { position: -webkit-sticky; position: sticky; top: calc(var(--kh, 100px) + 6px); z-index: 6; margin-bottom: -54px; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 14px; border-radius: 14px;
  background: radial-gradient(130% 160% at 85% 0%, #F7853C 0%, #E2561A 45%, #B93A0C 100%); color: #fff; font-size: 12.5px; box-shadow: 0 8px 18px rgba(185,58,12,.28);
  opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .22s ease, transform .22s cubic-bezier(.2,.8,.2,1); will-change: opacity, transform; }
.homemini.show { opacity: 1; transform: none; }
.homemini b { font-family: var(--font-display); font-size: 15px; font-weight: 800; margin-right: 2px; }
.homemini span { white-space: nowrap; }
.revgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.revcard { display: grid; gap: 10px; padding: 12px; } .revcard img { width: 100%; height: 170px; object-fit: cover; border-radius: 14px; }
.hiddenrev { opacity: .55; }
.ratebox { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, #F5B04A 12%, var(--surface-2)); }
.ratebox > span { font-weight: 700; font-size: 14.5px; }
.stars { display: inline-flex; gap: 2px; vertical-align: -3px; color: var(--muted); }
.ratebox .stars button { border: none; background: none; padding: 2px; color: #E39A1E; cursor: pointer; }
.rated { margin: 0; display: flex; align-items: center; gap: 6px; }
.bigstars { display: flex; justify-content: center; gap: 6px; color: #E39A1E; }
.bigstars button { border: none; background: none; padding: 4px; cursor: pointer; transition: transform .15s; }
.bigstars button:active { transform: scale(.88); }
.rvphoto { display: grid; gap: 8px; } .rvphoto img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 16px; }
.revstrip { display: grid; gap: 8px; } .revstrip:empty { display: none; }
.ratingline { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 14px; }
.ratingline svg { margin-right: -2px; }
.photostrip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 2px 4px; scroll-snap-type: x mandatory; }
.photostrip::-webkit-scrollbar { display: none; }
.pshot { position: relative; flex: none; width: 104px; height: 104px; padding: 0; border: none; border-radius: 16px; overflow: hidden; background: var(--surface-2); scroll-snap-align: start; cursor: pointer; }
.pshot img { width: 100%; height: 100%; object-fit: cover; }
.pshot span { position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; gap: 1px; }
.revnote { margin: 0; font-size: 13.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.rstar { display: inline-flex; align-items: center; gap: 2px; font-weight: 800; color: var(--ink); }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.88); display: grid; place-items: center; align-content: center; gap: 12px; padding: 24px; animation: fadeIn .2s ease-out; }
.lightbox img { max-width: 100%; max-height: 72vh; border-radius: 18px; }
.lightbox p { color: #fff; margin: 0; text-align: center; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: center; }
.minebtns { display: grid; grid-template-columns: 1fr 52px; gap: 8px; }
.minebtns .btn { display: flex; align-items: center; justify-content: center; gap: 6px; }
.sharebtn { display: grid; place-items: center; padding: 0; border-radius: 15px; }
.mine-note { margin: 0; color: var(--muted); }
.waitbox { display: grid; gap: 12px; padding: 14px; border-radius: 20px; background: linear-gradient(135deg, color-mix(in srgb, #F5B04A 18%, var(--surface)) 0%, color-mix(in srgb, #F5B04A 6%, var(--surface)) 100%); border: 1px solid color-mix(in srgb, #F5B04A 38%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.wb-row { display: flex; align-items: center; gap: 12px; }
.wb-ring { position: relative; width: 56px; height: 56px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; gap: 1px; }
.wb-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.wb-ring circle { fill: none; stroke-width: 4; }
.wb-ring .trk { stroke: color-mix(in srgb, #F5B04A 22%, transparent); }
.wb-ring .arc { stroke: #F5B04A; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.16,1,.3,1); }
.wb-ring b { position: relative; font: 800 17px var(--font-display); color: var(--ink); }
.wb-ring small { position: relative; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.wb-text { display: grid; gap: 2px; min-width: 0; }
.wb-text strong { font: 700 15.5px var(--font-display); color: var(--ink); line-height: 1.25; }
.wb-text span { font-size: 13px; color: var(--muted); }
.wb-btn { height: 50px; border-radius: 15px; }
/* First time it appears: the ring draws in and the box settles */
.waitbox.fresh { animation: wbIn .55s cubic-bezier(.16,1,.3,1) both; }
.waitbox.fresh .arc { animation: wbDraw 1.1s cubic-bezier(.16,1,.3,1) .1s both; }
@keyframes wbIn { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes wbDraw { from { stroke-dashoffset: var(--c); } }
.wb-ring::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 0 0 rgba(245,176,74,.35); animation: wbBreathe 2.4s ease-in-out infinite; }
@keyframes wbBreathe { 50% { box-shadow: 0 0 0 5px rgba(245,176,74,0); } }
.seatline { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seatline .hint { font-weight: 700; }
.dishtext { margin: 0; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pool .btn.wide:not(:disabled) { height: 52px; border-radius: 16px; background: linear-gradient(180deg, #E8590C, var(--accent)); box-shadow: 0 8px 20px rgba(217,72,15,.32); }
.pool-body { padding: 14px 16px 16px; display: grid; gap: 12px; }
.kbody { padding: 12px 14px 14px; display: grid; gap: 10px; }
.seats { display: flex; gap: 5px; flex-wrap: wrap; }
.seats i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); display: block; transition: background .3s; }
.seats i.on { background: var(--accent); }
.seats i.next { box-shadow: inset 0 0 0 2px var(--accent); background: transparent; }
.dishline { display: flex; gap: 6px; flex-wrap: wrap; }
.dishline span { font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.hint { color: var(--hint); font-weight: 600; }
.invite-card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 18px; display: flex; gap: 14px; align-items: center; }
.invite-card .blob { width: 52px; height: 52px; border-radius: 16px; background: var(--tint-3); display: grid; place-items: center; flex: none; color: var(--hint); }

/* Chips and buttons */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--hint-soft); color: var(--hint); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chip.dim { background: var(--surface); color: var(--muted); box-shadow: var(--shadow); }
:root[data-theme="dark"] .chip:not(.ok):not(.warn):not(.bad):not(.dim) { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip:not(.ok):not(.warn):not(.bad):not(.dim) { color: var(--accent); } }
button { font: inherit; cursor: pointer; border-radius: 14px; border: 1px solid transparent; padding: 10px 16px; font-weight: 700; }
.btn { background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn:hover { background: var(--accent-2); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; box-shadow: none; }
.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.wide { width: 100%; padding: 15px; font-size: 16px; }
.linkbtn { background: none; border: none; padding: 0; color: var(--accent); font-weight: 700; }
.wa { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: #1F8F4E; color: #fff; font-weight: 700; padding: 14px; border-radius: 14px; }
.wa.quiet { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

/* Forms */
label { font-size: 13.5px; font-weight: 600; display: block; margin-bottom: 6px; color: var(--muted); }
select, input, textarea { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(12, 8, 6, .48); display: flex; align-items: flex-end; justify-content: center; z-index: 30; opacity: 0; visibility: hidden; transition: opacity .32s ease, visibility 0s linear .38s; overscroll-behavior: contain; touch-action: none; }
.sheet.searching { min-height: 88%; }
.sheet.searching .searchrow { position: sticky; top: -10px; z-index: 3; background: var(--surface); padding: 8px 0; margin: -8px 0; }
.sheet-bg.open { opacity: 1; visibility: visible; transition: opacity .32s ease, visibility 0s; }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 10px 20px 0; display: grid; gap: 16px; align-content: start; }
.sheet { transform: translateY(105%); transition: transform .32s cubic-bezier(.25,.8,.25,1); overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); }
.sheet-bg.open .sheet { transform: translateY(0); }
.sheet { overflow-x: hidden; } .sheet > * { min-width: 0; }
.sheet.dragging { transition: none; }
.sheet::before { content: ""; width: 44px; height: 5px; border-radius: 99px; background: var(--line); justify-self: center; margin-top: 2px; }
body.locked { position: fixed; left: 0; right: 0; overflow: hidden; }
.sheet > :last-child { margin-bottom: 20px; }
/* Sheets sit flush on the bottom edge: the surface carries on under the home bar (no gap, no band),
   and the pay bar spans the full width of the sheet instead of floating inside it */
.sheet { padding-bottom: 0; box-shadow: 0 400px 0 0 var(--surface); }
/* iPhone: the dimmed backdrop and the sheet's surface reach under the home bar too */
.sheet-bg { bottom: -120px; padding-bottom: 120px; }
.sheet a, .legal a, .pagetop ~ p a { color: var(--accent); font-weight: 600; }
.sheet > :last-child { margin-bottom: calc(20px + env(safe-area-inset-bottom)); }
.sheet-foot { position: sticky; bottom: 0; z-index: 2; background: var(--surface); margin: 4px -20px 0 !important; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); box-shadow: 0 -10px 24px -14px rgba(0,0,0,.35); display: flex; align-items: center; gap: 14px; }
form > .sheet-foot:last-child, .sheet > .sheet-foot:last-child { margin-bottom: 0 !important; }
.sheet-foot .tot { display: grid; line-height: 1.2; }
.sheet-foot .tot b { font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.sheet-foot .tot span { font-size: 12px; color: var(--muted); }
.sheet-foot .btn { flex: 0 0 auto; min-width: 44%; padding: 15px 20px; font-size: 16px; white-space: nowrap; }
.sheet-foot .tot { flex: 1 1 auto; min-width: 0; }
.sheet-foot .btn.wide { flex: 1 1 auto; }
.sheet-foot .tot span { display: block; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.closex { width: 36px; height: 36px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: var(--surface-2); border: none; color: var(--ink); flex: none; }
.group { display: grid; gap: 10px; }
.group-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.dishes { display: grid; gap: 10px; }
.dish { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; border-radius: 18px; padding: 10px; background: var(--surface-2); border: 2px solid transparent; cursor: pointer; margin: 0; color: var(--ink); font-size: 15px; font-weight: 600; }
.dish input { position: absolute; opacity: 0; pointer-events: none; }
.dish:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.dish:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.dish .tile { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; padding: 0; box-shadow: none; }
#siteList .tile svg { width: 22px; height: 22px; }
#siteHint:empty { display: none; }
.dish .tile svg { width: 40px; height: 40px; }
.dish .price { font-family: var(--font-display); font-weight: 700; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.tog { border-radius: 999px; padding: 8px 14px; background: var(--surface-2); border: 1.5px solid var(--line); color: var(--ink); font-weight: 600; font-size: 14px; }
.tog[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.qty { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.qty button { width: 38px; height: 38px; padding: 0; border-radius: 10px; background: var(--surface); border: none; box-shadow: var(--shadow); color: var(--ink); font-size: 20px; line-height: 1; }
.qty output { font-weight: 800; font-size: 17px; min-width: 30px; text-align: center; font-family: var(--font-display); }
.me-row { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-radius: 16px; padding: 12px 14px; }
.me-row .avatar { width: 36px; height: 36px; font-size: 15px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); border-radius: 16px; padding: 12px 14px; margin: 0; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
.switch input { appearance: none; width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; padding: 0; border: none; flex: none; cursor: pointer; transition: background .2s; }
.switch input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .2s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 21px; }
.sum { display: grid; gap: 6px; font-size: 14.5px; color: var(--muted); }
.sum div { display: flex; justify-content: space-between; gap: 10px; }
.sum div span:last-child { color: var(--ink); font-weight: 600; }
.pay { background: var(--surface-2); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.momo { display: flex; align-items: center; gap: 12px; }
.momo .logo { width: 42px; height: 42px; border-radius: 12px; background: #FFCC00; color: #1E1B24; display: grid; place-items: center; font-weight: 800; font-size: 12px; flex: none; }
.note { background: var(--hint-soft); color: var(--ink); border-radius: 16px; padding: 12px 14px; font-size: 14px; }
.err { color: var(--danger); font-size: 14px; min-height: 1em; }

/* Confirmation */
.success { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; justify-self: center; }
.codetiles { display: flex; gap: 8px; justify-content: center; align-items: center; }
.codetiles .cdash { font-style: normal; font: 800 30px var(--font-display); color: var(--muted); margin: 0 2px; }
.codetiles span { width: 54px; height: 64px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-2); font-family: var(--font-display); font-size: 34px; font-weight: 800; display: grid; place-items: center; }
:root[data-theme="dark"] .codetiles span { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .codetiles span { color: var(--accent); } }
.center { text-align: center; }

/* Orders tab */
.order-card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 14px; }
.order-card .head { display: flex; gap: 12px; align-items: center; }
.order-card .tile { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.order-card .tile svg { width: 34px; height: 34px; }
.order-card .c { margin-left: auto; text-align: right; flex: none; }
.order-card .c b { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: .08em; display: block; line-height: 1; white-space: nowrap; }
.order-card .c span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.track i { height: 6px; border-radius: 99px; background: var(--line); display: block; }
.track i.on { background: var(--accent); }
.status-text { font-size: 14.5px; }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* Wallet tab */
.balance { border-radius: 24px; padding: 22px; background: var(--ink); color: var(--bg); display: grid; gap: 6px; position: relative; overflow: hidden; }
.balance::after { content: ""; position: absolute; right: -30px; bottom: -60px; width: 160px; height: 160px; border-radius: 50%; background: var(--accent); opacity: .35; }
.balance b { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1.1; position: relative; z-index: 1; }
.balance span, .balance p { position: relative; z-index: 1; }
.ledger { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 6px 16px; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.ledger div:first-child { border-top: none; }

/* Tab bar */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; width: min(460px, calc(100% - 24px)); background: var(--surface); box-shadow: 0 10px 30px rgba(30,15,5,.18); border-radius: 22px; padding: 6px; display: grid; grid-template-columns: repeat(4, 1fr); z-index: 20; }
.kcard { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; display: grid; }
.kcard .head { display: flex; gap: 12px; align-items: center; }
.kcard .tile { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.kcard .tile svg { width: 46px; height: 46px; }
.tabbar button { background: none; border: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 8px 4px; font-size: 12px; font-weight: 700; border-radius: 16px; position: relative; }
.tabbar button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tabbar:has(.tabpill) button[aria-current="page"] { background: none; }
.tabpill { position: absolute; left: 0; top: 0; border-radius: 16px; background: var(--accent-soft); transition: transform .28s cubic-bezier(.25,.8,.25,1), width .28s cubic-bezier(.25,.8,.25,1); will-change: transform; pointer-events: none; }
.tabbar button { z-index: 1; }
.badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 12px; display: grid; place-items: center; padding: 0 5px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); width: min(480px, calc(100% - 24px)); background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px; font-size: 14.5px; z-index: 40; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.toast.show { display: block; }

/* Staff views (coordinator, kitchen, rider, host) */
.card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; }
.fee { text-align: right; flex: none; }
.fee b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--accent); line-height: 1.05; }
.fee span { font-size: 12.5px; color: var(--muted); }
.code { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: .12em; color: var(--accent); line-height: 1; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; }
.tile b { display: block; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12.5px; color: var(--muted); }
.flags { border-left: 4px solid var(--danger); background: var(--danger-soft); border-radius: 0 16px 16px 0; padding: 12px 14px; display: grid; gap: 4px; font-size: 14.5px; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps span { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.steps span.done { background: var(--ok-soft); color: var(--ok); }
.steps span.now { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.steps span.now.fin { background: var(--ok); color: #fff; }
.handline { display: flex; align-items: center; gap: 8px; font-weight: 650; }
.handline.fin { color: var(--ok); }
.inline { display: grid; grid-template-columns: 1.2fr 1fr .8fr auto; gap: 8px; align-items: end; }
.table-wrap { overflow-x: auto; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
td select { padding: 6px 8px; width: auto; }
.labels { display: grid; gap: 8px; }
.labels > div { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.labels .lc { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .06em; }
.tick { color: var(--ok); font-weight: 700; }
.codebox { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.codebox input { font-family: var(--font-display); font-size: 24px; letter-spacing: .2em; text-align: center; text-transform: uppercase; }
.labels .lc { min-width: 3.4em; }
.labels .items { display: grid; gap: 2px; }
.quote { display: grid; grid-template-columns: 1fr; gap: 10px; background: var(--hint-soft); border-radius: 16px; padding: 14px; }
.quote .qbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quote .qbtns > * { width: 100%; justify-content: center; }
.menurow { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; align-items: center; }
.choice { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
.choice input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid2 > * { min-width: 0; }
.map { height: 240px; border-radius: 18px; overflow: hidden; position: relative; z-index: 0; background: var(--surface-2); }
.mpin { display: block; width: 24px; height: 24px; border-radius: 50% 50% 50% 0; background: var(--muted); transform: rotate(-45deg); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.mpin.on { background: var(--accent); }
.mpin.me { background: #2563EB; border-radius: 50%; transform: none; }
.leaflet-container { font-family: var(--font-body); }
.leaflet-popup-content { font-size: 14px; }
.admintabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }

   So every page is at least a touch taller than the screen. */
html.standalone body { min-height: calc(100vh + 1px); min-height: calc(100lvh + 1px); }
html.standalone, html.standalone body { overscroll-behavior: none; }
/* Launch animation: the orange tile is there from the first frame, the packs drop and slide in one by one, then the name
   and tagline rise. Soft ease-out, no bounce, transforms on the GPU only */
.splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; transition: opacity .35s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
.splash.out { opacity: 0; pointer-events: none; }
.sp-in { display: grid; justify-items: center; gap: 12px; padding: 24px; text-align: center; }
.sp-logo { position: relative; width: 96px; height: 96px; border-radius: 23px; background: #D9480F; transform: translateZ(0); }
.splash { --sp-ease: cubic-bezier(.22,1,.36,1); }
.sp-p { position: absolute; width: 56%; height: 15%; border-radius: 4px; backface-visibility: hidden; will-change: transform, opacity; }
.sp-p1 { animation: spDrop .62s var(--sp-ease) .05s both; }
.sp-p3 { animation: spDrop .62s var(--sp-ease) .2s both; }
.sp-p2 { animation: spSlide .66s var(--sp-ease) .38s both; }
.sp-p::before { content: ""; position: absolute; left: 0; right: 0; top: 46%; height: 2.4px; background: #D9480F; }
.sp-p::after { content: ""; position: absolute; left: 43%; top: 33%; width: 14%; height: 33%; border-radius: 1.5px; background: #D9480F; }
.splash.wait * { animation-play-state: paused !important; }
.sp-word, .sp-tag span { will-change: transform, opacity; }
.sp-word { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: -1.5px; color: var(--ink); animation: spUp .7s var(--sp-ease) .78s both; }
.sp-word span { color: var(--accent); }
.sp-tag { margin: 0; font-weight: 700; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.sp-tag span { display: inline-block; animation: spUp .6s var(--sp-ease) both; }
.sp-tag span:nth-child(1) { animation-delay: 1s; color: var(--accent-2); } .sp-tag span:nth-child(2) { animation-delay: 1.32s; } .sp-tag span:nth-child(3) { animation-delay: 1.24s; }
@keyframes spDrop { from { transform: translate3d(0,-30px,0); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spSlide { from { transform: translate3d(46px,0,0); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spUp { from { transform: translate3d(0,14px,0); opacity: 0; } to { transform: none; opacity: 1; } }
.splash.still * { animation: none !important; }
/* Still loading after the intro: hold the final frame and breathe slowly (never replay the logo) */
.splash.hold .sp-logo { animation: spBreathe 3.2s ease-in-out infinite; }
@keyframes spBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(.97); } }
.splash.hold .sp-tag { animation: spFade 3.2s ease-in-out infinite; }
@keyframes spFade { 50% { opacity: .55; } }
/* Premium motion: installed app only. One soft curve, short and small, never bouncy */
/* Tab changes: a short, quiet fade with a small nudge in the direction you're heading */
.is-app .pane-in { animation: paneIn .22s cubic-bezier(.25,.8,.25,1) both; }
.is-app .pane-in.from-left { --dx: -10px; }
@keyframes paneIn { from { opacity: 0; transform: translate3d(var(--dx, 10px), 0, 0); } to { opacity: 1; transform: none; } }

@keyframes tabPop { 50% { transform: scale(1.12); } }
.is-app .rv { opacity: 0; transform: translate3d(0, 8px, 0); transition: opacity .3s ease-out, transform .35s cubic-bezier(.25,.8,.25,1); }
.is-app .rv.in { opacity: 1; transform: none; }
.is-app button, .is-app .btn, .is-app .ghost { transition: transform .12s cubic-bezier(.2,.8,.2,1); }
.is-app button:active, .is-app .btn:active { transform: scale(.96); }
@keyframes sheetUp { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
.is-app .fade-in { animation: fadeIn .15s ease-out both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .is-app *, .splash * { animation: none !important; } .is-app .rv { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>

const hasPin = x => x && x.lat != null && x.lng != null;

const tripMax = s => Number(s.trip_max ?? 80);

  if (!hasPin(k) || !hasPin(site) || s.per_km == null || s.base_fare == null) return Math.min(Number(s.trip_cost), tripMax(s));

    async updateTeam(email, role) { team.find(t => t.email === email).role = role; }

      const pop = {}, scores = {}, siteCounts = {}; (popRows || []).forEach(r => { pop[r.item_id] = r.n; }); (scoreRows || []).forEach(r => { scores[r.kitchen_id] = r; }); (scRows || []).forEach(r => { (siteCounts[r.site_id] = siteCounts[r.site_id] || {})[r.kitchen_id] = r.n; });

// Each use gets its own gradient ids, so icons never break when another copy is hidden
let artN = 0;
function art(kind) {
  const src = (DISH_ART[kind] || DISH_ART.bowl)[1], n = ++artN;
  return src.replace(/id="([^"]+)"/g, (m, id) => `id="${id}_${n}"`).replace(/url\(#([^)]+)\)/g, (m, id) => `url(#${id}_${n})`).replace("<svg ", '<svg aria-hidden="true" ');
}
const tint = i => `var(--tint-${(i % 4) + 1})`;
const menuIndex = id => Math.max(0, S.menus.findIndex(m => m.id === id));
const greeting = () => { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; };
const ghanaNow = () => new Date().toISOString().slice(11, 16);
const addDays = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);
const dayLabel = iso => { const t = today(), d = new Date(Date.now() + 864e5).toISOString().slice(0, 10); return iso === t ? "today" : iso === d ? "tomorrow" : fmtDate(iso); };
const firstName = () => String((S.user && S.user.name) || (local.get("cp_me") || {}).name || "").trim().split(/\s+/)[0] || "";
const sheetHead = (title, sub) => `<div class="top" style="align-items:flex-start"><div><h2 id="sheetTitle">${title}</h2>${sub ? `<p class="small muted">${sub}</p>` : ""}</div><button class="closex" data-close aria-label="Close">${ICON.close}</button></div>`;

/* =====================================================================================

   ===================================================================================== */
async function refreshUser() {
  try { S.user = await api.user(); } catch (e) { S.user = null; }
  S.balance = 0;
  S.walletEntries = null;

  const open = ps.find(p => p.status === "waiting" || p.meals < S.settings.max_meals);

let leafletP;
function loadLeaflet() {
  if (window.L) return Promise.resolve(window.L);
  if (!leafletP) leafletP = new Promise((res, rej) => {
    // Served from this site (cached for offline); the public CDN is the fallback
    const add = (base, fallback) => {
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = base + "leaflet" + (fallback ? ".min" : "") + ".css"; document.head.appendChild(css);
      const s = document.createElement("script"); s.src = base + "leaflet" + (fallback ? ".min" : "") + ".js";
      s.onload = () => res(window.L); s.onerror = () => { if (!fallback) return add("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/", true); leafletP = null; rej(new Error("The map couldn't load. Check your connection and try again.")); };
      document.head.appendChild(s);
    };
    add("vendor/leaflet/", false);
  });

  const L = payMethods(), ed = editId === "new" ? { id: "pm" + Date.now(), number: "", network: "MTN", nick: "" } : L.find(m => m.id === editId);
  openSheet(`${sheetHead("Payment methods", "Your default is picked at checkout. You can choose another there.")}
    ${S.user ? `<div class="pmrow static"><span class="logo net gen">${ICON.wallet || ICON.phone}</span><span><b>ChopPool wallet</b> <span class="num muted">${money(S.balance || 0)}</span><small class="muted" style="display:block">Always used first</small></span></div>` : ""}
    <div class="stack" style="gap:8px" id="pmList">${L.map(m => `<div class="pmrow">${netBadge(m.network)}<span><b>${esc(m.nick || m.network)}</b> <span class="num muted">${esc(maskNum(m.number))}</span>${m.def ? ` <span class="chip ok">Default</span>` : ""}</span>
      <span class="pmact">${m.def ? "" : `<button type="button" class="linkbtn small" data-pmdef="${esc(m.id)}">Make default</button>`}<button type="button" class="linkbtn small" data-pmedit="${esc(m.id)}">Edit</button></span></div>`).join("") || `<p class="small muted">No numbers saved yet.</p>`}</div>
    ${ed ? `<form id="pmForm" class="stack card" novalidate style="box-shadow:none;background:var(--surface-2)"><div class="grid2"><div><label for="pmN">Mobile money number</label><input id="pmN" inputmode="tel" value="${esc(fmtPhone(ed.number))}" placeholder="024 123 4567"></div>
        <div><label for="pmNet">Network</label><select id="pmNet">${NETWORKS.map(n => `<option${ed.network === n ? " selected" : ""}>${n}</option>`).join("")}</select></div></div>
        <div><label for="pmNick">Nickname <span class="muted" style="font-weight:500">(optional)</span></label><input id="pmNick" maxlength="20" value="${esc(ed.nick || "")}" placeholder="Work, Personal"></div>
        <p class="err" id="pmErr"></p><div class="row" style="gap:8px;justify-content:flex-start"><button class="btn">Save</button>${editId !== "new" ? `<button type="button" class="ghost" data-pmdel="${esc(ed.id)}">Remove</button>` : ""}<button type="button" class="ghost" data-pmcancel>Cancel</button></div></form>`
      : L.length < 3 ? `<button type="button" class="ghost wide" data-pmedit="new">+ Add a mobile money number</button>` : `<p class="small muted">You can save up to 3 numbers.</p>`}
    <p class="small muted">Refunds go back to the number an order was paid from. Card payments will appear here when we add them.</p>`);

    if (b.dataset.pmdel) { const n = L.findIndex(m => m.id === b.dataset.pmdel); if (n >= 0) L.splice(n, 1); savePayMethods(L); renderWallet(); toast("Removed"); return openPayments(); }
    if (b.hasAttribute("data-pmcancel")) return openPayments();
  };

    if (!/^0\d{9}$/.test(num)) return ($("#pmErr").textContent = "Enter a 10-digit mobile money number starting with 0, like 024 123 4567.");
    if (L.some(m => m.number === num && m.id !== ed.id)) return ($("#pmErr").textContent = "That number is already saved.");

const DOW = [[1, "Mon"], [2, "Tue"], [3, "Wed"], [4, "Thu"], [5, "Fri"], [6, "Sat"], [7, "Sun"]];

function codeBox(id) {

function wireCodes(token, d, redraw) {
  $("#view").addEventListener("submit", async e => {
    const f = e.target.closest("[data-codeform]"); if (!f) return;
    e.preventDefault();
    const input = f.querySelector("input"), code = normCode(input.value);
    if (!/^[A-Z]-\d{2,3}$|^\d{4}$/.test(code)) return toast("Enter the customer's code, like K-27.");
    const pool = (input.id.match(/^r?c-(.+)$/) || [])[1] || null;
    const day = typeof d === "function" ? d() : d;
    const done = r => { toast("Check the name: " + r.name + ". Give them " + (r.items || r.qty + " × " + r.item_name) + "."); input.value = ""; redraw(); };
    try { done(await api.collectCode(token, code, day, pool)); }
    catch (err) {
      const m = String(err && err.message || "").match(/UNPAID:([^:]*):([\d.]+)/);
      if (!m) return toast(cleanErr(err));
      // Not paid yet: hand over only after collecting the money in cash, or keep the meal
      openSheet(`${sheetHead("Not paid yet", "Code " + esc(code) + " · " + esc(m[1]))}<p>ChopPool hasn't received this payment. Collect <b class="num">${money(Number(m[2]))}</b> in cash before you hand it over, or hold the meal.</p>
        <button class="btn wide" id="ucCash">I collected ${money(Number(m[2]))} in cash</button><button class="ghost wide" data-close>Hold the meal</button>`);
      $("#ucCash").addEventListener("click", async () => { try { done(await api.collectCode(token, code, day, pool, "cash")); closeSheet(); } catch (e2) { toast(cleanErr(e2)); } });
    }
  });
}
// Orders grouped by code (a code can hold added plates), sorted A→Z
const byCode = os => { const m = new Map(); os.forEach(o => { if (!m.has(o.code)) m.set(o.code, []); m.get(o.code).push(o); }); return [...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1); };
const handList = os => `<div class="labels">${byCode(os).map(([c, g]) => `<div><span class="lc num">${esc(c)}</span><span>${esc(g[0].name)} · ${groupDishes(g).map(x => x.qty + " × " + esc(x.name)).join(" + ")}</span>${g.every(o => o.collected) ? `<span class="tick">Collected</span>` : `<span class="muted small">Waiting</span>`}</div>`).join("")}</div>`;
async function viewRider(token) {

      (R.pools.length && R.pools.every(p => p.status === "delivered") ? `<section class="card nextup"><p>${R.pools.every(p => p.handoff === "host" || handedOver(p.orders)) ? "All deliveries done for today. Thank you." : "Delivered. Hand over the meals still waiting below."}</p></section>` : "") +
      (R.pools.map((p, i) => {

        return `<article class="card"><div class="top"><h2>${esc(p.kitchen)} → ${esc(p.site)}</h2><span class="chip">${p.meals} meals</span></div>${stepsHtml(p.status, p.orders)}${handInfo(p.status, p.orders)}
          <p class="small"><strong>Pick up:</strong> ${esc(p.kitchen)}${p.kitchen_address ? ", " + esc(p.kitchen_address) : ""}${p.kitchen_phone ? ` · <a href="tel:${esc(p.kitchen_phone)}">${esc(fmtPhone(p.kitchen_phone))}</a>` : ""}</p>

  });
  wireCodes(token, d, draw);
  await draw(); every(() => { if (!document.activeElement?.matches("[data-codeform] input")) draw(); }, 30000);
}

/* ---------- Installable app and push alerts ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
const isStandalone = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; } };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const pushReady = () => !DEMO && !!CONFIG.VAPID_PUBLIC_KEY && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
// Install: Android shows the system prompt; iPhone gets the Share › Add to Home Screen steps. The icon then opens this page.
async function installApp(home) {
  if (home) local.set("cp_home", home);
  if (isStandalone()) return toast("ChopPool is already installed on this phone.");
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; return; }
  openSheet(`${sheetHead("Install ChopPool", isIOS() ? "On iPhone, it takes three taps:" : "Add ChopPool to your home screen:")}
    ${isIOS() ? `<ol class="stack small" style="padding-left:20px;margin:0"><li>Open this page in <strong>Safari</strong>.</li><li>Tap the <strong>Share</strong> button (the square with an arrow).</li><li>Scroll down and tap <strong>Add to Home Screen</strong>, then <strong>Add</strong>.</li></ol><p class="small muted">Alerts on iPhone work once ChopPool is on your home screen (iOS 16.4 or later).</p>`
      : `<ol class="stack small" style="padding-left:20px;margin:0"><li>Open your browser menu (⋮).</li><li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li></ol>`}
    <button class="ghost wide" data-close>Done</button>`);
}
const b64u8 = s => { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); };
// Switch on push alerts for this phone. extra says what to hear about: order ids, a seller link or a rider link.
async function pushSubscribe(extra, quiet) {
  if (!pushReady()) { if (!quiet && isIOS() && !isStandalone()) installApp(); return false; }
  try {
    if (Notification.permission !== "granted") { if (quiet) return false; if (await Notification.requestPermission() !== "granted") { toast("Alerts are blocked. Allow notifications for this site in your phone settings."); return false; } }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u8(CONFIG.VAPID_PUBLIC_KEY) });
    const j = sub.toJSON(); await api.savePushSub({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, ...(extra && (extra.kitchen_token || extra.rider_token) ? {} : { mute: local.get("cp_mute") || [] }), ...extra });
    local.set("cp_push", true); return true;
  } catch (e) { if (!quiet) toast("Couldn't switch on alerts: " + cleanErr(e)); return false; }
}
const notifyServer = body => { if (!pushReady()) return; try { api.notify(body).catch(() => {}); } catch (e) {} };
// Install and alerts card for sellers, riders and the team
function appTools(home, extra, who) {
  const installed = isStandalone();
  return `<section class="card apptools"><div class="toolhead">${LOGO(32)}<div><strong>ChopPool ${esc(who)} app</strong><p class="small muted">${installed ? "Installed on this phone." : "Open your page from your home screen, like an app."}${pushReady() ? " Get alerts even when it's closed." : ""}</p></div></div>
    <div class="toolbtns">${installed ? "" : `<button class="btn" data-install="${esc(home)}">Install app</button>`}${pushReady() ? `<button class="ghost" data-alerts='${esc(JSON.stringify(extra))}'>${local.get("cp_push") ? "Alerts are on" : "Turn on alerts"}</button>` : ""}</div></section>`;
}

/* ---------- Ratings from real orders (no typed reviews) ---------- */
function scoreLine(k) {
  const sc = (S.scores || {})[k.id];
  if (!sc || (sc.orders || 0) < 20) return `<span class="chip">New on ChopPool</span>`;
  const parts = [sc.on_time != null ? sc.on_time + "% on time" : "", sc.orders + " orders", sc.come_back != null ? sc.come_back + "% come back" : ""].filter(Boolean);
  return `<span class="small score">${sc.ratings >= 3 ? `<span class="rstar">${STAR(true, 13)} ${Number(sc.rating).toFixed(1)}</span> · ` : ""}${esc(parts.join(" · "))}</span>`;
}
const rank = k => { const sc = (S.scores || {})[k.id] || {}; return (sc.orders >= 20 ? 1 : 0) * 1000 + (sc.come_back || 0) * 3 + (sc.on_time || 0) * 2 + (sc.reliable || 0) + Math.min(sc.orders || 0, 200) / 10; };

/* ---------- Launch animation and app motion ---------- */
function splash() {
  // Installed app: every time it opens. Website: the first visit only, so shared links open fast.
  // A reload (an update arriving, pull-to-refresh) never replays it; if the intro was still showing when the update reloaded
  // the page, the finished frame stays up (no animation) until the app is ready.
  const app = isStandalone(), key = "cp_splash_v";
  let cont = false, reload = false;
  try { cont = localStorage.getItem("cp_sp_cont") === "1"; localStorage.removeItem("cp_sp_cont"); } catch (e) {}
  try { const nav = performance.getEntriesByType("navigation")[0]; reload = !!nav && (nav.type === "reload" || nav.type === "back_forward"); } catch (e) {}
  if (!cont && reload) return;
  if (!app && !cont) { try { if (localStorage.getItem(key)) return; localStorage.setItem(key, "1"); } catch (e) {} }
  const still = cont || matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pk = (cls, x, y, c) => `<i class="sp-p ${cls}" style="left:${x}%;top:${y}%;background:${c}"></i>`;
  const el = document.createElement("div"); el.className = "splash wait" + (still ? " still" : ""); el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<div class="sp-in"><div class="sp-logo">${pk("sp-p1", 20, 61, "#FFF7EE")}${pk("sp-p3", 21, 27, "#FFF7EE")}${pk("sp-p2", 25, 44, "#F5B04A")}</div>
    <div class="sp-word">chop<span>pool</span></div><p class="sp-tag"><span>Order together,</span><span>pay less.</span></p></div>`;
  document.body.appendChild(el); S.splashing = true;
  // Start the animation once the heading font is ready and the first screen has been built behind it (at most 1.2 s),
  // so no heavy work runs while the packs are moving. If the app's data is slow, the first screen waits until they've landed.
  let fontOk = false, paintOk = false, began = 0;
  const go = () => { if (!el.classList.contains("wait")) return; el.classList.remove("wait"); began = Date.now(); startMin(); };
  const maybe = () => { if (fontOk && paintOk) go(); };
  try { document.fonts.load('800 40px "Bricolage Grotesque"').then(() => { fontOk = true; maybe(); }, () => { fontOk = true; maybe(); }); } catch (e) { fontOk = true; }
  setTimeout(() => { fontOk = true; maybe(); }, 450);
  setTimeout(go, 1200);
  S.splashPainted = () => { paintOk = true; maybe(); };
  S.splashCalm = () => { if (!began || gone || still) return Promise.resolve(); const left = 1100 - (Date.now() - began); return left > 0 ? new Promise(r => setTimeout(r, left)) : Promise.resolve(); };
  let gone = false, minDone = false; const done = () => { if (gone) return; gone = true; el.classList.add("out"); setTimeout(() => { el.remove(); S.splashing = false; revealScan(); }, 380); };
  const tryDone = () => { if (minDone && S.appReady) done(); };
  el.addEventListener("click", () => { if (S.appReady) done(); });
  function startMin() { setTimeout(() => { minDone = true; tryDone(); if (!gone && !matchMedia("(prefers-reduced-motion: reduce)").matches) el.classList.add("hold"); }, still ? 500 : 2100); }
  S.onReady = tryDone;
  setTimeout(done, 15000);   // never stay stuck
}
// Cards fade up the first time they come into view (installed app only); things already seen never re-animate
const seenCards = new Set();
let revealObs = null;
function revealScan() {
  if (!document.body.classList.contains("is-app") || !("IntersectionObserver" in window) || S.splashing) return;
  revealObs = revealObs || new IntersectionObserver(es => { let n = 0; es.forEach(e => { if (!e.isIntersecting) return; const t = e.target; t.style.transitionDelay = Math.min(n++, 4) * 40 + "ms"; t.classList.add("in"); revealObs.unobserve(t); }); }, { rootMargin: "0px 0px -6% 0px" });
  document.querySelectorAll("#view article, #view .dtile, #view details.item, #view .kcard, #view .order-card, #view section.card").forEach(el => {
    if (el.dataset.rv) return; el.dataset.rv = "1";
    const sig = el.className + "|" + (el.dataset.key || el.dataset.kitchen || el.dataset.pool || el.dataset.site || (el.textContent || "").trim().slice(0, 48));
    if (seenCards.has(sig)) return; seenCards.add(sig);
    el.classList.add("rv"); revealObs.observe(el);
  });
}
// Fixed top area: glass edge once scrolled; on Home the dashboard shrinks to one slim row (with hysteresis)
let topTick = false;
window.addEventListener("scroll", () => {
  if (topTick || document.body.classList.contains("locked")) return; topTick = true;
  requestAnimationFrame(() => {
    topTick = false; const y = window.scrollY;
    document.querySelectorAll(".topzone").forEach(z => z.classList.toggle("scrolled", y > 4));

  });
}, { passive: true });
function initMotion() {
  // Premium motion in the browser too (it was installed-app only); people who ask for reduced motion get the calm version
  if (/[?&]motion=0/.test(location.search)) return;
  document.body.classList.add("is-app");
  let t; new MutationObserver(() => { clearTimeout(t); t = setTimeout(revealScan, 30); }).observe(document.getElementById("app"), { childList: true, subtree: true });
}
async function route() {
  clearTimers(); closeSheet();
  if ($("#demoBar")) $("#demoBar").open = false;
  const old = $("#view"), fresh = old.cloneNode(false); old.replaceWith(fresh);   // drops old listeners
  const h = location.hash.slice(1);
  if (h.startsWith("join=")) {
    // A shared pool link: switch to that building and open the kitchen's menu
    const [siteId, kid] = h.slice(5).split(",");
    if (S.sites.some(x => x.id === siteId)) { S.siteId = siteId; S.noSite = false; local.set("cp_site", siteId); }
    S.pendingJoin = kid; S.tab = "home";
    history.replaceState(null, "", "#order");
  }
  document.body.classList.remove("is-admin");
  // The browser tab says which page this is
  document.title = h === "rider-signup" ? "Rider sign-up · ChopPool" : h.startsWith("kitchen-") ? "Vendor · ChopPool" : h.startsWith("rider-") ? "Rider · ChopPool"
    : h.startsWith("host-") ? "Drop point · ChopPool" : h === "admin" ? "Admin · ChopPool" : "ChopPool · " + TAGLINE;
  if (h === "rider-signup") return viewRiderSignup();
  if (h === "privacy" || h === "terms") return viewLegal(h);
  const view = h.startsWith("kitchen-") ? "kitchen" : h.startsWith("rider-") ? "rider" : h.startsWith("host-") ? "host" : h === "admin" ? "admin" : "order";
  document.querySelectorAll("#demoBar a").forEach(a => { if (a.getAttribute("href") === "#" + h || (view === "order" && a.dataset.view === "order")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (S.appReady && ["kitchen", "rider", "host"].includes(view)) introFor(h);
  if (view === "kitchen") return viewKitchen(h.slice(8));
  if (view === "rider") return viewRider(h.slice(6));
  if (view === "host") return viewHost(h.slice(5));
  // Team screens and the customer app use different sign-ins; switching between them reloads who is signed in
  if (api.useTeam && api.useTeam(view === "admin")) { S.user = null; S.role = null; S.admin = null; try { await refreshUser(); } catch (e) {} }
  if (view === "admin") return viewAdmin();
  return viewOrder();
}
/* Phone numbers: "Choose from contacts" where the phone allows it (Android Chrome). iPhone Safari doesn't let websites read contacts. */
const canPickContacts = () => "contacts" in navigator && "ContactsManager" in window && typeof navigator.contacts.select === "function";
const ghNumber = t => { let d = String(t || "").replace(/[^\d+]/g, ""); if (d.startsWith("+233")) d = "0" + d.slice(4); else if (d.startsWith("233") && d.length === 12) d = "0" + d.slice(3); d = d.replace(/\D/g, "");
  return /^0\d{9}$/.test(d) ? d.slice(0, 3) + " " + d.slice(3, 6) + " " + d.slice(6) : d; };
function enhanceContacts() {
  if (!canPickContacts()) return;
  document.querySelectorAll('input[inputmode="tel"]:not([data-cpk])').forEach(inp => {
    inp.dataset.cpk = "1";
    const b = document.createElement("button"); b.type = "button"; b.className = "linkbtn small contactpick"; b.innerHTML = ICON.user.replace(/width="\d+" height="\d+"/, 'width="14" height="14"') + " Choose from contacts";
    b.addEventListener("click", async () => { try { const [c] = await navigator.contacts.select(["tel"], { multiple: false }); const tel = c && c.tel && c.tel[0]; if (tel) { inp.value = ghNumber(tel); inp.dispatchEvent(new Event("input", { bubbles: true })); inp.dispatchEvent(new Event("change", { bubbles: true })); } } catch (e) {} });
    inp.insertAdjacentElement("afterend", b);
  });
}
// Installed on iPhone, the first time the keyboard opens the app's screen area shrinks by about the status bar's height
// and doesn't grow back (an iOS bug): the tab bar floats and a black band appears at the bottom.
// When the keyboard closes, briefly re-lay out the page so iOS measures the full screen again.
function healViewport() {
  if (!(isStandalone() && isIOS())) return;
  let t = null;
  const heal = () => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (document.activeElement && document.activeElement.matches("input, textarea, select")) return;   // keyboard still up
      const y = window.scrollY, b = document.body, sheetOpen = b.classList.contains("locked");
      b.style.display = "none"; void b.offsetHeight; b.style.display = "";
      if (!sheetOpen) window.scrollTo(0, y);
    }, 350);
  };
  document.addEventListener("focusout", e => { if (e.target.matches && e.target.matches("input, textarea, select")) heal(); });
  if (window.visualViewport) { let last = visualViewport.height; visualViewport.addEventListener("resize", () => { if (visualViewport.height > last + 80) heal(); last = visualViewport.height; }); }
  window.addEventListener("pageshow", heal); document.addEventListener("visibilitychange", () => { if (!document.hidden) heal(); });
}
async function start() {
  splash();   // first frame: the animation covers the connection time (no "Loading" text anywhere)
  if (DEMO) $("#demoBar").classList.remove("hidden");
  if (!DEMO) {
    for (let i = 0; i < 80 && !window.supabase; i++) await new Promise(r => setTimeout(r, 100));
    if (!window.supabase) { $("#view").innerHTML = `<p class="card err">ChopPool couldn't connect. Check your internet connection and refresh.</p>`; S.appReady = true; S.onReady && S.onReady(); return; }
    api = makeSupabaseApi();
    const qp = new URLSearchParams(location.search), rs = qp.get("reset");
    if (rs || /type=recovery/.test(location.hash)) {
      S.resetTo = rs === "admin" ? "admin" : "app";
      try { await api.user(); } catch (e) {}   // lets Supabase read the link first
      history.replaceState(null, "", location.pathname + (S.resetTo === "admin" ? "#admin" : "#order"));
    }
  }
  // Ask the browser to keep this app's data (sign-in, orders on this phone) instead of clearing it when space is short
  try { navigator.storage && navigator.storage.persist && navigator.storage.persisted().then(p => p || navigator.storage.persist()); } catch (e) {}
  // Instant start: last-seen menus and board from this phone, refreshed quietly in the background
  const boot = !DEMO && local.get("cp_boot");
  if (boot && boot.v === 2 && boot.load && boot.load.settings) {
    Object.assign(S, boot.load); if (boot.board && boot.date === orderDate(boot.load.settings)) S.board = boot.board;
    api.load().then(fresh => { Object.assign(S, fresh); saveBoot(); if ($("#tabHome")) { renderWhen(); renderPools(); if (S.tab === "kitchens") renderKitchens(); } }).catch(() => {});
  } else {
    try { Object.assign(S, await api.load()); saveBoot(); }
    catch (e) { $("#view").innerHTML = `<p class="err">We couldn't load the menu: ${esc(cleanErr(e))}. Refresh to try again.</p>`; S.appReady = true; S.onReady && S.onReady(); return; }
  }
  S.date = orderDate(S.settings);
  const saved = local.get("cp_site");
  // No building chosen yet: the app opens on Home with a welcome card (no forced location sheet)
  S.siteId = S.sites.some(x => x.id === saved) ? saved : null; S.noSite = !S.siteId;
  if (S.siteId && !(local.get("cp_recent_sites") || []).length) local.set("cp_recent_sites", [S.siteId]);
  $("#sheetBg").addEventListener("click", e => { if (e.target === $("#sheetBg")) closeSheet(); });
  initSheetDrag();
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  document.addEventListener("click", e => { const c = e.target.closest("[data-copy]"); if (c) return copy(c.dataset.copy, "Link copied"); const b = e.target.closest("[data-copynum]"); if (b) copy(b.dataset.copynum.replace(/\s/g, ""), "Mobile money number copied"); });
  window.addEventListener("hashchange", route);
  // Background refresh pauses while the app is hidden; catch up at once when it's opened again
  document.addEventListener("visibilitychange", () => { if (document.hidden || !$("#tabHome")) return; refreshBoard(); refreshMine(); tickCountdown(); });
  if (isStandalone()) document.documentElement.classList.add("standalone");
  healViewport();
  initMotion();
  if (canPickContacts()) new MutationObserver(() => enhanceContacts()).observe(document.body, { childList: true, subtree: true });
  // New version published: the app picks it up and reloads once, so phones never stay on an old copy
  if (!DEMO && "serviceWorker" in navigator && location.protocol === "https:") {
    const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadSW && !reloaded && !document.body.classList.contains("locked")) { reloaded = true; try { if (S.splashing) localStorage.setItem("cp_sp_cont", "1"); } catch (e) {} location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => { r.update().catch(() => {}); document.addEventListener("visibilitychange", () => { if (!document.hidden) r.update().catch(() => {}); }); }).catch(() => {});
  }
  // Opened from the home-screen icon: go to the page this phone installed (seller, rider or team), else the customer app
  if (/[?&]app=1/.test(location.search) && (!location.hash || location.hash === "#") && local.get("cp_home")) history.replaceState(null, "", location.pathname + location.search + local.get("cp_home"));
  document.addEventListener("click", async e => {
    const ins = e.target.closest("[data-install]"); if (ins) return installApp(ins.dataset.install);
    const lg = e.target.closest("[data-legal]"); if (lg) { e.preventDefault(); return openLegal(lg.dataset.legal); }
    if (e.target.closest("[data-theme-cycle]")) return cycleTheme();
    const al = e.target.closest("[data-alerts]"); if (al) { if (await pushSubscribe(JSON.parse(al.dataset.alerts || "{}"))) { toast("Alerts are on for this phone."); al.textContent = "Alerts are on"; } }
  });
  if (!DEMO) { try { window.supabase && (await api.user()) && afterSignIn(); } catch (e) {} }
  if (S.splashCalm) await S.splashCalm();
  await route();
  S.splashPainted && S.splashPainted();
  S.appReady = true; if (S.onReady) S.onReady();
  showRecovery();
  maybeIntro();
}
start();
