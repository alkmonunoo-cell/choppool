<style>
:root {
  /* Layout: phone-width app shell. App bar on top, scrolling content, tab bar fixed at the bottom.
     Light and dark both use the Jollof palette: tomato-orange accent, saffron hints, warm neutrals. Cards float on soft shadows, not borders. */
  --bg: #F8F4EF;
  --surface: #FFFFFF;
  --surface-2: #FBF8F4;
  --ink: #23160F;
  --muted: #7C685C;
  --line: #EEE3D8;
  --accent: #D9480F;
  --accent-2: #B83A08;
  --on-accent: #FFFFFF;
  --accent-soft: #FDEADF;
  --hint: #A3620B;
  --hint-soft: #FCF1DC;
  --ok: #2B7A4B;
  --ok-soft: #E2F3E8;
  --danger: #B42318;
  --danger-soft: #FDE8E6;
  --tint-1: #FDE6D8; --tint-2: #E3F1E6; --tint-3: #FCEFD2; --tint-4: #E8E6F7;
  --shadow: 0 1px 2px rgba(60, 30, 10, .06), 0 8px 24px rgba(60, 30, 10, .07);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0E10; --surface: #17171A; --surface-2: #202024; --ink: #F4F4F5; --muted: #A1A1AA; --line: #2C2C31;
    --accent: #F2652A; --accent-2: #FF7A45; --on-accent: #FFFFFF; --accent-soft: #2E1A12; --hint: #F5B04A; --hint-soft: #2B2314;
    --ok: #62D394; --ok-soft: #15291E; --danger: #FF8A80; --danger-soft: #34191A;
    --tint-1: #24201E; --tint-2: #1C2420; --tint-3: #26231C; --tint-4: #22201F;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0E10; --surface: #17171A; --surface-2: #202024; --ink: #F4F4F5; --muted: #A1A1AA; --line: #2C2C31;
  --accent: #F2652A; --accent-2: #FF7A45; --on-accent: #FFFFFF; --accent-soft: #2E1A12; --hint: #F5B04A; --hint-soft: #2B2314;
  --ok: #62D394; --ok-soft: #15291E; --danger: #FF8A80; --danger-soft: #34191A;
  --tint-1: #24201E; --tint-2: #1C2420; --tint-3: #26231C; --tint-4: #22201F;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: grid; gap: 18px; align-content: start; }
.stack { display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 28px; font-weight: 800; line-height: 1.1; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--accent); letter-spacing: -0.02em; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }

/* Demo switcher: small and out of the way */
.demo { font-size: 13px; }
.demo summary { list-style: none; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--hint); font-weight: 700; background: var(--hint-soft); border-radius: 999px; padding: 5px 12px; }
.demo summary::-webkit-details-marker { display: none; }
.demo[open] summary { margin-bottom: 8px; }
.demo p { color: var(--muted); margin-bottom: 8px; }
.demo nav { display: flex; gap: 6px; flex-wrap: wrap; }
.demo a { color: var(--ink); font-weight: 600; text-decoration: none; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 12px; }
.demo a[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* App bar */
.appbar { display: flex; align-items: center; gap: 10px; }
.place { display: grid; gap: 0; background: none; border: none; padding: 0; text-align: left; color: var(--ink); min-width: 0; flex: 1; cursor: pointer; }
.place .eyebrow { display: flex; gap: 4px; align-items: center; }
.place strong { font-family: var(--font-display); font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 2px; min-width: 0; }
.place strong #placeName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.place strong svg { flex: none; }
.iconbtn { background: var(--surface); border: none; box-shadow: var(--shadow); color: var(--ink); width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; padding: 0; flex: none; position: relative; }
.iconbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-weight: 800; font-size: 17px; border: none; padding: 0; display: grid; place-items: center; flex: none; }
.avatar.guest { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Hero */
.hero { position: relative; overflow: hidden; border-radius: 28px; padding: 20px; background: radial-gradient(130% 120% at 85% 0%, #F7853C 0%, #E2561A 40%, #B93A0C 100%); color: #fff; display: grid; gap: 14px; box-shadow: 0 16px 36px rgba(185,58,12,.32); }
.hero::after { content: ""; position: absolute; right: -40px; top: -50px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.12); }
.hero::before { content: ""; position: absolute; right: 40px; bottom: -70px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.08); }
.hero h1 { color: inherit; position: relative; z-index: 1; }
.hero p { opacity: .92; position: relative; z-index: 1; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; position: relative; z-index: 1; }
.hero-stat { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22); border-radius: 16px; padding: 10px 12px; display: grid; align-content: start; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.hero-stat b { font-family: var(--font-display); font-size: 18px; font-weight: 800; line-height: 1.15; white-space: nowrap; }
.hero-stat span { font-size: 11.5px; opacity: .9; line-height: 1.3; }
:root[data-theme="dark"] .hero-stat { background: rgba(0,0,0,.12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero-stat { background: rgba(0,0,0,.12); } }

/* Pool cards */
.pool { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; display: grid; }
/* Pool and vendor cards: dish photo (or illustration on a warm gradient) with a dark fade, title over it */
.pool-art { position: relative; height: 176px; overflow: hidden; display: grid; place-items: center; color: #fff; }
.pool-art.small { height: 132px; }
.pool-art.g0 { background: linear-gradient(135deg, #7A3A12 0%, #C8641F 45%, #E9A23B 100%); }
.pool-art.g1 { background: linear-gradient(135deg, #3A1414 0%, #6E2F2B 50%, #B8682E 100%); }
.pool-art.g2 { background: linear-gradient(135deg, #1F3A26 0%, #3F6B3A 50%, #A99A38 100%); }
.pool-art.g3 { background: linear-gradient(135deg, #3B1F3F 0%, #7A3A52 50%, #D2783C 100%); }
.pool-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pool-art .illus { width: 118px; height: 118px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 70%); transform: translate(76px, 34px); }
.pool-art.small .illus { width: 96px; height: 96px; transform: translate(92px, 6px); }
.pool-art .illus svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 18px rgba(0,0,0,.28)); }
.pool-art .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.62) 100%); }
.ptag { position: absolute; left: 14px; top: 14px; z-index: 1; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 5px 10px; background: rgba(255,255,255,.92); color: #1F7A4A; }
.ptag.warn { background: rgba(245,176,74,.95); color: #3A2008; }
.ptag.bad { background: rgba(255,255,255,.92); color: var(--danger); }
.ptag.dim { background: rgba(255,255,255,.85); color: #5A4A40; }
.pool-art .fee-tag { position: absolute; right: 14px; top: 14px; z-index: 1; background: rgba(30,14,6,.34); border: 1px solid rgba(255,255,255,.28); border-radius: 14px; padding: 6px 10px; text-align: right; color: #fff; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.fee-tag b { display: block; font-family: var(--font-display); font-size: 18px; font-weight: 800; line-height: 1.1; }
.fee-tag s { opacity: .85; font-size: 11px; }
.fee-tag span { font-size: 11px; opacity: .9; }
.ptitle { position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 1; display: grid; gap: 1px; text-align: left; }
.ptitle h3, .ptitle strong { color: #fff; font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -.3px; line-height: 1.15; }
.pool-art.small .ptitle strong { font-size: 19px; }
.ptitle span { font-size: 12.5px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Home: the slim stats strip sticks under the top bar once the big dashboard has scrolled away */
.homemini { position: -webkit-sticky; position: sticky; top: calc(var(--kh, 100px) + 6px); z-index: 6; margin-bottom: -54px; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 14px; border-radius: 14px;
  background: radial-gradient(130% 160% at 85% 0%, #F7853C 0%, #E2561A 45%, #B93A0C 100%); color: #fff; font-size: 12.5px; box-shadow: 0 8px 18px rgba(185,58,12,.28);
  opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .22s ease, transform .22s cubic-bezier(.2,.8,.2,1); will-change: opacity, transform; }
.homemini.show { opacity: 1; transform: none; }
.homemini b { font-family: var(--font-display); font-size: 15px; font-weight: 800; margin-right: 2px; }
.homemini span { white-space: nowrap; }
.minebtns { display: grid; grid-template-columns: 1fr 52px; gap: 8px; }
.minebtns .btn { display: flex; align-items: center; justify-content: center; gap: 6px; }
.sharebtn { display: grid; place-items: center; padding: 0; border-radius: 15px; }
.mine-note { margin: 0; color: var(--muted); }
.waitbox { display: grid; gap: 12px; padding: 14px; border-radius: 20px; background: linear-gradient(135deg, color-mix(in srgb, #F5B04A 18%, var(--surface)) 0%, color-mix(in srgb, #F5B04A 6%, var(--surface)) 100%); border: 1px solid color-mix(in srgb, #F5B04A 38%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.wb-row { display: flex; align-items: center; gap: 12px; }
.wb-ring { position: relative; width: 56px; height: 56px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; gap: 1px; }
.wb-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.wb-ring circle { fill: none; stroke-width: 4; }
.wb-ring .trk { stroke: color-mix(in srgb, #F5B04A 22%, transparent); }
.wb-ring .arc { stroke: #F5B04A; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.16,1,.3,1); }
.wb-ring b { position: relative; font: 800 17px var(--font-display); color: var(--ink); }
.wb-ring small { position: relative; font-size: 9px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.wb-text { display: grid; gap: 2px; min-width: 0; }
.wb-text strong { font: 700 15.5px var(--font-display); color: var(--ink); line-height: 1.25; }
.wb-text span { font-size: 13px; color: var(--muted); }
.wb-btn { height: 50px; border-radius: 15px; }
/* First time it appears: the ring draws in and the box settles */
.waitbox.fresh { animation: wbIn .55s cubic-bezier(.16,1,.3,1) both; }
.waitbox.fresh .arc { animation: wbDraw 1.1s cubic-bezier(.16,1,.3,1) .1s both; }
@keyframes wbIn { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes wbDraw { from { stroke-dashoffset: var(--c); } }
.wb-ring::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 0 0 rgba(245,176,74,.35); animation: wbBreathe 2.4s ease-in-out infinite; }
@keyframes wbBreathe { 50% { box-shadow: 0 0 0 5px rgba(245,176,74,0); } }
.seatline { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seatline .hint { font-weight: 700; }
.dishtext { margin: 0; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pool .btn.wide:not(:disabled) { height: 52px; border-radius: 16px; background: linear-gradient(180deg, #E8590C, var(--accent)); box-shadow: 0 8px 20px rgba(217,72,15,.32); }
.pool-body { padding: 14px 16px 16px; display: grid; gap: 12px; }
.kbody { padding: 12px 14px 14px; display: grid; gap: 10px; }
.seats { display: flex; gap: 5px; flex-wrap: wrap; }
.seats i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); display: block; transition: background .3s; }
.seats i.on { background: var(--accent); }
.seats i.next { box-shadow: inset 0 0 0 2px var(--accent); background: transparent; }
.dishline { display: flex; gap: 6px; flex-wrap: wrap; }
.dishline span { font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.hint { color: var(--hint); font-weight: 600; }
.invite-card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 18px; display: flex; gap: 14px; align-items: center; }
.invite-card .blob { width: 52px; height: 52px; border-radius: 16px; background: var(--tint-3); display: grid; place-items: center; flex: none; color: var(--hint); }

/* Chips and buttons */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--hint-soft); color: var(--hint); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chip.dim { background: var(--surface); color: var(--muted); box-shadow: var(--shadow); }
:root[data-theme="dark"] .chip:not(.ok):not(.warn):not(.bad):not(.dim) { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip:not(.ok):not(.warn):not(.bad):not(.dim) { color: var(--accent); } }
button { font: inherit; cursor: pointer; border-radius: 14px; border: 1px solid transparent; padding: 10px 16px; font-weight: 700; }
.btn { background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn:hover { background: var(--accent-2); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; box-shadow: none; }
.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.wide { width: 100%; padding: 15px; font-size: 16px; }
.linkbtn { background: none; border: none; padding: 0; color: var(--accent); font-weight: 700; }
.wa { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: #1F8F4E; color: #fff; font-weight: 700; padding: 14px; border-radius: 14px; }
.wa.quiet { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

/* Forms */
label { font-size: 13.5px; font-weight: 600; display: block; margin-bottom: 6px; color: var(--muted); }
select, input, textarea { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(12, 8, 6, .48); display: flex; align-items: flex-end; justify-content: center; z-index: 30; opacity: 0; visibility: hidden; transition: opacity .32s ease, visibility 0s linear .38s; overscroll-behavior: contain; touch-action: none; }
.sheet-bg.open { opacity: 1; visibility: visible; transition: opacity .32s ease, visibility 0s; }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 10px 20px 0; display: grid; gap: 16px; align-content: start; }
.sheet { transform: translateY(105%); transition: transform .4s cubic-bezier(.2,.9,.25,1); overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); }
.sheet-bg.open .sheet { transform: translateY(0); }
.sheet { overflow-x: hidden; } .sheet > * { min-width: 0; }
.sheet.dragging { transition: none; }
.sheet::before { content: ""; width: 44px; height: 5px; border-radius: 99px; background: var(--line); justify-self: center; margin-top: 2px; }
body.locked { position: fixed; left: 0; right: 0; overflow: hidden; }
.sheet > :last-child { margin-bottom: 20px; }
.sheet-foot { position: sticky; bottom: 0; background: color-mix(in srgb, var(--surface) 84%, transparent); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); padding: 12px 0 calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; margin-bottom: 0 !important; }
.sheet-foot .tot { display: grid; line-height: 1.2; }
.sheet-foot .tot b { font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.sheet-foot .tot span { font-size: 12px; color: var(--muted); }
.sheet-foot .btn { flex: 1; padding: 15px; font-size: 16px; }
.closex { width: 36px; height: 36px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: var(--surface-2); border: none; color: var(--ink); flex: none; }
.group { display: grid; gap: 10px; }
.group-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.dishes { display: grid; gap: 10px; }
.dish { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; border-radius: 18px; padding: 10px; background: var(--surface-2); border: 2px solid transparent; cursor: pointer; margin: 0; color: var(--ink); font-size: 15px; font-weight: 600; }
.dish input { position: absolute; opacity: 0; pointer-events: none; }
.dish:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.dish:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.dish .tile { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; padding: 0; box-shadow: none; }
#siteList .tile svg { width: 22px; height: 22px; }
#siteHint:empty { display: none; }
.dish .tile svg { width: 40px; height: 40px; }
.dish .price { font-family: var(--font-display); font-weight: 700; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.tog { border-radius: 999px; padding: 8px 14px; background: var(--surface-2); border: 1.5px solid var(--line); color: var(--ink); font-weight: 600; font-size: 14px; }
.tog[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.qty { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.qty button { width: 38px; height: 38px; padding: 0; border-radius: 10px; background: var(--surface); border: none; box-shadow: var(--shadow); color: var(--ink); font-size: 20px; line-height: 1; }
.qty output { font-weight: 800; font-size: 17px; min-width: 30px; text-align: center; font-family: var(--font-display); }
.me-row { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-radius: 16px; padding: 12px 14px; }
.me-row .avatar { width: 36px; height: 36px; font-size: 15px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); border-radius: 16px; padding: 12px 14px; margin: 0; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
.switch input { appearance: none; width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; padding: 0; border: none; flex: none; cursor: pointer; transition: background .2s; }
.switch input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .2s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 21px; }
.sum { display: grid; gap: 6px; font-size: 14.5px; color: var(--muted); }
.sum div { display: flex; justify-content: space-between; gap: 10px; }
.sum div span:last-child { color: var(--ink); font-weight: 600; }
.pay { background: var(--surface-2); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.momo { display: flex; align-items: center; gap: 12px; }
.momo .logo { width: 42px; height: 42px; border-radius: 12px; background: #FFCC00; color: #1E1B24; display: grid; place-items: center; font-weight: 800; font-size: 12px; flex: none; }
.note { background: var(--hint-soft); color: var(--ink); border-radius: 16px; padding: 12px 14px; font-size: 14px; }
.err { color: var(--danger); font-size: 14px; min-height: 1em; }

/* Confirmation */
.success { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; justify-self: center; }
.codetiles { display: flex; gap: 8px; justify-content: center; align-items: center; }
.codetiles .cdash { font-style: normal; font: 800 30px var(--font-display); color: var(--muted); margin: 0 2px; }
.codetiles span { width: 54px; height: 64px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-2); font-family: var(--font-display); font-size: 34px; font-weight: 800; display: grid; place-items: center; }
:root[data-theme="dark"] .codetiles span { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .codetiles span { color: var(--accent); } }
.center { text-align: center; }

/* Orders tab */
.order-card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 14px; }
.order-card .head { display: flex; gap: 12px; align-items: center; }
.order-card .tile { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.order-card .tile svg { width: 34px; height: 34px; }
.order-card .c { margin-left: auto; text-align: right; flex: none; }
.order-card .c b { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: .08em; display: block; line-height: 1; white-space: nowrap; }
.order-card .c span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.track i { height: 6px; border-radius: 99px; background: var(--line); display: block; }
.track i.on { background: var(--accent); }
.status-text { font-size: 14.5px; }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* Wallet tab */
.balance { border-radius: 24px; padding: 22px; background: var(--ink); color: var(--bg); display: grid; gap: 6px; position: relative; overflow: hidden; }
.balance::after { content: ""; position: absolute; right: -30px; bottom: -60px; width: 160px; height: 160px; border-radius: 50%; background: var(--accent); opacity: .35; }
.balance b { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1.1; position: relative; z-index: 1; }
.balance span, .balance p { position: relative; z-index: 1; }
.ledger { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 6px 16px; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.ledger div:first-child { border-top: none; }

/* Tab bar */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; width: min(460px, calc(100% - 24px)); background: var(--surface); box-shadow: 0 10px 30px rgba(30,15,5,.18); border-radius: 22px; padding: 6px; display: grid; grid-template-columns: repeat(4, 1fr); z-index: 20; }
.kcard { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; display: grid; }
.kcard .head { display: flex; gap: 12px; align-items: center; }
.kcard .tile { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.kcard .tile svg { width: 46px; height: 46px; }
.tabbar button { background: none; border: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 8px 4px; font-size: 12px; font-weight: 700; border-radius: 16px; position: relative; }
.tabbar button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 11px; display: grid; place-items: center; padding: 0 5px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); width: min(480px, calc(100% - 24px)); background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px; font-size: 14.5px; z-index: 40; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.toast.show { display: block; }

/* Staff views (coordinator, kitchen, rider, host) */
.card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; }
.fee { text-align: right; flex: none; }
.fee b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--accent); line-height: 1.05; }
.fee span { font-size: 12.5px; color: var(--muted); }
.code { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: .12em; color: var(--accent); line-height: 1; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; }
.tile b { display: block; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12.5px; color: var(--muted); }
.flags { border-left: 4px solid var(--danger); background: var(--danger-soft); border-radius: 0 16px 16px 0; padding: 12px 14px; display: grid; gap: 4px; font-size: 14.5px; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps span { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.steps span.done { background: var(--ok-soft); color: var(--ok); }
.steps span.now { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.inline { display: grid; grid-template-columns: 1.2fr 1fr .8fr auto; gap: 8px; align-items: end; }
.table-wrap { overflow-x: auto; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
td select { padding: 6px 8px; width: auto; }
.labels { display: grid; gap: 8px; }
.labels > div { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.labels .lc { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .06em; }
.tick { color: var(--ok); font-weight: 700; }
.codebox { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.codebox input { font-family: var(--font-display); font-size: 24px; letter-spacing: .2em; text-align: center; text-transform: uppercase; }
.labels .lc { min-width: 3.4em; }
.labels .items { display: grid; gap: 2px; }
.quote { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; background: var(--hint-soft); border-radius: 16px; padding: 12px; }
.quote p { grid-column: 1 / -1; }
.menurow { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; align-items: center; }
.choice { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
.choice input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid2 > * { min-width: 0; }
.map { height: 240px; border-radius: 18px; overflow: hidden; position: relative; z-index: 0; background: var(--surface-2); }
.mpin { display: block; width: 24px; height: 24px; border-radius: 50% 50% 50% 0; background: var(--muted); transform: rotate(-45deg); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.mpin.on { background: var(--accent); }
.mpin.me { background: #2563EB; border-radius: 50%; transform: none; }
.leaflet-container { font-family: var(--font-body); }
.leaflet-popup-content { font-size: 14px; }
.admintabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.admintabs button { white-space: nowrap; background: var(--surface); box-shadow: var(--shadow); border: none; color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 14px; }
.admintabs button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.medit { display: grid; gap: 10px; }
.contactpick { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 13px; }
.mdish { display: grid; gap: 8px; padding: 10px; border-radius: 16px; background: var(--surface-2); }
.mtop { display: grid; grid-template-columns: 52px minmax(0, 1fr) 84px 32px; gap: 8px; align-items: center; }
.mphoto { position: relative; width: 52px; height: 52px; padding: 0; border: none; border-radius: 14px; overflow: hidden; background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.mphoto img { width: 100%; height: 100%; object-fit: cover; }
.mphoto .dishpic { background: none; }
.mphoto .cam { position: absolute; right: 2px; bottom: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
.mphoto.busy { opacity: .5; pointer-events: none; }
.mmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mmeta select { width: auto; }
.mextras { display: grid; gap: 6px; padding-left: 60px; }
.mextra { display: grid; grid-template-columns: minmax(0, 1fr) 84px 32px; gap: 8px; align-items: center; }
.mextra input, .mtop input { padding-top: 10px; padding-bottom: 10px; }
.xbtn { width: 32px; height: 32px; border-radius: 10px; border: none; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; cursor: pointer; }
.xbtn svg { width: 16px; height: 16px; }
.photogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.photogrid .mdish { justify-items: center; text-align: center; background: none; padding: 0; }
.photogrid .mphoto { width: 88px; height: 88px; border-radius: 18px; }
@media (max-width: 420px) { .mextras { padding-left: 0; } }
.menuedit { display: grid; grid-template-columns: 40px 1.4fr .6fr 1.5fr 1fr auto auto; gap: 8px; align-items: center; }
.dishpic { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; }
.dishpic svg { width: 34px; height: 34px; }
@media (max-width: 720px) { .menuedit { grid-template-columns: 40px 1fr 90px; } .menuedit [data-f="addons"], .menuedit [data-f="icon"] { grid-column: 2 / -1; } }
/* Admin: wide on laptops, one column on phones */
body.is-admin .wrap { max-width: 1240px; }
.aframe { display: grid; gap: 14px; }
.asub { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.asub:empty { display: none; }
.asub button { white-space: nowrap; background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; }
.asub button[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); }
.listbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.listbar select { width: auto; }
details.item { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
details.item > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; flex-wrap: wrap; min-height: 44px; }
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin-left: 4px; transition: transform .15s; flex: none; }
details.item[open] > summary::after { transform: rotate(-135deg); }
details.item[open] > summary { border-bottom: 1px solid var(--line); }
.ititle { display: grid; gap: 2px; min-width: 0; flex: 1 1 220px; }
.imeta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ibody { padding: 14px 16px 16px; display: grid; gap: 12px; }
.tablewrap { overflow-x: auto; margin: 0 -4px; }
.rtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.rtable th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.rtable td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rtable tr:last-child td { border-bottom: none; }
.up { color: var(--ok); font-size: 12px; font-weight: 700; white-space: nowrap; }
.down { color: var(--danger); font-size: 12px; font-weight: 700; white-space: nowrap; }
.skeleton { border-radius: 18px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.dtile { background: var(--surface); border: none; border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 4px; text-align: left; color: var(--ink); font: inherit; align-content: start; }
button.dtile:not([disabled]) { cursor: pointer; }
button.dtile:not([disabled]):hover { outline: 2px solid var(--accent-soft); }
.dtile b { font-family: var(--font-display); font-size: 26px; font-weight: 800; line-height: 1.1; }
.dtile span { font-size: 14px; font-weight: 600; }
.dtile small { font-size: 12.5px; color: var(--muted); }
.dtile.bad { box-shadow: inset 4px 0 0 var(--danger), var(--shadow); } .dtile.bad b { color: var(--danger); }
.dtile.warn { box-shadow: inset 4px 0 0 var(--hint), var(--shadow); } .dtile.warn b { color: var(--hint); }
.dtile.wide { grid-column: 1 / -1; }
.stagebar { display: flex; gap: 8px 14px; flex-wrap: wrap; font-size: 14px; }
.capline { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 14px; }
.capline i { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--w), var(--surface-2) var(--w)); }
.cards2 { display: grid; gap: 14px; }
.apptools { display: grid; gap: 12px; }
.listcta { display: grid; gap: 10px; box-shadow: inset 0 0 0 2px var(--accent-soft), var(--shadow); }
.score { color: var(--ok); font-weight: 600; align-self: center; }
.payalts { font-size: 14px; } .payalts summary { cursor: pointer; color: var(--accent-2); font-weight: 600; padding: 4px 0; }
.payalt { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
@media (min-width: 900px) {
  .aframe.has-sub { grid-template-columns: 200px minmax(0, 1fr); align-items: start; }
  .aframe.has-sub .asub { flex-direction: column; position: sticky; top: 12px; overflow: visible; }
  .aframe.has-sub .asub button { text-align: left; border-radius: 12px; white-space: normal; }
  .dash-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dtile.wide { grid-column: span 3; }
  .cards2 { grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); }
  body.is-admin .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.hidden { display: none !important; }
@media (max-width: 560px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .inline { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 25px; }
}

/* Status bar glass: only content scrolled up under the clock/battery area fades and blurs */
.statusglass { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); z-index: 26; pointer-events: none; background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
/* Fixed top area per page: crisp at rest; frosted glass once content scrolls under it */
.topzone { position: sticky; top: env(safe-area-inset-top); z-index: 20; display: grid; gap: 14px; margin: -12px -16px 0; padding: 12px 16px 12px; background: var(--bg); transition: background .2s, box-shadow .2s; }
.topzone.scrolled { background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); box-shadow: 0 1px 0 color-mix(in srgb, var(--line) 80%, transparent); }
.place .eyebrow { color: var(--muted); }
.place strong { font-weight: 800; color: var(--ink); }
.apptitle { flex: 1; margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -.4px; }
/* Home dashboard shrinks to one slim row while scrolling */
.hero .hero-text { position: relative; z-index: 1; display: grid; gap: 6px; max-height: 220px; opacity: 1; overflow: hidden; transition: max-height .38s cubic-bezier(.2,.8,.2,1), opacity .25s ease, margin .38s cubic-bezier(.2,.8,.2,1); }
.hero { transition: padding .38s cubic-bezier(.2,.8,.2,1), border-radius .38s, gap .38s; }
.topzone.compact .hero { padding: 10px 12px; border-radius: 18px; gap: 0; }
.topzone.compact .hero .hero-text { max-height: 0; opacity: 0; }
.topzone.compact .hero-stat { padding: 6px 10px; }
.topzone.compact .hero-stat b { font-size: 15px; }
.topzone.compact .hero-stat span { font-size: 10.5px; }
.topzone.compact .section-title { margin-top: 0; }
.kgroup { display: grid; gap: 12px; }

function makeSupabaseApi() {
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

  const rpc = async (fn, args) => must(await sb.rpc(fn, args || {}));
  const stamp = { accepted: "accepted_at", ready: "ready_at", picked_up: "picked_up_at", arriving: "arriving_at", delivered: "delivered_at" };
  return {
    demo: false,
    async load() {
      const soft = q => q.then(r => r.error ? null : r.data, () => null);   // optional tables: the app still works before the database update
      const [payMethods, popRows, scoreRows, scRows] = await Promise.all([soft(sb.from("payment_methods").select("*").eq("active", true).order("sort")), soft(sb.from("dish_popularity").select("*")), soft(sb.from("kitchen_scores").select("*")), soft(sb.from("site_kitchen_counts").select("*"))]);
      const pop = {}, scores = {}, siteCounts = {}; (popRows || []).forEach(r => { pop[r.item_id] = r.n; }); (scoreRows || []).forEach(r => { scores[r.kitchen_id] = r; }); (scRows || []).forEach(r => { (siteCounts[r.site_id] = siteCounts[r.site_id] || {})[r.kitchen_id] = r.n; });
      const [settings, sites, menus, items] = await Promise.all([
        sb.from("settings").select("*").eq("id", 1).single().then(must),
        sb.from("public_sites").select("*").order("name").then(must),
        sb.from("public_menus").select("*").order("public_name").then(must),
        sb.from("menu_items").select("*").eq("active", true).order("price").then(must)
      ]);
      return { settings, sites, menus, items, payMethods: payMethods || [], pop, scores, siteCounts };
    },
    async board(date) {
      // One call for the whole board (update 14); falls back to separate reads before the database update
      if (S.boardRpc !== false) { const r = await sb.rpc("board_data", { p_date: date }); if (!r.error) { S.boardRpc = true; return r.data; } if (/board_data|function|schema cache/i.test(r.error.message)) S.boardRpc = false; else throw new Error(r.error.message); }
      await sb.rpc("housekeeping");

        sb.from("public_pools").select("*").eq("order_date", date).then(must),
        sb.from("kitchen_load").select("*").eq("order_date", date).then(must),
        sb.from("recent_activity").select("*").order("created_at", { ascending: false }).limit(50).then(must),
        sb.from("kitchen_days").select("kitchen_id").eq("order_date", date).then(must)
      ]);

    },
    placeOrder: r => rpc("place_order", { p_site: r.site, p_item: r.item, p_qty: r.qty, p_name: r.name, p_phone: r.phone, p_ref: r.ref || null,
      p_addons: r.addons || [], p_note: r.note || null, p_special: r.special || null, p_use_wallet: !!r.useWallet, ...(r.join ? { p_join: r.join } : {}) }),
    payQuote: (id, ref, useWallet) => rpc("pay_quote", { p_order: id, p_ref: ref || null, p_use_wallet: !!useWallet }),
    myOrders: ids => rpc("my_orders", { p_ids: ids }),
    addVendor: r => rpc("add_vendor", { p_site: r.site, p_name: r.name, p_whatsapp: r.whatsapp, p_items: r.items, p_lat: r.lat ?? null, p_lng: r.lng ?? null }),

    async accountStats() { const r = await sb.rpc("admin_account_stats"); if (r.error && /function|schema cache/i.test(r.error.message)) throw new Error("Run update-7.sql in the Supabase SQL Editor once."); return must(r); },

    claimOrders: ids => rpc("claim_orders", { p_ids: ids }),
    wallet: () => rpc("my_wallet"),
    kitchenView: (t, d) => rpc("kitchen_view", { p_token: t, p_date: d }),
    kitchenOpenDay: (t, d) => rpc("kitchen_open_day", { p_token: t, p_date: d }),
    kitchenUpdate: (t, p, s) => rpc("kitchen_update", { p_token: t, p_pool: p, p_status: s }),
    kitchenQuote: (t, o, price) => rpc("kitchen_quote", { p_token: t, p_order: o, p_price: Number(price) }),
    async kitchenDecline(t, o, reason) { const r = await sb.rpc("kitchen_decline", { p_token: t, p_order: o, p_reason: reason || null });

// Pop-ups slide up/down smoothly; the page behind is locked so it never scrolls with the sheet
let sheetScrollY = 0;
function lockPage(on) {
  const b = document.body;
  if (on && !b.classList.contains("locked")) { sheetScrollY = window.scrollY; b.style.top = -sheetScrollY + "px"; b.classList.add("locked"); }
  if (!on && b.classList.contains("locked")) { b.classList.remove("locked"); b.style.top = ""; window.scrollTo(0, sheetScrollY); }

// Swipe down to close: drag from the top of the sheet, or anywhere once it's scrolled to the top
function initSheetDrag() {
  const sh = $("#sheet"); let y0 = null, t0 = 0, dy = 0, dragging = false;
  sh.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || e.target.closest(".map, input, textarea, select")) return;
    const top = e.touches[0].clientY - sh.getBoundingClientRect().top;
    if (top > 64 && sh.scrollTop > 0) return;
    y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; dragging = false;
  }, { passive: true });
  sh.addEventListener("touchmove", e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (!dragging && dy > 6 && sh.scrollTop <= 0) { dragging = true; sh.classList.add("dragging"); }
    if (dragging) { e.preventDefault(); sh.style.transform = `translateY(${Math.max(0, dy)}px)`; }
    else if (dy < 0) y0 = null;
  }, { passive: false });
  const end = () => {
    if (y0 == null) return; const v = dy / Math.max(1, Date.now() - t0); y0 = null;
    if (!dragging) return; dragging = false; sh.classList.remove("dragging");
    if (dy > sh.offsetHeight * 0.3 || v > 0.6) { sh.style.transform = "translateY(100%)"; setTimeout(closeSheet, 220); } else sh.style.transform = "";
  };
  sh.addEventListener("touchend", end); sh.addEventListener("touchcancel", end);
}

let leafletP;
function loadLeaflet() {
  if (window.L) return Promise.resolve(window.L);
  if (!leafletP) leafletP = new Promise((res, rej) => {
    // Served from this site (cached for offline); the public CDN is the fallback
    const add = (base, fallback) => {
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = base + "leaflet" + (fallback ? ".min" : "") + ".css"; document.head.appendChild(css);
      const s = document.createElement("script"); s.src = base + "leaflet" + (fallback ? ".min" : "") + ".js";
      s.onload = () => res(window.L); s.onerror = () => { if (!fallback) return add("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/", true); leafletP = null; rej(new Error("The map couldn't load. Check your connection and try again.")); };
      document.head.appendChild(s);
    };
    add("vendor/leaflet/", false);
  });

}
const ACCRA = { lat: 5.6037, lng: -0.1870 };
async function makeMap(el, center, zoom) {

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(m);
  setTimeout(() => m.invalidateSize(), 200);

}

function distM(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function geocode(q) {
  let r;

  try { r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=gh&viewbox=-0.45,5.85,0.15,5.45&bounded=0&accept-language=en&q=" + encodeURIComponent(q)); } catch (e) { r = null; }
  if (!r || !r.ok) throw new Error("Search isn't available right now. Tap the map to drop the pin instead.");
  return (await r.json()).map(x => { const parts = String(x.display_name).split(",").map(t => t.trim()).filter(t => t && t !== "Ghana");
    return { name: x.display_name, short: x.name || parts[0], rest: parts.slice(x.name && parts[0] === x.name ? 1 : 1, 4).join(", "), lat: +x.lat, lng: +x.lon }; });

function myPosition() {

// Waiting for the vendor: status, time left and the button together in one box

  const mine = myOrderIn(k), C = 2 * Math.PI * 19, frac = Math.max(0, Math.min(1, left / s.accept_timeout_min)), first = !(S.seenWait = S.seenWait || new Set()).has(k.id); S.seenWait.add(k.id);

/* Alerts: someone at your building ordered (opt-in, capped per day) */
// The bell is the one alerts switch: your own orders (even when the app is closed) + "someone here ordered" nudges
async function toggleAlerts() {
  if (local.get("cp_alerts")) {
    local.set("cp_alerts", false); $("#bell").setAttribute("aria-pressed", "false");
    return toast("Alerts off.");
  }
  if (!local.get("cp_alerts_explained")) {
    openSheet(`${sheetHead("Turn on alerts?", "ChopPool will let you know:")}
      <ul class="stack small" style="padding-left:20px;margin:0;gap:6px"><li>When the vendor confirms or cancels your pool</li><li>When your special request is priced</li><li>When lunch is 5 minutes away</li><li>When someone in ${esc(siteOf(S.siteId).name || "your building")} starts a pool (up to ${S.settings.notify_daily_cap} a day)</li></ul>
      ${isIOS() && !isStandalone() && pushReady() ? `<p class="note small">On iPhone, alerts reach you when the app is closed only after you add ChopPool to your Home Screen.</p>` : ""}
      <button class="btn wide" id="alertsYes">Turn on alerts</button><button class="ghost wide" data-close>Not now</button>`);
    $("#alertsYes").addEventListener("click", () => { local.set("cp_alerts_explained", true); closeSheet(); toggleAlerts(); });
    return;
  }
  local.set("cp_alerts", true); $("#bell").setAttribute("aria-pressed", "true");

}
function announceActivity() {
  const mineIds = (local.get("cp_orders") || []).map(o => o.id);
  const here = S.board.activity.filter(a => a.site_id === S.siteId && !mineIds.includes(a.id));
  const latest = here.reduce((t, a) => a.created_at > t ? a.created_at : t, "");
  if (!S.seen) { S.seen = latest || new Date().toISOString(); return; }
  const fresh = here.filter(a => a.created_at > S.seen).sort((a, b) => a.created_at < b.created_at ? -1 : 1);
  if (!fresh.length) return;
  S.seen = fresh.at(-1).created_at;
  if (!local.get("cp_alerts")) return;
  const key = "cp_alert_count_" + today(), n = local.get(key) || 0;
  if (n >= S.settings.notify_daily_cap) return;
  const a = fresh.at(-1), p = S.board.pools.find(x => x.id === a.pool_id) || { meals: 1, seq: 1 };
  const msg = "Someone at " + siteOf(a.site_id).name + " just ordered " + a.item_name + ". " + p.meals + " of " + S.settings.max_meals + " seats taken, delivery now " + money(feeFor(p.meals, S.settings, poolTrip(p))) + ".";
  local.set(key, n + 1); toast(msg); sysNotify("ChopPool", msg);
}

/* Orders tab */
const vendorWord = t => String(t || "").replace(/\bseller\b/g, "vendor").replace(/\bSeller\b/g, "Vendor");
function statusLine(o) { return vendorWord(statusLine0(o)); }
function statusLine0(o) {
  const site = siteOf(o.site_id), st = o.pool_status, seller = menuOf(o.kitchen_id).public_name || "The vendor";
  if (o.status === "cancelled" && /^You cancelled/.test(o.cancel_reason || "")) return o.cancel_reason + "." + (o.refund_needed ? " ChopPool will refund your MoMo payment." : o.has_account && Number(o.max_fee) ? " Your money is back in your wallet." : "");
  if (o.status === "cancelled" && /^The seller can't/.test(o.cancel_reason || "")) return o.cancel_reason + ". Nothing was charged. You can still order the standard meal.";
  if (o.status === "cancelled" && /did not confirm/.test(o.cancel_reason || "")) {
    const back = Number(o.refund_due || 0) + Number(o.wallet_used || 0);
    if (o.has_account && !o.refund_needed && back > 0) return "The vendor didn't confirm in time. " + money(back) + " is back in your wallet, ready for your next order.";
    if (o.refund_needed && Number(o.refund_due) > 0) return "The vendor didn't confirm in time. ChopPool will refund " + money(o.refund_due) + " to your MoMo, or create an account to get it in your wallet straight away.";
    if (o.refund_needed) return "The vendor didn't confirm in time. ChopPool will check your MoMo payment and refund it.";
    return "The vendor didn't confirm in time. Nothing was charged.";
  }
  if (o.status === "cancelled") return (o.cancel_reason || "Cancelled") + ". " + (S.user ? "Any wallet payment is back in your wallet; MoMo payments are refunded by ChopPool." : "ChopPool will refund your MoMo payment.");
  if (o.status === "collected") return "Collected. Enjoy your lunch.";
  if (o.status === "quote_requested") return "Waiting for " + seller + " to price your special request.";
  if (o.status === "quoted") return seller + " priced your request at " + money(o.quote_price) + " a meal. Check the total and pay before " + fmtTime(S.settings.cutoff) + " to confirm.";
  if (st === "waiting") return "Waiting for " + seller + " to confirm today. If they don't within " + S.settings.accept_timeout_min + " minutes, you get your money back.";
  if (o.status === "pending" && st === "collecting") return "Payment being checked.";
  if (st === "collecting") return "Confirmed. Pool " + o.pool_seq + " closes at " + fmtTime(S.settings.cutoff) + ".";
  if (st === "accepted") return "The kitchen is cooking.";
  if (st === "ready") return "Packed and waiting for delivery.";
  if (st === "picked_up") return "On the way to " + site.drop_point + ".";
  if (st === "arriving") return site.handoff === "host" ? "Arriving at " + site.drop_point + " in about 5 minutes." : "Arriving at " + site.drop_point + " in about 5 minutes. Bring code " + o.code + ".";
  if (st === "delivered") return site.handoff === "host" ? "Ready to collect from " + (site.host_label || site.drop_point) + ". Show code " + o.code + "." : "Delivery is at " + site.drop_point + " for " + S.settings.arrival_window_min + " minutes. Show code " + o.code + ".";
  return "";
}
function progressOf(o) {
  if (o.status === "collected") return 5;
  if (["cancelled", "quote_requested", "quoted"].includes(o.status) || o.pool_status === "waiting") return 0;
  return { collecting: o.status === "paid" ? 1 : 0, accepted: 2, ready: 2, picked_up: 3, arriving: 4, delivered: 4 }[o.pool_status] || 0;
}
async function refreshMine() {
  if (!$("#tabOrders")) return;
  const saved = (local.get("cp_orders") || []).filter(o => o.order_date >= today());
  let rows = [];
  if (saved.length || S.user) { try { rows = await api.myOrders(saved.map(o => o.id)); } catch (e) { return; } }
  S.mine = rows;
  const prev = S.mineStatus || {}; S.mineStatus = {};
  rows.forEach(o => {
    const key = o.status + "|" + o.pool_status; S.mineStatus[o.id] = key;
    const changed = prev[o.id] && prev[o.id] !== key;
    if (changed && (["arriving", "delivered"].includes(o.pool_status) || ["quoted", "cancelled"].includes(o.status) || (o.pool_status === "collecting" && prev[o.id].endsWith("|waiting"))) && o.status !== "collected") {
      const msg = statusLine(o); toast(msg); sysNotify("Your ChopPool lunch", msg);
    }
  });
  const active = rows.filter(o => !["collected", "cancelled"].includes(o.status)).length;
  $("#ordBadge").textContent = active; $("#ordBadge").classList.toggle("hidden", !active);
  if (S.tab === "orders") renderOrders();
  const sig = rows.map(o => o.id + o.status + o.pool_status).join(); if (sig !== S.mineSig) { S.mineSig = sig; if ($("#pools") && !S.noSite) renderPools(); }
}
// Customers can cancel until the cut-off; after that the kitchen is cooking

// What the pool has saved on this order's delivery: shown as cashback, and as a reason for guests to create an account

  if (o.has_account) return `<p class="small" style="color:var(--ok)">${fare} · ${o.status === "pending" ? money(v) + " to your wallet once your payment is confirmed" : money(v) + " added to your wallet"}</p>`;
  return `<div class="note" style="display:grid;gap:8px"><span><strong>${money(v)} cashback is waiting for you.</strong> Create a free account on this phone to keep it in your wallet for your next lunch.</span><button class="btn" data-keepcb>Create an account and keep ${money(v)}</button></div>`;

// Full bill for a priced special request, so the customer sees exactly what they pay for
function quoteBreakdown(o) {
  const q = Number(o.qty) || 1, rows = [[q + " × " + o.item_name + " with your request (vendor's price " + money(o.quote_price) + ")", Number(o.quote_price) * q]];
  if (Number(o.addons_total)) rows.push(["Add-ons: " + addonText(o.addons), Number(o.addons_total) * q]);
  if (o.max_fee != null) rows.push(["Delivery, full price", Number(o.max_fee) * q]);
  if (o.service_fee != null) rows.push([o.fee_per_meal && q > 1 ? "Service fee (" + money(o.service_fee) + " a meal)" : "Service fee", Number(o.service_fee) * (o.fee_per_meal ? q : 1)]);
  if (Number(o.wallet_used)) rows.push(["Wallet credit used", -Number(o.wallet_used)]);
  return `<div class="ledger" style="margin:4px 0 8px">${rows.map(([l, v]) => `<div><span>${esc(l)}</span><strong class="num">${v < 0 ? "−" : ""}${money(Math.abs(v))}</strong></div>`).join("")}
    <div><span><strong>Total to pay</strong></span><strong class="num">${money(o.amount_due)}</strong></div></div>

  return "ChopPool · " + TAGLINE + "\nLunch pool at " + site.name + " from " + k.public_name + ": " + p.meals + " of " + s.max_meals + " seats taken, delivery now " + money(fee) + " a meal." +

function openPinSheet(title, start, onSave) {
  let pin = start ? { lat: start.lat, lng: start.lng } : null, map, mk;
  openSheet(`${sheetHead(esc(title), "Search for the area, then tap the map on the exact spot.")}
    ${searchRow("pSearch", "Search: Osu, Oxford Street…")}
    <div class="chips">${useMeChip("pMe")}</div>
    <div id="pResults" class="stack"></div><div id="pMap" class="map" style="height:240px"></div>
    <div class="sheet-foot"><p class="small muted" id="pTxt" style="flex:1">${pin ? "Current pin shown. Tap to move it." : "Tap the map to drop the pin."}</p><button class="btn" id="pSave">Save location</button></div>`);
  const set = (p, z) => { pin = p; const L = window.L; if (!mk) mk = L.marker([p.lat, p.lng], { icon: pinIcon(L, "on") }).addTo(map); else mk.setLatLng([p.lat, p.lng]); if (z) map.setView([p.lat, p.lng], z); $("#pTxt").textContent = "Pin placed. Tap Save location."; };
  makeMap($("#pMap"), pin || ACCRA, pin ? 16 : 12).then(m => { map = m; if (pin) set(pin); m.on("click", e => set({ lat: e.latlng.lat, lng: e.latlng.lng })); }).catch(e => { $("#pMap").innerHTML = `<p class="err" style="padding:12px">${esc(cleanErr(e))}</p>`; });
  placeSearch($("#pSearch"), $("#pResults"), r => { if (map) { set(r, 17); $("#pResults").innerHTML = ""; $("#pSearch").value = ""; } });
  $("#pMe").addEventListener("click", async () => { try { const me = S.here = await myPosition(); if (map) set(me, 17); } catch (e) { toast(cleanErr(e)); } });
  $("#pSave").addEventListener("click", () => { if (!pin) return toast("Tap the map to drop the pin first."); closeSheet(); onSave(pin); });
}

function ordersCsv() {
  const A = S.admin || { orders: [], pools: [], sites: [], kitchens: [] };
  const cols = ["created_at", "order_date", "customer_name", "phone", "site", "kitchen", "pool", "item_name", "qty", "unit_price", "addons", "note", "special_request", "quote_price", "wallet_used", "momo_ref", "code", "status", "refund_needed", "collected_at"];
  const q = x => '"' + String(x ?? "").replace(/"/g, '""') + '"';
  const val = (o, c) => c === "site" ? (A.sites.find(x => x.id === o.site_id) || {}).name : c === "kitchen" ? (A.kitchens.find(x => x.id === o.kitchen_id) || {}).name
    : c === "pool" ? (A.pools.find(x => x.id === o.pool_id) || {}).seq : c === "addons" ? addonText(o.addons) : o[c];
  return [cols.join(",")].concat(A.orders.map(o => cols.map(c => q(val(o, c))).join(","))).join("\n");
}
/* =====================================================================================
   SELLER / KITCHEN VIEW (#kitchen-TOKEN): confirm today, price requests, labels by code
   ===================================================================================== */
async function viewKitchen(token) {

        N = await api.kitchenView(token, d === dNext ? dToday : dNext);

        <p class="muted">${fmtDate(d)} · ready by ${minus(S.settings.delivery_time, 30)} · ${used} of ${k.capacity} meals · ${k.delivery_mode === "runner" ? "you deliver with your own runner" : "a ChopPool rider collects"}</p></header>

        : appTools("#kitchen-" + token, { kitchen_token: token }, "Vendor")}
      ${dayTabs}
      ${k.open ? `<p><span class="chip ok">You're taking orders for ${dayLabel(d)}</span></p>`
        : k.paused ? `<section class="card"><h2>You're not cooking ${dayLabel(d)}</h2><p class="small muted">Customers can't order from you for ${fmtDate(d)}.</p><button class="ghost wide" id="unpause">I'm cooking ${dayLabel(d)} after all</button></section>`
        : `<section class="card" style="border-color:var(--accent)"><h2>${waiting.length ? "Customers are waiting for you" : "Are you cooking " + dayLabel(d) + "?"}</h2>
          <p>${waiting.length ? waiting.map(p => esc(p.site)).join(", ") + " want" + (waiting.length > 1 ? "" : "s") + " to order. Confirm within " + S.settings.accept_timeout_min + " minutes so the pool can open." : "Confirm so people can start ordering from you."}</p>

      ${autoCard(k, d)}

          : k.delivery_mode === "runner" && p.status === "picked_up" ? `<button class="btn wide" data-k="arriving" data-pool="${esc(p.id)}">5 minutes away</button>`

        const runnerHand = k.delivery_mode === "runner" && ["arriving", "delivered"].includes(p.status)

        return `<article class="card"><div class="top"><h2>${esc(p.site)} · Pool ${p.seq}</h2><span class="chip">${n} meals</span></div>${stepsHtml(p.status)}

          ${runnerHand}${btns}</article>`;
      }).join("") || `<p class="card muted">No orders yet for ${fmtDate(d)}. Orders close at ${fmtTime(S.settings.cutoff)}.</p>`}
      ${k.added_by_customer ? `<section class="card stack"><h2>Your menu</h2><p class="small muted">Check the dishes, prices and extras the customer added for you. Add as many dishes as you like, then save once.</p>
        ${menuEditor(K.menu, "vendor:" + token, false)}</section>`
        : K.menu.length ? `<section class="card stack"><h2>Dish photos</h2><p class="small muted">A good photo helps customers choose you. Tap a dish to add or change its photo. ChopPool manages your dishes and prices.</p>
        <div class="photogrid">${K.menu.map(i => `<div class="mdish" data-item="${esc(i.id)}"><button type="button" class="mphoto" data-photo aria-label="Photo for ${esc(i.name)}">${i.photo_url ? `<img src="${esc(i.photo_url)}" alt="" loading="lazy">` : `<span class="dishpic">${art(dishKind(i))}</span>`}<span class="cam">${CAM}</span></button><span class="small">${esc(i.name)}</span></div>`).join("")}</div></section>` : ""}`;
    $("#listMe")?.addEventListener("click", () => openListingForm(token, k));
    // Always cooking: weekdays that open automatically; one-tap pause for a single day
    const saveAuto = async list => { try { await api.kitchenSetAuto(token, list); notifyServer({ kitchen_token: token, date: d }); toast(list.length ? "Always cooking on " + daysText(list) + "." : "Always cooking is off. Confirm each day instead."); draw(); } catch (e) { toast(cleanErr(e)); } };
    $("#autoOn")?.addEventListener("change", e => saveAuto(e.target.checked ? [1, 2, 3, 4, 5] : []));
    $("#autoDays")?.addEventListener("click", e => { const b = e.target.closest("[data-dow]"); if (!b) return; const cur = new Set(k.auto_days || []), n = +b.dataset.dow; cur.has(n) ? cur.delete(n) : cur.add(n); saveAuto([...cur].sort()); });

    $("#unpause")?.addEventListener("click", async () => { try { await api.kitchenPause(token, d, false); if (!(k.auto_days || []).includes(isoDow(d))) await api.kitchenOpenDay(token, d); notifyServer({ kitchen_token: token, date: d }); toast("You're taking orders for " + dayLabel(d) + "."); draw(); } catch (e) { toast(cleanErr(e)); } });

  });

}

const DOW = [[1, "Mon"], [2, "Tue"], [3, "Wed"], [4, "Thu"], [5, "Fri"], [6, "Sat"], [7, "Sun"]];
const daysText = list => { const l = [...list].sort(); if (l.join() === "1,2,3,4,5") return "Mon–Fri"; if (l.join() === "1,2,3,4,5,6,7") return "every day"; return l.map(n => DOW[n - 1][1]).join(", "); };
function autoCard(k, d) {
  const on = (k.auto_days || []).length > 0, today_ = (k.auto_days || []).includes(isoDow(d));
  return `<section class="card stack" style="gap:10px"><label class="switch" style="background:none;padding:0"><span style="display:grid;gap:2px"><span>Always cooking</span><span class="small muted" style="font-weight:500">Pools open straight away on these days. No need to confirm each morning.</span></span><input type="checkbox" id="autoOn"${on ? " checked" : ""}></label>
    ${on ? `<div class="chips" id="autoDays">${DOW.map(([n, l]) => `<button type="button" class="tog" data-dow="${n}" aria-pressed="${(k.auto_days || []).includes(n)}">${l}</button>`).join("")}</div>
      <p class="small muted">You get an alert when a pool starts and a summary at ${fmtTime(S.settings.cutoff)} with the final meals.</p>` : ""}
    ${k.open && !k.paused && (today_ || k.confirmed) ? `<button class="linkbtn" id="pauseDay" style="justify-self:start;color:var(--danger)">Not cooking ${dayLabel(d)}? Pause ${fmtDate(d)}</button>` : ""}</section>`;
}

/* =====================================================================================
   RIDER VIEW (#rider-TOKEN) and HOST VIEW (#host-TOKEN)

function codeBox(id) {
  return `<form class="codebox" data-codeform><input id="${id}" maxlength="6" placeholder="K-27" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Customer code"><button class="btn">Hand over</button></form>`;
}
function wireCodes(token, d, redraw) {
  $("#view").addEventListener("submit", async e => {
    const f = e.target.closest("[data-codeform]"); if (!f) return;
    e.preventDefault();
    const input = f.querySelector("input"), code = normCode(input.value);
    if (!/^[A-Z]-\d{2,3}$|^\d{4}$/.test(code)) return toast("Enter the customer's code, like K-27.");
    const pool = (input.id.match(/^r?c-(.+)$/) || [])[1] || null;
    try {
      const r = await api.collectCode(token, code, typeof d === "function" ? d() : d, pool);
      toast("Give " + (r.items || r.qty + " × " + r.item_name) + " to " + r.name + "." + (r.was_paid ? "" : " Note: payment was not yet confirmed."));
      input.value = ""; redraw();
    } catch (err) { toast(cleanErr(err)); }
  });
}
// Orders grouped by code (a code can hold added plates), sorted A→Z
const byCode = os => { const m = new Map(); os.forEach(o => { if (!m.has(o.code)) m.set(o.code, []); m.get(o.code).push(o); }); return [...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1); };
const handList = os => `<div class="labels">${byCode(os).map(([c, g]) => `<div><span class="lc num">${esc(c)}</span><span>${esc(g[0].name)} · ${g.map(o => o.qty + " × " + esc(o.item_name)).join(" + ")}</span>${g.every(o => o.collected) ? `<span class="tick">Collected</span>` : `<span class="muted small">Waiting</span>`}</div>`).join("")}</div>`;
async function viewRider(token) {
  const d = opsDate();
  const NEXT = { ready: ["picked_up", "Picked up"], picked_up: ["arriving", "5 minutes away"], arriving: ["delivered", "Arrived"] };
  const draw = async () => {
    let R; try { R = await api.riderView(token, d); } catch (e) { $("#view").innerHTML = `<p class="card err">${esc(cleanErr(e))}</p>`; return; }
    $("#view").innerHTML = `<header class="topzone pagetop"><div class="pagehead"><div class="pagebrand">${LOGO(30)}<p class="brand" style="font-size:18px">ChopPool rider</p></div>${themeBtn()}</div><h1>${esc(R.rider.name)}</h1><p class="muted">${fmtDate(d)} · deliver by ${fmtTime(S.settings.delivery_time)}</p></header>` +
      (R.pools.map((p, i) => {
        const nx = NEXT[p.status];

        return `<article class="card"><div class="top"><h2>Stop ${i + 1}: ${esc(p.site)}</h2><span class="chip">${p.meals} meals</span></div>${stepsHtml(p.status)}
          <p class="small"><strong>Pick up:</strong> ${esc(p.kitchen)}${p.kitchen_address ? ", " + esc(p.kitchen_address) : ""}${p.kitchen_phone ? " · " + esc(p.kitchen_phone) : ""}</p>
          <p class="small"><strong>Drop:</strong> ${esc(p.drop_point)} (Pool ${p.seq}, 1 bag)</p>${hand}${btn}</article>`;

  };
  $("#view").addEventListener("click", async e => {

  });
  wireCodes(token, d, draw);
  await draw(); every(() => { if (!document.activeElement?.matches("[data-codeform] input")) draw(); }, 30000);
}
async function viewHost(token) {
  const d = opsDate();
  const draw = async () => {
    let H; try { H = await api.hostView(token, d); } catch (e) { $("#view").innerHTML = `<p class="card err">${esc(cleanErr(e))}</p>`; return; }

let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
const isStandalone = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; } };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

// Install: Android shows the system prompt; iPhone gets the Share › Add to Home Screen steps. The icon then opens this page.

  if (home) local.set("cp_home", home);
  if (isStandalone()) return toast("ChopPool is already installed on this phone.");
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; return; }
  openSheet(`${sheetHead("Install ChopPool", isIOS() ? "On iPhone, it takes three taps:" : "Add ChopPool to your home screen:")}
    ${isIOS() ? `<ol class="stack small" style="padding-left:20px;margin:0"><li>Open this page in <strong>Safari</strong>.</li><li>Tap the <strong>Share</strong> button (the square with an arrow).</li><li>Scroll down and tap <strong>Add to Home Screen</strong>, then <strong>Add</strong>.</li></ol><p class="small muted">Alerts on iPhone work once ChopPool is on your home screen (iOS 16.4 or later).</p>`
      : `<ol class="stack small" style="padding-left:20px;margin:0"><li>Open your browser menu (⋮).</li><li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li></ol>`}
    <button class="ghost wide" data-close>Done</button>`);
}
const b64u8 = s => { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); };
// Switch on push alerts for this phone. extra says what to hear about: order ids, a seller link or a rider link.
async function pushSubscribe(extra, quiet) {
  if (!pushReady()) { if (!quiet && isIOS() && !isStandalone()) installApp(); return false; }
  try {
    if (Notification.permission !== "granted") { if (quiet) return false; if (await Notification.requestPermission() !== "granted") { toast("Alerts are blocked. Allow notifications for this site in your phone settings."); return false; } }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u8(CONFIG.VAPID_PUBLIC_KEY) });
    const j = sub.toJSON(); await api.savePushSub({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, ...extra });
    local.set("cp_push", true); return true;
  } catch (e) { if (!quiet) toast("Couldn't switch on alerts: " + cleanErr(e)); return false; }
}
const notifyServer = body => { if (!pushReady()) return; try { api.notify(body).catch(() => {}); } catch (e) {} };

/* ---------- Ratings from real orders (no typed reviews) ---------- */
function scoreLine(k) {
  const sc = (S.scores || {})[k.id];
  if (!sc || (sc.orders || 0) < 20) return `<span class="chip">New on ChopPool</span>`;
  const parts = [sc.on_time != null ? sc.on_time + "% on time" : "", sc.orders + " orders", sc.come_back != null ? sc.come_back + "% come back" : ""].filter(Boolean);
  return `<span class="small score">${esc(parts.join(" · "))}</span>`;
}
const rank = k => { const sc = (S.scores || {})[k.id] || {}; return (sc.orders >= 20 ? 1 : 0) * 1000 + (sc.come_back || 0) * 3 + (sc.on_time || 0) * 2 + (sc.reliable || 0) + Math.min(sc.orders || 0, 200) / 10; };
